# BECONIC CI — PR마다 설치·lint·build·테스트·회귀를 실행한다.
# main 보호 규칙(Required status checks)에 아래 job 이름을 등록하면 전부 통과해야 merge 가능.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint · 저장소 위생
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: 저장소 위생 (.env·비밀키·PDF 원본·대용량)
        run: node scripts/check-repo-hygiene.mjs
      - name: ESLint
        run: npm run lint

  build:
    name: Build (타입체크·번들 비밀키 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      # 운영과 같은 화면 스위치(원문 근거·AI 해석 on)로도 빌드해 번들 비밀키 검사 — 스위치 off 빌드에서는 해당 코드가 빠져 검사를 통과할 수 있음
      - name: Build (화면 스위치 on)
        run: npm run build
        env:
          VITE_ROADMAP_EVIDENCE: 'on'
          VITE_AI_INTERPRET: 'on'

  test:
    name: Unit · v0.9 Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - name: 로드맵 파서·공개 색인 무결성 (원문 PDF 불필요)
        run: npm run test:roadmap
      - name: 지원사업 MATCH 서버 함수 (정규화·중복제거·마감·캐시·AI 근거 대조, fetch 스텁)
        run: node --test grants/tests/server.test.mjs
      - name: 지원사업 MATCH 공고문 분석 정확도 (검증 세트 1·2·3차 각 60건, 기준 미달 시 실패)
        run: node grants/tests/eval-accuracy.mjs --all --check
      - name: IR 진단 단위 (문항 모델·점수·재무 추출·표현·이스케이프)
        run: node --test ir/tests/*.test.mjs
      - name: CI E2E 대상 고르기 규칙
        run: node --test scripts/ci/changed-apps.test.mjs

  # ── E2E: 바뀐 앱만, 앱별 병렬 ──────────────────────────────────────────
  # 이전에는 한 작업에서 앱 QA를 차례로 돌려 앱이 늘수록 길어졌고(약 9.5분), 설치(apt)가 느린 날 시간 초과.
  # PR은 바뀐 폴더의 앱만(scripts/ci/changed-apps.mjs), main push·수동 실행은 전체. 공통 파일이 바뀌면 전체.
  changes:
    name: E2E 대상 고르기
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: pick
        run: node scripts/ci/changed-apps.mjs >> "$GITHUB_OUTPUT"
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  e2e-app:
    name: E2E · ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    # ubuntu-latest가 26.04로 바뀐 뒤 Playwright 1.56.1이 Chromium 설치를 거부(지원 OS 아님) → 지원되는 24.04로 고정
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      # 브라우저·폰트는 캐시해 두고 다시 쓴다(apt 미러가 느린 날 설치만 15분 넘게 걸린 사례)
      - name: Chromium 캐시
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Chromium 설치
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Chromium 실행 확인(필요할 때만 시스템 라이브러리 설치)
        run: node -e "require('playwright').chromium.launch().then(b=>b.close())" || npx playwright install-deps chromium
      - name: 한글 폰트 캐시
        id: font-cache
        uses: actions/cache@v4
        with:
          path: ~/fonts-noto-cjk
          key: fonts-noto-cjk-ubuntu-24.04-v1
      - name: 한글 폰트 설치 (PDF 검수용)
        run: |
          if [ -d ~/fonts-noto-cjk ] && [ -n "$(ls -A ~/fonts-noto-cjk)" ]; then
            sudo mkdir -p /usr/share/fonts/opentype/noto && sudo cp ~/fonts-noto-cjk/* /usr/share/fonts/opentype/noto/
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 fonts-noto-cjk
            mkdir -p ~/fonts-noto-cjk && cp /usr/share/fonts/opentype/noto/NotoSansCJK* /usr/share/fonts/opentype/noto/NotoSerifCJK* ~/fonts-noto-cjk/ 2>/dev/null || true
          fi
          fc-cache -f >/dev/null
      - name: PDF 도구 (기술진단·성장·PSF pymupdf, IR·재무 poppler)
        run: |
          case "${{ matrix.app }}" in
            tech|growth|psf) pip install pymupdf ;;
            ir|finance) sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 poppler-utils ;;
          esac
      - name: QA
        run: bash scripts/ci/app-qa.sh ${{ matrix.app }}
      - name: 검수 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.app }}
          path: |
            tests/e2e/out/
            ${{ matrix.app }}/tests/out/
          if-no-files-found: ignore
          retention-days: 14

  # main 보호 규칙의 필수 검사 이름을 그대로 유지하는 요약 작업 — 앱별 작업이 모두 통과(또는 대상 없음)해야 통과
  e2e:
    name: E2E · 사용자 플로우 · PDF QA
    needs: [changes, e2e-app]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 앱별 E2E 결과
        run: |
          echo "대상: ${{ needs.changes.outputs.apps }} · 결과: ${{ needs.e2e-app.result }}"
          case "${{ needs.changes.result }}/${{ needs.e2e-app.result }}" in
            success/success|success/skipped) exit 0 ;;
            *) echo "앱별 E2E 실패 또는 취소"; exit 1 ;;
          esac

  db:
    name: DB · 로드맵 KB 마이그레이션
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 역할 준비 (anon·authenticated·service_role)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls; grant usage on schema public to anon, authenticated, service_role;"
      - name: 마이그레이션 적용 (2회 — 재실행 안전성)
        run: |
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: 검색 함수·접근 통제 검증 (가짜 문단)
        run: psql -v ON_ERROR_STOP=1 -q -f tests/db/verify_roadmap_kb.sql
