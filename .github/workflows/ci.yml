# BECONIC CI — PR마다 설치·lint·build·테스트·회귀를 실행한다.
# main 보호 규칙(Required status checks)에 아래 job 이름을 등록하면 전부 통과해야 merge 가능.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  lint:
    name: Lint · 저장소 위생
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - name: 저장소 위생 (.env·비밀키·PDF 원본·대용량)
        run: node scripts/check-repo-hygiene.mjs
      - name: ESLint
        run: npm run lint

  build:
    name: Build (타입체크·번들 비밀키 검사)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      # 운영과 같은 화면 스위치(원문 근거·AI 해석 on)로도 빌드해 번들 비밀키 검사 — 스위치 off 빌드에서는 해당 코드가 빠져 검사를 통과할 수 있음
      - name: Build (화면 스위치 on)
        run: npm run build
        env:
          VITE_ROADMAP_EVIDENCE: 'on'
          VITE_AI_INTERPRET: 'on'

  test:
    name: Unit · v0.9 Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - run: npm test
      - name: 로드맵 파서·공개 색인 무결성 (원문 PDF 불필요)
        run: npm run test:roadmap

  e2e:
    name: E2E · 사용자 플로우 · PDF QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      - name: Chromium 설치
        run: npx playwright install --with-deps chromium
      - name: 한글 폰트 설치 (PDF 검수용)
        run: sudo apt-get install -y fonts-noto-cjk
      - run: pip install pymupdf
      - run: npm run build
      - name: 스모크 E2E (6개 화면 크기·전부 모름·PDF 섹션)
        run: node tests/e2e/smoke.mjs
      - name: v0.9 대비 사용자 플로우 동등성 (실제 클릭)
        run: node tests/e2e/flow-parity.mjs
      - name: A4 PDF 페이지별 검수 (7종)
        run: npm run test:pdf
      - name: 검수 결과물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: tests/e2e/out/
          retention-days: 14

  db:
    name: DB · 로드맵 KB 마이그레이션
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 역할 준비 (anon·authenticated·service_role)
        run: |
          psql -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin bypassrls; grant usage on schema public to anon, authenticated, service_role;"
      - name: 마이그레이션 적용 (2회 — 재실행 안전성)
        run: |
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
          for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: 검색 함수·접근 통제 검증 (가짜 문단)
        run: psql -v ON_ERROR_STOP=1 -q -f tests/db/verify_roadmap_kb.sql
