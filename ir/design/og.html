<!DOCTYPE html>
<!-- 예비 OG 이미지(텍스트형) 원본. 현재 사이트 OG는 대표 제공 배너. `npm run images` → design/og-text-1200x630.jpg -->
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:'Pretendard',sans-serif;display:flex;letter-spacing:-.02em;word-break:keep-all;overflow:hidden}
.l{width:420px;background:#1a2a56;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.l::after{content:"";position:absolute;right:0;top:0;bottom:0;width:10px;background:#3182f6}
.l img{width:210px;height:210px;margin-bottom:30px}
.l b{font-size:54px;font-weight:800;letter-spacing:.01em;line-height:1}
.l .s{font-size:34px;font-weight:700;color:#dbe5ff;margin-top:14px}
.l .by{font-size:19px;font-weight:500;color:#93a1cc;margin-top:22px;padding-top:16px;border-top:3px solid #3182f6}
.r{flex:1;background:#f2f4f6;padding:0 60px;display:flex;flex-direction:column;justify-content:center}
.q{font-size:27px;font-weight:700;color:#4e5968;margin-bottom:16px}
h1{font-size:62px;font-weight:800;line-height:1.24;color:#191f28;letter-spacing:-.04em}
h1 em{font-style:normal;color:#1b64da}
.rows{margin-top:30px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 20px;font-size:24px;font-weight:700;color:#191f28;width:fit-content}
.d{width:14px;height:14px;border-radius:50%}
.d.b{background:#d22030}.d.o{background:#0a8754}.d.g{background:#b0b8c1}
.row small{font-size:20px;color:#6b7684;font-weight:600}
</style></head><body>
<div class="l"><img src="../assets/shield-white.png" alt=""><b>BECONIC</b><span class="s">IR 진단</span><span class="by">by Growth Ventures</span></div>
<div class="r">
  <p class="q">우리 회사 IR, 투자자 관점에서 준비되어 있나요?</p>
  <h1>투자자가 묻기 전에<br><em>근거부터</em> 맞춰 두세요</h1>
  <div class="rows">
    <div class="row"><span class="d b"></span>덱 숫자 ↔ 원자료 대사 <small>차이는 금액·위치로</small></div>
    <div class="row"><span class="d o"></span>현금·지분·자금 용도 합계 확인</div>
    <div class="row"><span class="d g"></span>미제출 자료 · 근거 보고서(PDF)</div>
  </div>
</div>
</body></html>
