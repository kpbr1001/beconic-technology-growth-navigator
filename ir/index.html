<style>
:root{
  --blue:#3182f6; --blue-d:#1b64da; --blue-soft:#e8f3ff;
  --navy:#1a2a56; --navy-2:#142044; --orange:#e8921a;
  --ink:#191f28; --sub:#4e5968; --muted:#6b7684; --line:#e5e8eb; --line-2:#f2f4f6;
  --bg:#f2f4f6; --card:#fff;
  --ok:#0a8754; --ok-soft:#e5f6ee; --warn:#a85d00; --warn-soft:#fff3e0; --bad:#d22030; --bad-soft:#ffebee;
  --r:20px; --r-sm:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);background:var(--bg);line-height:1.6;letter-spacing:-.012em;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
a{color:var(--blue-d)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #90c2ff;outline-offset:2px;border-radius:8px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.narrow{max-width:680px}
.muted{color:var(--muted)} .sm{font-size:13px}
.hint{font-size:13.5px;color:var(--muted);margin:6px 0 12px}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:background .15s,transform .05s;min-height:46px}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);color:#fff}.btn.primary:hover{background:var(--blue-d)}
.btn.ghost{background:var(--line-2);color:var(--ink)}.btn.ghost:hover{background:#e5e8eb}
.btn.white{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:13.5px;min-height:38px;border-radius:10px}
.btn.lg{padding:16px 24px;font-size:17px;border-radius:16px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:6px 0;color:var(--blue-d);font-weight:600;cursor:pointer;text-decoration:none;font-size:15px}
.link.sm{font-size:13px}.link.danger{color:var(--bad)}
.file{display:inline-flex;cursor:pointer}

/* 머리글 */
header.site{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .txt{display:flex;flex-direction:column;line-height:1.15}
.brand b{font-size:18px;font-weight:800;letter-spacing:.02em;color:var(--navy)}
.brand small{font-size:11.5px;color:var(--muted);font-weight:600}
.hd-act{display:flex;gap:6px}

/* 홈 */
.hero{background:linear-gradient(180deg,#fff 0%,#f5f8ff 100%);border-bottom:1px solid var(--line)}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-top:52px;padding-bottom:52px}
.eyebrow{color:var(--blue-d);font-weight:700;font-size:14px;margin:0 0 12px}
.hero h1{font-size:44px;line-height:1.25;font-weight:800;letter-spacing:-.035em}
.hero h1 em{font-style:normal;color:var(--blue-d)}
.lead{font-size:17px;color:var(--sub);margin:18px 0 26px;max-width:560px}
.cta-row{display:flex;gap:10px;flex-wrap:wrap}
.micro{font-size:13px;color:var(--muted);margin:12px 0 0}
.hero-card{background:#fff;border-radius:24px;box-shadow:0 2px 6px rgba(0,27,55,.04),0 16px 40px rgba(0,27,55,.08);padding:20px 22px}
.hc-top{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:16px}
.hc-top small{font-weight:600;color:var(--muted);font-size:12px;background:var(--line-2);border-radius:6px;padding:2px 8px}
.hc-g{display:flex;justify-content:center;margin:6px 0 2px}
.sec-t{font-size:26px;font-weight:800;margin:56px 0 18px;letter-spacing:-.03em}
.sub{color:var(--sub);margin:-6px 0 18px}
.cards4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.fcard{background:#fff;border-radius:var(--r);padding:22px}
.fcard b{display:block;font-size:17px;margin:12px 0 6px}.fcard p{margin:0;color:var(--sub);font-size:14.5px}
.ic{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;background:var(--blue-soft);color:var(--blue-d);font-weight:800;font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.panel{background:#fff;border-radius:var(--r);padding:24px}.panel h3{font-size:18px;margin-bottom:10px}
.panel ul{margin:0;padding-left:20px;color:var(--sub)}.panel li{margin:4px 0}
.ok-p h3{color:var(--ok)}.no-p h3{color:var(--bad)}
.steps ol{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
.steps li{background:#fff;border-radius:var(--r);padding:20px;counter-increment:s}
.steps li::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;font-size:14px;margin-bottom:10px}
.steps b{display:block;font-size:16px}.steps span{color:var(--sub);font-size:14px}
.consult{margin-top:56px}
.cbox{background:var(--navy);color:#fff;border-radius:24px;padding:28px;display:flex;gap:20px;align-items:center;justify-content:space-between}
.cbox b{font-size:20px}.cbox p{color:#c9d3ee;margin:6px 0 0}.cbtn{display:flex;gap:8px;flex-wrap:wrap}
.cbox .btn.ghost{background:rgba(255,255,255,.12);color:#fff}

footer.site{background:var(--navy-2);color:#b8c3e0;margin-top:64px;padding:40px 0 calc(40px + env(safe-area-inset-bottom))}
.f-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}.f-brand b{color:#fff;font-size:18px;display:block}.f-brand small{font-size:12px;color:#93a1cc}
.ft p{margin:6px 0;font-size:13px}.ft a{color:#dbe3f7}.f-cert{color:#fff;font-weight:600}.f-legal{color:#93a1cc}.f-ver{color:#7381ad;font-size:12px}

/* 공통 카드·폼 */
.pg-t{font-size:28px;font-weight:800;margin:10px 0 6px;letter-spacing:-.03em}.pg-s{color:var(--sub);margin:0 0 20px}
.back{display:inline-block;margin-top:18px;font-weight:600;text-decoration:none;color:var(--sub);font-size:14px;background:none;border:0;cursor:pointer;padding:0}
.card{background:#fff;border-radius:var(--r);padding:22px;margin-bottom:12px}
.card h3{font-size:18px;margin-bottom:6px}
.fld{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:700;color:var(--sub);margin-bottom:18px}
input,select{width:100%;border:1px solid var(--line);background:#f9fafb;border-radius:12px;padding:13px 14px;font-size:16px;font-weight:500;color:var(--ink)}
input:focus,select:focus{outline:none;border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(49,130,246,.15)}
.err{color:var(--bad);font-weight:600;font-size:14px;min-height:1em;margin:0}
.bottom-bar{position:sticky;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom));z-index:30;margin-top:24px}
.bb{display:flex;gap:10px;align-items:center;justify-content:space-between}
.syn-band{background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13.5px;border-radius:12px;padding:10px 14px;margin:12px 0}
.choice{display:grid;gap:8px}
.choice.c2{grid-template-columns:1fr 1fr}
.choice button{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:14px;text-align:left;cursor:pointer;transition:.12s}
.choice button b{display:block;font-size:16px;color:var(--ink)}.choice button span{font-size:13px;color:var(--muted);font-weight:500}
.choice button.on{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 0 0 1px var(--blue) inset}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--sub)}
.chips button.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-d)}

/* 문항 화면 */
.qtop{position:sticky;top:60px;z-index:20;background:var(--bg);padding:12px 0 8px}
.qtop-r{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;font-weight:700;color:var(--muted)}
.qbar{height:6px;background:#e5e8eb;border-radius:99px;margin-top:8px;overflow:hidden}.qbar i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .2s}
.qcat{display:inline-flex;gap:6px;align-items:center;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--blue-d);margin-top:14px}
.qtitle{font-size:25px;line-height:1.38;font-weight:800;letter-spacing:-.03em;margin:12px 0 6px}
.qwhy{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.evtog{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer;font-size:14.5px;font-weight:600;color:var(--sub)}
.evtog input{width:22px;height:22px;flex:none;accent-color:var(--blue)}
.opts{display:grid;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;border:1.5px solid transparent;background:#fff;border-radius:16px;padding:15px 16px;text-align:left;cursor:pointer;transition:.12s;font-size:15.5px;line-height:1.5;color:var(--ink);min-height:56px}
.opt:hover{border-color:#c9e2ff}
.opt .n{flex:none;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--line-2);color:var(--sub);font-weight:800;font-size:14px}
.opt.on{border-color:var(--blue);background:var(--blue-soft)}.opt.on .n{background:var(--blue);color:#fff}
.opt.unk{background:transparent;border:1.5px dashed #c5cbd3;color:var(--muted);justify-content:center;font-weight:600;min-height:48px}
.opt.unk.on{border-style:solid;border-color:var(--orange);color:var(--warn);background:var(--warn-soft)}

/* 재무 업로드 */
.drop{border:2px dashed #c9d3e0;border-radius:18px;padding:28px 18px;text-align:center;background:#fafbfc;cursor:pointer;display:block}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.drop b{display:block;font-size:17px;margin-bottom:4px}.drop span{color:var(--muted);font-size:14px}
.ftbl{width:100%;border-collapse:collapse;font-size:14px}
.ftbl th,.ftbl td{padding:8px 6px;border-bottom:1px solid var(--line-2);text-align:left}
.ftbl th{font-size:12.5px;color:var(--muted);font-weight:700}
.ftbl input{padding:9px 10px;font-size:15px;text-align:right}
.ftbl tr.miss td:first-child{color:var(--warn);font-weight:700}
.ftbl .src{font-size:11.5px;color:var(--muted);display:block;font-weight:500}
.stat{display:flex;gap:8px;align-items:center;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:600;margin:10px 0}
.stat.ok{background:var(--ok-soft);color:var(--ok)}.stat.warn{background:var(--warn-soft);color:var(--warn)}.stat.info{background:var(--blue-soft);color:var(--blue-d)}
details.how{background:#fff;border-radius:14px;padding:4px 16px;margin:12px 0}
details.how summary{cursor:pointer;font-weight:700;padding:12px 0;list-style:none}details.how summary::-webkit-details-marker{display:none}
details.how ol{margin:0 0 12px;padding-left:20px;color:var(--sub);font-size:14.5px}

/* 결과 */
.res-h{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:18px 0 10px;flex-wrap:wrap}
.res-h h1{font-size:24px;font-weight:800}.res-h small{color:var(--muted);font-size:13px}
.sum-card{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.sum-lines{margin:0;padding:0;list-style:none}.sum-lines li{padding:7px 0;border-bottom:1px solid var(--line-2);font-size:15px}.sum-lines li:first-child{font-weight:700;font-size:16px}
.sum-lines li:last-child{border-bottom:0}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bdg{font-size:12.5px;font-weight:700;border-radius:8px;padding:4px 9px;background:var(--line-2);color:var(--sub)}
.bdg.ok{background:var(--ok-soft);color:var(--ok)}.bdg.warn{background:var(--warn-soft);color:var(--warn)}.bdg.bad{background:var(--bad-soft);color:var(--bad)}.bdg.info{background:var(--blue-soft);color:var(--blue-d)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ch-wrap{display:flex;justify-content:center}
.ch-wrap svg{max-width:100%;height:auto}
.cbars{display:grid;gap:10px}
.cbar{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:14px}
.cbar b{font-weight:700}.cbar .track{height:12px;background:var(--line-2);border-radius:99px;overflow:hidden;position:relative}
.cbar .track i{display:block;height:100%;border-radius:99px}
.cbar em{font-style:normal;font-weight:800;text-align:right}
.cbar small{grid-column:2/4;margin-top:-6px;font-size:12px;color:var(--muted)}
.lst{display:grid;gap:10px}
.it{border-radius:14px;padding:13px 14px;background:var(--line-2)}
.it .h{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:700;font-size:15px}
.it p{margin:4px 0 0;font-size:14px;color:var(--sub)}
.it .nx{margin-top:6px;font-size:14px;color:var(--ink)}.it .nx b{color:var(--blue-d)}
.it.good{background:#f3fbf7}.it.need{background:#fff8ef}
.dots{display:inline-flex;gap:3px}.dots i{width:8px;height:8px;border-radius:50%;background:#d6dbe1}.dots i.on{background:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{border-radius:14px;padding:13px 14px;background:var(--line-2)}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:600}.kpi b{font-size:22px;font-weight:800}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.good{background:#f3fbf7}.kpi.good b{color:var(--ok)}.kpi.mid{background:#f6f8fb}.kpi.warn{background:#fff6f7}.kpi.warn b{color:var(--bad)}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.road>div{background:var(--line-2);border-radius:14px;padding:14px}
.road h4{margin:0 0 8px;font-size:15px}.road ol{margin:0;padding-left:18px;font-size:14px;color:var(--ink)}.road li{margin:6px 0}
.road li small{display:block;color:var(--muted);font-size:12.5px}
.chk-l{list-style:none;padding:0;margin:0}.chk-l li{padding:9px 12px;border-radius:12px;margin-bottom:6px;font-size:14.5px}
.chk-l li.warn{background:var(--warn-soft);color:#7a4300}.chk-l li.info{background:var(--blue-soft);color:#174ea6}
.qd summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:10px 0}
.qd summary::-webkit-details-marker{display:none}
.qrow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:10px 0;border-top:1px solid var(--line-2);font-size:14px}
.qrow b{display:block}.qrow span{color:var(--sub)}.qrow a{font-size:13px;white-space:nowrap}
.res-act{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.method{font-size:13.5px;color:var(--sub)}.method table{border-collapse:collapse;width:100%;font-size:13px;margin:6px 0}
.method th,.method td{border:1px solid var(--line);padding:5px 7px;text-align:center}.method th{background:var(--line-2)}

.fgrid{display:grid;gap:2px}
.frow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2)}
.frow .fl{font-weight:700;font-size:14.5px}.frow .fl i{font-style:normal;color:var(--warn)}.frow .src{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.frow label span{display:none;font-size:12px;color:var(--muted);font-weight:600}
.frow input{padding:10px;font-size:15px;text-align:right;font-variant-numeric:tabular-nums}
.frow.miss .fl{color:var(--warn)}.frow.miss input[data-fin=cur]{border-color:#ffb46b;background:#fffaf3}
@media (max-width:520px){.frow{grid-template-columns:1fr 1fr}.frow .fl{grid-column:1/-1}.frow label span{display:block;margin-bottom:2px}}
.method th,.method td{white-space:nowrap}.method .tw{overflow-x:auto}
.opt .ot{flex:1}.opt .ck{flex:none;font-size:12.5px;font-weight:800;color:var(--blue-d);align-self:center}
.opt.on{box-shadow:0 0 0 1px var(--blue) inset}
.flags{border:2px solid #ffd2d6}.flags h3{color:var(--bad)}
.lenses{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lens{background:var(--line-2);border-radius:14px;padding:13px 14px}
.lens .lh{display:flex;justify-content:space-between;align-items:baseline}.lens .lh b{font-size:15.5px}.lens .lh em{font-style:normal;font-weight:800;font-size:22px}
.lens .lq{margin:2px 0 8px;font-size:13.5px;color:var(--sub)}
.lens .track{height:8px;background:#e1e5ea;border-radius:99px;overflow:hidden}.lens .track i{display:block;height:100%;border-radius:99px}
.lens .lv{margin:8px 0 0;font-size:13.5px;font-weight:700}.lens .lw,.lens .ld{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.lens.good{background:#f3fbf7}.lens.warn{background:#fff8ef}
.cbar .track s{position:absolute;top:-3px;bottom:-3px;width:2px;background:#191f28;opacity:.55;text-decoration:none}
.cbar small{grid-column:1/-1;margin-top:-6px;font-size:12px;color:var(--muted)}.cbar .gap{color:var(--bad);font-weight:800}
.ana{padding:0 2px 10px;font-size:14.5px;color:var(--sub)}.ana p{margin:6px 0}.ana b{color:var(--ink)}.ana ul{margin:4px 0 8px;padding-left:20px}
@media (max-width:860px){.lenses{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.lenses{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:rgba(25,31,40,.94);color:#fff;padding:12px 18px;border-radius:14px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:100;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .hero-in{grid-template-columns:1fr;padding-top:36px;padding-bottom:36px;gap:28px}
  .hero h1{font-size:33px}.lead{font-size:16px}
  .cards4,.steps ol{grid-template-columns:1fr 1fr}
  .two,.grid2,.road{grid-template-columns:1fr}
  .cbox{flex-direction:column;align-items:flex-start}
  .sum-card{grid-template-columns:1fr;justify-items:center}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .hero h1{font-size:29px}
  .cards4,.steps ol{grid-template-columns:1fr}
  .qtitle{font-size:21px}.pg-t{font-size:24px}
  .cta-row .btn{width:100%}
  .sec-t{font-size:22px;margin-top:44px}
  .kpis{grid-template-columns:1fr 1fr}
  .cbar{grid-template-columns:86px 1fr 38px;font-size:13px}
  .hd-act .btn{padding:7px 10px;font-size:13px}
}

/* ───────── 결과 보고서(인쇄 전용) ───────── */
#print-root{display:none}
@media print{
  @page{size:A4;margin:13mm 13mm 15mm}
  html,body{background:#fff !important}
  body.printing #app,body.printing .toast{display:none !important}
  body.printing #print-root{display:block}
}
.r-doc{font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:9.2pt;line-height:1.5;color:#191f28;letter-spacing:-.01em;word-break:keep-all;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.r-doc *{box-sizing:border-box}
.r-doc p{margin:3px 0}
.r-doc h1{font-size:19pt;font-weight:800;margin:0;letter-spacing:-.03em}
.r-doc h2{font-size:11.5pt;font-weight:800;color:#1a2a56;border-bottom:1.5px solid #1a2a56;padding-bottom:3px;margin:12px 0 7px;break-after:avoid}
.r-doc h3{font-size:10pt;font-weight:700;margin:8px 0 4px;break-after:avoid}
.r-water{background:#ffebee;color:#d22030;font-weight:800;text-align:center;padding:4px;border-radius:4px;margin-bottom:5px;font-size:9pt}
.r-head{display:flex;gap:10px;align-items:center;border-bottom:1px solid #d1d6db;padding-bottom:8px}
.r-logo{width:36px;height:36px}
.r-head-t{flex:1}.r-brand{font-size:8.4pt;font-weight:700;color:#1a2a56}.r-brand span{font-weight:500;color:#6b7684}
.r-head-m{text-align:right;font-size:8.2pt;color:#4e5968;display:flex;flex-direction:column}.r-head-m b{font-size:10pt;color:#191f28}
.r-top{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:8px}
.r-top svg{width:62mm;height:auto}
.r-sum{list-style:none;margin:0;padding:0}.r-sum li{padding:4px 0;border-bottom:1px solid #eef0f3}.r-sum li:first-child{font-weight:700;font-size:10pt}.r-sum li:last-child{border-bottom:0}
.r-bdg{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.r-bdg span{font-size:7.6pt;font-weight:700;border:1px solid #dfe3e8;border-radius:3px;padding:0 5px;color:#4e5968}
.r-bdg .ok{background:#e5f6ee;color:#0a8754;border-color:#bfe8d4}.r-bdg .warn{background:#fff3e0;color:#a85d00;border-color:#ffdcae}
.r-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
.r-radar svg{width:78mm;height:auto;display:block;margin:0 auto}
.r-tbl{width:100%;border-collapse:collapse;font-size:8.3pt;margin:3px 0 6px}
.r-tbl thead{display:table-header-group}.r-tbl tr{break-inside:avoid}
.r-tbl th,.r-tbl td{border:1px solid #dfe3e8;padding:3.5px 6px;text-align:left;vertical-align:top}
.r-tbl th{background:#f4f6f8;font-weight:700;color:#333d4b}
.r-r{text-align:right !important}.r-c{text-align:center !important}.r-nw{white-space:nowrap}
.r-num{font-variant-numeric:tabular-nums}
.r-bar{display:inline-block;height:7px;border-radius:4px;background:#3182f6;vertical-align:middle}
.r-bar-t{display:inline-block;width:30mm;height:7px;border-radius:4px;background:#eef0f3;vertical-align:middle;margin-right:4px;overflow:hidden}
.r-it{border:1px solid #dfe3e8;border-radius:4px;padding:5px 7px;margin:0 0 5px;break-inside:avoid}
.r-it.good{border-left:3px solid #0a8754}.r-it.need{border-left:3px solid #e8921a}
.r-it b{font-size:9pt}.r-it p{margin:2px 0 0;color:#4e5968}.r-it .nx{color:#191f28}.r-it .nx em{font-style:normal;color:#1b64da;font-weight:700}
.r-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.r-kpi{border:1px solid #dfe3e8;border-radius:4px;padding:5px 7px}.r-kpi span{display:block;font-size:7.8pt;color:#4e5968}.r-kpi b{font-size:12pt;font-weight:800}
.r-kpi small{display:block;font-size:7pt;color:#6b7684}
.r-kpi.good b{color:#0a8754}.r-kpi.warn b{color:#d22030}
.r-fin svg{width:100%;height:auto}
.r-road{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.r-road>div{border:1px solid #dfe3e8;border-radius:4px;padding:5px 7px;break-inside:avoid}
.r-road h3{margin:0 0 3px;color:#1a2a56}.r-road ol{margin:0;padding-left:14px}.r-road li{margin:2px 0}
.r-note{font-size:7.8pt;color:#6b7684;margin:3px 0}
.r-chk{margin:3px 0;padding-left:16px}.r-chk li{margin:2px 0}
.r-break{break-before:page}
.r-gap{color:#d22030;font-weight:800}.r-flag li{color:#a3101e}.r-ana{font-size:7.7pt}.r-ana td:nth-child(3){width:30%}.r-ana .r-chk{padding-left:12px;margin:0}
.r-qtbl{font-size:7.3pt}.r-qtbl th,.r-qtbl td{padding:1.6px 5px}
.r-doc h2+.r-grid,.r-it,.r-kpis{break-inside:avoid}
.r-foot{margin-top:10px;border-top:1px solid #d1d6db;padding-top:5px;font-size:7.6pt;color:#4e5968}
.r-dots{display:inline-flex;gap:2px}.r-dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#d6dbe1}.r-dots i.on{background:#3182f6}
</style>
