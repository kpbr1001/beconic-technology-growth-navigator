# BECONIC 고객문제·솔루션 적합성 진단(20번) — Netlify 배포 설정
# 사이트: https://beconic-diagnosis-psf.netlify.app
# Netlify 사이트 설정에서 Base directory 를 `psf` 로 지정하면 이 파일이 적용됩니다.
# 화면은 index.html 하나(정적, 점수 계산은 브라우저 안에서). AI 해석(선택, Phase 2)만 서버 함수(/api/psf-insights)를 거칩니다.

# 공개 파일만 dist/ 로 복사해 배포한다(서버 함수 소스·문서·테스트는 공개 URL에 올리지 않음).
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
