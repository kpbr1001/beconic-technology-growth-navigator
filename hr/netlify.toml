# BECONIC HR Health Navigator — Netlify 배포 설정
# 사이트: https://beconic-diagnosis-hr.netlify.app
# Netlify 사이트 설정에서 Base directory 를 `hr` 로 지정하면 이 파일이 적용됩니다.
# 화면은 index.html 하나(정적, 계산은 브라우저 안에서), AI 해석(선택)만 서버 함수(/api/hr-insights)를 거칩니다.

# 공개 파일만 dist/ 로 복사해 배포한다(서버 함수 소스·문서·테스트는 공개 URL에 올리지 않음).
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fastly.jsdelivr.net; font-src 'self' https://cdn.jsdelivr.net https://fastly.jsdelivr.net data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' mailto:; frame-ancestors 'none'"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/og-image-v3.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"
