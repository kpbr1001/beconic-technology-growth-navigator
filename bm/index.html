  // 20 회사정보
  // 20 CTA — 진단을 컨설팅 연계로 전환하는 마무리. 회사정보는 신뢰 근거로 하단 유지.
  secs.push(html`<div class="rep-sec card no-print" key="s20" style=${{
      background:'linear-gradient(135deg,#0b6b5b,#0f8f78)',color:'#fff',border:'none'}}>
    <div style=${{textAlign:'center',padding:'8px 4px'}}>
      <div style=${{fontSize:'12px',letterSpacing:'.12em',opacity:.85,fontWeight:'700'}}>NEXT STEP</div>
      <h2 class="h2" style=${{color:'#fff',margin:'8px 0 6px'}}>진단은 시작일 뿐입니다</h2>
      <p style=${{fontSize:'14px',opacity:.94,maxWidth:'560px',margin:'0 auto 18px',lineHeight:'1.7'}}>
        이 보고서가 짚은 구조적 문제와 검증 과제를, <b>실제 실행과 성과</b>로 옮기는 것이
        컨설팅의 역할입니다. 중소벤처기업부 인증 상담회사가 사업 단계에 맞춰 함께합니다.</p>
      <div style=${{display:'flex',gap:'10px',justifyContent:'center',flexWrap:'wrap'}}>
        <a href=${'tel:'+SERVICE.tel} class="btn"
          style=${{background:'#fff',color:'#0b6b5b',fontWeight:'700',border:'none',padding:'12px 22px'}}>
          ☎ 무료 상담 신청 · ${SERVICE.tel}</a>
        <a href=${'mailto:'+SERVICE.email} class="btn"
          style=${{background:'rgba(255,255,255,.16)',color:'#fff',border:'1px solid rgba(255,255,255,.5)',padding:'12px 22px'}}>
          ✉ ${SERVICE.email}</a>
        <a href=${'https://'+SERVICE.site} class="btn"
          style=${{background:'rgba(255,255,255,.16)',color:'#fff',border:'1px solid rgba(255,255,255,.5)',padding:'12px 22px'}}>
          ${SERVICE.site} 바로가기</a>
      </div>
    </div>
  </div>`);
  // 20b 회사정보(발행) → 푸터와 중복이므로 삭제. 신뢰 근거는 표지·CTA·푸터에 이미 포함.

  const SUMMARY_KEYS = ['s1','s1a','s1b','s1c','s3','s4','s5','s11','s12','s13','s16','s19'];
  const shown = summary ? secs.filter(s=>SUMMARY_KEYS.includes(s.key)) : secs;

  return html`<div class="wrap">
    <div class="card no-print">
      <div style=${{display:'flex',justifyContent:'space-between',gap:'10px',flexWrap:'wrap',alignItems:'center'}}>
        <div><div class="eyebrow">결과보고서</div>
          <h1 class="h2">${summary?'요약형':'상세형'} · ${shown.length}개 섹션</h1></div>
        <div class="btn-row">
          <button class="btn btn-g btn-sm" onClick=${()=>setSummary(!summary)}>
            ${summary?'상세형으로':'요약형으로'}</button>
          <button class="btn btn-sm" onClick=${doPrint}>PDF 저장 · 인쇄</button>
        </div>
      </div>
      <p class="muted mt12">인쇄 대화상자에서 "배경 그래픽" 옵션을 켜시면 색상이 그대로 출력됩니다. A4 세로 기준으로 맞춰져 있습니다.</p>
      ${printMsg==='done' && html`<div class="why mt12" style=${{background:'var(--ok-bg)',color:'var(--ok)'}}>
        ✓ 인쇄 대화상자를 닫으셨습니다. PDF로 저장하셨다면 완료된 것입니다.</div>`}
      ${printMsg==='mobile' && html`<div class="why mt12" style=${{background:'var(--info-bg)',color:'var(--info)'}}>
        <b>모바일에서 저장이 안 되시나요?</b> 카카오톡·인스타 등 앱 안의 브라우저에서는 인쇄가 제한될 수 있습니다.<br/>
        오른쪽 위 <b>⋮ (더보기) → "다른 브라우저로 열기"</b> 또는 <b>Chrome·Safari</b>로 이 페이지를 연 뒤,
        <b>공유 → 인쇄 → PDF로 저장</b>을 선택하시면 저장됩니다.</div>`}
    </div>
    ${shown}
    <div class="bbar no-print"><div class="bbar-in">
      <button class="btn" onClick=${doPrint}>PDF 저장 · 인쇄</button>
    </div></div>
  </div>`;
}

/* ================= Root ================= */

/* 화면 정의 — label은 내비게이션 표시에, bbar는 하단 고정 바 유무에 씁니다.
   하단 바는 '다음에 할 행동'이 있는 화면에만 둡니다.
   되돌아가기는 상단 내비게이션이 담당합니다. */
const VIEWS = {
  landing:  { label:'처음',       bbar:false },
  diagnose: { label:'진단',       bbar:true  },
  deep:     { label:'심화 입력',  bbar:true  },
  result:   { label:'진단 결과',  bbar:true  },
  canvas:   { label:'캔버스 작성',bbar:true  },
  patterns: { label:'BM 패턴',    bbar:false },
  library:  { label:'프레임워크 라이브러리', bbar:false },
  compare:  { label:'BM 비교',    bbar:false },
  report:   { label:'결과보고서', bbar:true  },
  examples: { label:'예제 진단',  bbar:false }
};

function App(){
  /* 이동 이력을 쌓아 어디서 들어왔든 그 자리로 정확히 돌아갑니다. */
  const [stack, setStack] = useState(['landing']);
  const view = stack[stack.length - 1];
  const prev = stack.length > 1 ? stack[stack.length - 2] : null;

  const [answers, setAnswers] = useState({});
  const [entries, setEntries] = useState({});
  const [fwId, setFwId] = useState(null);
  const [deep, setDeep] = useState(null);
  const [menu, setMenu] = useState(false);
  const [saved, setSaved] = useState(false);

  /* AI 연결 상태: 'checking'(확인 중) / 'ready'(함수+키 정상) / 'nokey'(함수는 있으나 키 미설정) / 'off'(엔드포인트 없음/함수 미배포).
     로드 시 함수에 GET 헬스체크(무료—Anthropic 미호출)를 한 번 보내 실제 상태를 판정한다. */
  const [aiStatus, setAiStatus] = useState(AI_ENABLED ? 'checking' : 'off');
  useEffect(() => {
    if (!AI_ENABLED) return;
    let alive = true;
    (async () => {
      try {
        const r = await fetch(AI_ENDPOINT, { method: 'GET' });
        if (!alive) return;
        if (r.ok) {
          const j = await r.json().catch(() => ({}));
          setAiStatus(j && j.keyConfigured === false ? 'nokey' : 'ready');
        } else { setAiStatus('off'); }
      } catch (_) { if (alive) setAiStatus('off'); }
    })();
    return () => { alive = false; };
  }, []);

  /* go: 새 화면으로 이동(이력 쌓기) / back: 직전 화면으로 / reset: 이력 초기화
     이미 스택에 있는 화면으로 가면 중복을 쌓지 않고 그 지점까지 되돌아갑니다.
     (예: 결과 → 기본문항 수정 → 결과 로 돌아올 때 진단 화면이 스택에 남지 않도록) */
  const go = useCallback((v) => {
    setStack(s => {
      if (s[s.length-1] === v) return s;
      const idx = s.lastIndexOf(v);
      if (idx !== -1) return s.slice(0, idx+1);   // 되돌아가기: v 이후를 잘라냄
      return [...s, v];                            // 새 화면: 쌓기
    });
    setMenu(false);
  }, []);
  const back = useCallback(() => {
    setStack(s => s.length > 1 ? s.slice(0,-1) : s);
  }, []);
  const resetTo = useCallback((v) => { setStack([v]); setMenu(false); }, []);

  /* 브라우저·모바일 뒤로가기 버튼 지원 */
  useEffect(()=>{
    if (typeof window.history?.pushState !== 'function') return;
    const onPop = () => setStack(s => s.length > 1 ? s.slice(0,-1) : s);
    window.addEventListener('popstate', onPop);
    return ()=> window.removeEventListener('popstate', onPop);
  },[]);
  useEffect(()=>{
    if (typeof window.history?.pushState !== 'function') return;
    try { window.history.pushState({v:view}, ''); } catch(e){ /* 미지원 환경 */ }
  },[view]);

  // 자동 저장
  useEffect(()=>{
    const d = loadAll();
    if (d.answers && Object.keys(d.answers).length) {
      setAnswers(d.answers); setEntries(d.entries||{}); setFwId(d.fwId||null); setSaved(true);
    }
  },[]);
  useEffect(()=>{
    if (Object.keys(answers).length) saveAll({answers, entries, fwId, at:Date.now()});
  },[answers, entries, fwId]);

  const startNew = () => {
    if (saved && Object.keys(answers).length &&
        !confirm('진행 중인 진단 내용이 있습니다. 새로 시작하면 지워집니다. 계속하시겠습니까?')) return;
    setAnswers({}); setEntries({}); setFwId(null); go('diagnose');
  };
  const loadExample = ex => {
    /* 이력을 지우지 않습니다. 예제를 보고 나서 다시 목록으로 돌아갈 수 있어야 합니다. */
    setAnswers({...ex.answers}); setEntries({}); setFwId(null); go('result');
  };

  const exportJson = () => {
    const blob = new Blob([JSON.stringify({schemaVersion:1, service:SERVICE.name, version:SERVICE.version,
      answers, entries, fwId, exportedAt:new Date().toISOString()},null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=`bm-navigator-${new Date().toISOString().slice(0,10)}.json`; a.click();
    URL.revokeObjectURL(a.href); setMenu(false);
  };
  const importJson = e => {
    const f=e.target.files?.[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(!d.answers) throw new Error('형식이 올바르지 않습니다');
      setAnswers(d.answers); setEntries(d.entries||{}); setFwId(d.fwId||null); resetTo('result');
    }catch(err){ alert('파일을 읽을 수 없습니다. BM Navigator에서 내보낸 JSON 파일인지 확인해 주세요.'); } };
    r.readAsText(f);
  };
  const clearAll = () => {
    if(!confirm('저장된 진단 내용을 모두 지웁니다. 되돌릴 수 없습니다. 계속하시겠습니까?')) return;
    localStorage.removeItem(KEY); setAnswers({}); setEntries({}); setFwId(null);
    setSaved(false); resetTo('landing');
  };

  /* 화면 전환 시 맨 위에서 시작합니다. 하단 바는 sticky라 별도 보정이 필요 없습니다. */
  useEffect(()=>{
    if (typeof window.scrollTo === 'function') {
      try { window.scrollTo(0,0); } catch(e){ /* 일부 환경에서는 지원하지 않습니다 */ }
    }
  },[view]);

  const backLabel = prev ? (VIEWS[prev]?.label || '이전') : null;

  return html`<div class="app">
    <${TopBar} onHome=${()=>resetTo('landing')} onMenu=${()=>setMenu(true)} aiStatus=${aiStatus} />

    ${view !== 'landing' && html`<${NavBar}
      label=${backLabel}
      current=${VIEWS[view]?.label}
      onBack=${prev ? back : ()=>resetTo('landing')}
      onHome=${()=>resetTo('landing')}
      showHome=${!!prev && prev !== 'landing'}
      onEditQuestions=${(view!=='diagnose' && Object.keys(answers).length>0) ? ()=>go('diagnose') : null} />`}

    <main class=${'main view-'+view}>
      ${view==='landing' && html`<${Landing}
        hasSaved=${saved && Object.keys(answers).length>0}
        onResume=${()=>go('result')}
        onStart=${startNew}
        onExamples=${()=>go('examples')}
        onLibrary=${()=>go('library')}
        aiOn=${AI_ENABLED} />`}

      ${view==='diagnose' && html`<${Diagnose} answers=${answers} setAnswers=${setAnswers}
        onDone=${()=>go('result')}
        onExit=${prev ? back : ()=>resetTo('landing')} />`}

      ${view==='result' && html`<${Result} answers=${answers}
        onPick=${id=>{setFwId(id); go('canvas');}}
        onPatterns=${()=>go('patterns')}
        onCompare=${()=>go('compare')}
        onLibrary=${()=>go('library')}
        onDeep=${id=>{setDeep(id); go('deep');}}
        onEdit=${()=>go('diagnose')}
        onReport=${()=>go('report')} />`}

      ${view==='deep' && deep && html`<${DeepDive} block=${DEEP_BLOCKS.find(b=>b.id===deep)}
        answers=${answers} setAnswers=${setAnswers} onBack=${back} />`}

      ${view==='canvas' && fwId && html`<${Canvas} fwId=${fwId} answers=${answers}
        entries=${entries} setEntries=${setEntries}
        onSwitch=${id=>setFwId(id)} onNext=${()=>go('report')} onBack=${back} />`}

      ${view==='patterns' && html`<${Patterns} answers=${answers} onBack=${back} />`}
      ${view==='library' && html`<${Library} onBack=${back} />`}
      ${view==='compare' && html`<${Compare} answers=${answers} onBack=${back} />`}
      ${view==='report' && html`<${Report} answers=${answers} entries=${entries} fwId=${fwId}
        onBack=${back} />`}

      ${view==='examples' && html`<div class="wrap">
        <div class="card"><div class="eyebrow">예제 진단</div>
          <h1 class="h2">9개 사업 유형 예시</h1>
          <p class="sub">서로 다른 구조의 사업이 각각 어떤 프레임워크를 추천받는지 바로 확인하실 수 있습니다.
            컨설팅·교육 자료로도 활용하실 수 있습니다.</p>
          ${saved && Object.keys(answers).length>0 && html`<div class="why mt12"
            style=${{background:'var(--warn-bg)',color:'var(--warn)'}}>
            예제를 불러오면 현재 진행 중인 진단 내용이 예제로 바뀝니다.
            지금 내용을 남기시려면 먼저 상단 "내 진단"에서 JSON으로 내보내 주세요.</div>`}
        </div>
        <div style=${{display:'grid',gap:'10px',marginTop:'14px'}}>
          ${EXAMPLES.map(ex=>html`<div class="card" key=${ex.id} style=${{padding:'17px'}}>
            <h3 class="h3">${ex.name}</h3><p class="sub">${ex.desc}</p>
            <button class="btn btn-g btn-sm mt12" onClick=${()=>loadExample(ex)}>이 예제로 진단 결과 보기</button>
          </div>`)}
        </div>
      </div>`}
    </main>
    <${Footer} />

    ${menu && html`<div class="ovl no-print" onClick=${()=>setMenu(false)}>
      <div class="modal" onClick=${e=>e.stopPropagation()}>
        <h2 class="h3">내 진단 관리</h2>
        <p class="sub">입력 내용은 이 브라우저에만 저장됩니다.</p>
        <div style=${{display:'grid',gap:'9px',marginTop:'16px'}}>
          <button class="btn btn-g" onClick=${startNew}>새로 진단 시작하기</button>
          <button class="btn btn-g" onClick=${exportJson}>JSON으로 내보내기</button>
          <label class="btn btn-g" style=${{cursor:'pointer'}}>
            JSON 불러오기
            <input type="file" accept="application/json" onChange=${importJson} style=${{display:'none'}} />
          </label>
          <button class="btn btn-g" onClick=${()=>go('library')}>프레임워크 라이브러리</button>
          <button class="btn btn-g" onClick=${()=>go('examples')}>예제 진단 보기</button>
          <button class="btn btn-g" style=${{color:'var(--bad)'}} onClick=${clearAll}>저장 내용 모두 삭제</button>
        </div>
        <button class="btn mt16" style=${{width:'100%'}} onClick=${()=>setMenu(false)}>닫기</button>
      </div>
    </div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);

/* 모바일 카드형 표(.stbl-m)의 각 td에 헤더 텍스트를 data-label로 자동 주입.
   React가 표를 다시 그릴 때마다 실행되도록 MutationObserver로 감시.
   thead가 없는 표(구분/값 2열 tbody-only)는 첫 열 텍스트를 라벨로 쓰지 않고 건너뜀. */
(function(){
  function labelize(table){
    var ths = table.querySelectorAll('thead th');
    var heads = Array.prototype.map.call(ths, function(th){ return th.textContent.trim(); });
    Array.prototype.forEach.call(table.querySelectorAll('tbody tr'), function(tr){
      Array.prototype.forEach.call(tr.children, function(td, idx){
        if(td.tagName!=='TD') return;
        if(heads.length && heads[idx]){ td.setAttribute('data-label', heads[idx]); }
        else if(!td.hasAttribute('data-label')){ td.setAttribute('data-label',''); }
        // 짧고 단순한 값(하위 블록요소 없고 20자 미만)은 라벨과 한 줄에 → 세로 길이 절감
        var hasBlock = td.querySelector('div,ul,ol,table,svg,p');
        var txt = (td.textContent||'').trim();
        if(!hasBlock && txt.length>0 && txt.length<=20){ td.setAttribute('data-short','1'); }
        else { td.removeAttribute('data-short'); }
      });
    });
  }
  function run(){
    document.querySelectorAll('table.stbl-m').forEach(labelize);
  }
  run();
  var scheduled=false;
  var obs=new MutationObserver(function(){
    if(scheduled) return; scheduled=true;
    requestAnimationFrame(function(){ scheduled=false; run(); });
  });
  obs.observe(document.getElementById('root'), {childList:true, subtree:true});
})();

</script>
