<meta name="twitter:description" content="중소벤처기업부 인증 상담회사가 만든 BM 진단 도구 · 프레임워크 추천부터 90일 실행계획까지">

<style>
:root{
  --navy:#223254; --navy-700:#2c4068; --navy-300:#7d8caa; --navy-50:#eef1f7;
  --ink:#151a24; --ink-2:#454c5c; --ink-3:#727a8c; --line:#e2e6ee;
  --bg:#f6f7fa; --card:#ffffff;
  --ok:#0f7b5f; --ok-bg:#e6f4ef;
  --warn:#9a6200; --warn-bg:#fdf3e0;
  --bad:#a5322c; --bad-bg:#fbecea;
  --info:#1d5fa8; --info-bg:#e8f1fb;
  --r:14px; --r-s:9px;
  --sh:0 1px 2px rgba(23,32,56,.05), 0 4px 14px rgba(23,32,56,.05);
  --maxw:960px;
  --gutter:40px;
  --fs-h1:29px; --fs-h2:21px; --fs-h3:17px; --fs-b:15.5px; --fs-s:13.5px; --fs-xs:12.5px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,system-ui,'Malgun Gothic',sans-serif;
  background:var(--bg); color:var(--ink); font-size:var(--fs-b);
  line-height:1.62; -webkit-font-smoothing:antialiased; overflow-x:hidden;
  word-break:keep-all; overflow-wrap:anywhere;
}
h1,h2,h3,h4{margin:0; line-height:1.34; letter-spacing:-.021em; font-weight:700}
p{margin:0}
button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit}
input,select,textarea{font-family:inherit; font-size:var(--fs-b); color:var(--ink)}
a{color:var(--info)}
:focus-visible{outline:2.5px solid var(--navy); outline-offset:2px; border-radius:5px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ===== layout ===== */
/* 콘텐츠 폭 = 지정 최대폭과 (화면폭 - 좌우 여백) 중 작은 값.
   화면이 최대폭보다 조금 넓을 때(예: 1000~1100px) 좌우 여백이 사라져
   답답해 보이던 문제를, 어떤 폭에서도 최소 여백을 확보해 해결합니다.
   --gutter: 콘텐츠 양옆에 항상 남겨 둘 여백(한쪽 기준). */
.wrap{
  width:100%;
  max-width:min(var(--wrap-w, var(--maxw)), calc(100vw - var(--gutter, 40px) * 2));
  margin:0 auto;
  padding:0 var(--wrap-pad, 18px);
}
/* 화면 성격에 맞춰 콘텐츠 폭을 다르게 둡니다.
   - 진단·심화 입력: 읽고 고르는 화면이라 좁을수록 집중됩니다.
   - 결과·캔버스·보고서·비교: 표와 2단 그리드가 있어 넓게 씁니다. */
.main.view-diagnose, .main.view-deep{ --wrap-w:720px }
.main.view-landing{ --wrap-w:900px }
.main.view-result, .main.view-canvas, .main.view-report,
.main.view-compare, .main.view-patterns, .main.view-library,
.main.view-examples{ --wrap-w:960px }
/* 상단·하단·푸터·뒤로가기 바의 폭을 본문 폭과 맞춥니다.
   이 바들은 .main 밖(.app 직속)이라 view 클래스가 없으므로,
   body:has()로 현재 화면을 감지해 --bar-w를 지정합니다.
   실제 max-width는 각 -in 요소가 공통 공식(min(--bar-w, 화면-여백))으로 계산합니다. */
body:has(.main.view-diagnose), body:has(.main.view-deep){ --bar-w:720px }
body:has(.main.view-landing){ --bar-w:900px }
body:has(.main.view-result), body:has(.main.view-canvas),
body:has(.main.view-report), body:has(.main.view-compare),
body:has(.main.view-patterns), body:has(.main.view-library),
body:has(.main.view-examples){ --bar-w:960px }
.app{min-height:100vh; display:flex; flex-direction:column}
/* sticky 하단 바가 화면 하단에 붙으려면 부모가 화면 높이를 채워야 합니다 */
.main{flex:1; padding:26px 0 0; display:flex; flex-direction:column}
/* 본문 끝과 푸터가 붙지 않도록 여백을 둡니다 */
.main > .wrap > *:last-child{margin-bottom:48px}
.main > .wrap{flex:1; display:flex; flex-direction:column; width:100%}

.topbar{
  position:sticky; top:0; z-index:60; background:rgba(255,255,255,.93);
  backdrop-filter:saturate(180%) blur(12px); border-bottom:1px solid var(--line);
}
.topbar-in{max-width:min(var(--bar-w, var(--maxw)), calc(100vw - var(--gutter, 40px) * 2)); margin:0 auto; padding:11px 18px; display:flex; align-items:center; gap:11px}
.brand{display:flex; align-items:center; gap:9px; cursor:pointer}
.brand img{width:27px; height:27px; object-fit:contain; display:block}
.brand-t{font-size:15px; font-weight:750; letter-spacing:-.03em; color:var(--navy)}
.brand-s{font-size:11.5px; color:var(--ink-3); font-weight:500}
.topbar-sp{flex:1}
.tb-btn{font-size:13px; font-weight:600; color:var(--ink-2); padding:7px 11px; border-radius:8px}
.tb-btn:hover{background:var(--navy-50); color:var(--navy)}
.tb-badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:650;
  color:var(--ink-3); background:#f0f2f7; padding:5px 10px; border-radius:99px; white-space:nowrap}
.tb-dot{width:7px; height:7px; border-radius:50%; background:#b9c0cf; flex:0 0 auto}
.tb-dot.on{background:var(--ok)}
@media (max-width:480px){ .tb-badge{display:none} }

/* ===== card / type ===== */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:22px; box-shadow:var(--sh)}
.card+.card{margin-top:14px}
.eyebrow{font-size:11.5px; font-weight:750; letter-spacing:.09em; color:var(--navy-300); text-transform:uppercase; margin-bottom:9px}
.h1{font-size:var(--fs-h1)}
.h2{font-size:var(--fs-h2)}
.h3{font-size:var(--fs-h3)}
.sub{color:var(--ink-2); font-size:var(--fs-s); margin-top:7px}
.muted{color:var(--ink-3); font-size:var(--fs-xs)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}.mt32{margin-top:32px}

/* ===== buttons ===== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:13px 20px; border-radius:11px; font-weight:650; font-size:15px;
  background:var(--navy); color:#fff; min-height:48px; transition:.15s;
}
.btn:hover{background:var(--navy-700)}
.btn:disabled{background:#c3c9d6; cursor:not-allowed}
.btn-g{background:var(--card); color:var(--navy); border:1.5px solid var(--line)}
.btn-g:hover{background:var(--navy-50); border-color:var(--navy-300)}
.btn-sm{padding:9px 14px; font-size:13.5px; min-height:38px; border-radius:9px}
.btn-row{display:flex; gap:9px; flex-wrap:wrap}

/* ===== options ===== */
.opts{display:grid; gap:9px; margin-top:16px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{
  display:flex; align-items:center; gap:11px; width:100%; text-align:left;
  padding:14px 15px; border:1.5px solid var(--line); border-radius:11px;
  background:var(--card); font-size:15px; font-weight:520; min-height:52px; transition:.13s;
}
.opt:hover{border-color:var(--navy-300); background:var(--navy-50)}
.opt.on{border-color:var(--navy); background:var(--navy-50); font-weight:650; color:var(--navy)}
.opt-mark{
  width:21px;height:21px;border-radius:50%;border:2px solid #ccd3e0;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
}
.opt-mark.sq{border-radius:6px}
.opt-note{display:block; font-size:12px; font-weight:500; color:var(--ink-3); margin-top:3px}
.txtgroup{display:flex; flex-direction:column; gap:13px}
.txtfield{display:flex; flex-direction:column; gap:6px}
.txtlabel{font-size:13px; font-weight:600; color:var(--ink-2)}
.txtinput{
  width:100%; padding:12px 14px; border:1.5px solid var(--line); border-radius:10px;
  background:var(--card); font-size:16px; font-family:inherit; color:var(--ink); transition:.13s;
}
.txtinput:focus{outline:none; border-color:var(--navy); background:var(--navy-50)}
.txtinput::placeholder{color:var(--ink-3); font-weight:400}
.opt.on .opt-note{color:var(--navy-700)}
.opt.on .opt-mark{border-color:var(--navy); background:var(--navy)}
.opt.on .opt-mark::after{content:'';width:8px;height:8px;border-radius:50%;background:#fff}
.opt.on .opt-mark.sq::after{
  content:''; width:5px; height:9px; border:solid #fff; border-width:0 2.5px 2.5px 0;
  transform:rotate(45deg) translate(-1px,-1px); border-radius:0; background:none;
}

/* ===== progress ===== */
.prog{position:sticky; top:98px; z-index:50; background:var(--bg); padding:12px 0 6px}
.prog-bar{height:5px; background:#e4e8f0; border-radius:99px; overflow:hidden}
.prog-fill{height:100%; background:var(--navy); border-radius:99px; transition:width .35s cubic-bezier(.4,0,.2,1)}
.prog-meta{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3); margin-top:7px; font-weight:600}

/* ===== fit bar (5단계 라벨) ===== */
.fitbar{height:9px; background:#e8ebf2; border-radius:99px; overflow:hidden; margin-top:9px}
.fitbar i{display:block; height:100%; border-radius:99px; transition:width .5s}
.fit-high i,.fit-good i{background:var(--ok)}
.fit-mid i,.fit-low i{background:var(--warn)}
.fit-avoid i{background:var(--bad)}
.pill{display:inline-flex; align-items:center; gap:5px; padding:4px 10px; border-radius:99px; font-size:12px; font-weight:700}
.pill-ok{background:var(--ok-bg); color:var(--ok)}
.pill-warn{background:var(--warn-bg); color:var(--warn)}
.pill-bad{background:var(--bad-bg); color:var(--bad)}
.pill-info{background:var(--info-bg); color:var(--info)}
.pill-gray{background:#eef0f5; color:var(--ink-3)}

/* ===== rec card ===== */
.rec{border:1.5px solid var(--line); border-radius:var(--r); padding:19px; background:var(--card)}
.rec.primary{border-color:var(--navy); border-width:2px; box-shadow:0 4px 18px rgba(34,50,84,.09)}
.rec-rank{font-size:11.5px; font-weight:800; letter-spacing:.07em; color:var(--navy); margin-bottom:7px}
.rec-en{font-size:12.5px; color:var(--ink-3); font-weight:500}
.why{background:var(--navy-50); border-radius:var(--r-s); padding:13px 15px; margin-top:13px; font-size:14px; color:var(--ink-2); line-height:1.66}

/* ===== score table ===== */
.stbl{width:100%; border-collapse:collapse; font-size:13.5px; margin-top:11px}
.stbl th{text-align:left; font-weight:700; color:var(--ink-3); font-size:12px; padding:8px 9px; border-bottom:1.5px solid var(--line)}
.stbl td{padding:9px; border-bottom:1px solid var(--line); vertical-align:top}
.stbl td:last-child,.stbl th:last-child{text-align:right; white-space:nowrap}
.stbl td:first-child{word-break:keep-all}
.stbl td{word-break:keep-all; overflow-wrap:break-word}
.tblwrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
.stbl-fixed{table-layout:fixed; width:100%; max-width:100%}
@media (max-width:640px){
  .canvas-grid{display:grid !important; grid-template-columns:1fr !important; grid-template-areas:none !important}
  .canvas-grid > div{grid-area:auto !important}
}
.stbl-fixed td, .stbl-fixed th{white-space:normal !important; word-break:break-word; overflow-wrap:anywhere}
.stbl-fixed td:last-child, .stbl-fixed th:last-child{white-space:normal !important}

/* ===== 모바일 표 → 카드 전환 =====
   좁은 화면에서 4~5열 표는 셀이 뭉개져 세로로 쌓입니다.
   .stbl-m 표는 모바일에서 각 행을 카드로, 각 셀을 "라벨: 값" 블록으로 바꿉니다.
   data-label은 런타임 스크립트가 thead의 th 텍스트로 자동 주입합니다. */
@media (max-width:600px){
  .stbl-m{border-collapse:separate; border-spacing:0}
  .stbl-m thead{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
  .stbl-m tbody{display:block}
  .stbl-m tr{display:block; background:var(--card); border:1px solid var(--line);
    border-radius:11px; padding:12px 14px; margin-bottom:11px; box-shadow:0 1px 3px rgba(20,30,55,.04)}
  .stbl-m tr[style*="navy-50"]{background:var(--navy-50) !important}
  /* 라벨을 값 위에 세로 배치 → 내용이 카드 전체 폭을 써서 세로 길이가 짧아짐 */
  .stbl-m td{display:block !important; width:auto !important; padding:6px 0 !important;
    border:0 !important; text-align:left !important; white-space:normal !important;
    word-break:keep-all; overflow-wrap:anywhere; table-layout:auto !important}
  .stbl-m td:not(:last-child){border-bottom:1px dashed var(--line) !important; padding-bottom:9px !important}
  .stbl-m td::before{content:attr(data-label); display:block; margin-bottom:3px;
    font-size:11px; font-weight:700; color:var(--ink-3); line-height:1.4; letter-spacing:.01em}
  .stbl-m td[data-label=""]::before{display:none}
  /* 짧은 값 셀: 라벨과 값을 한 줄에 (지표명·값·상태·판정 등) → 세로 길이 절감 */
  .stbl-m td[data-short]{display:flex !important; gap:8px; align-items:baseline}
  .stbl-m td[data-short]::before{display:inline; margin-bottom:0; flex:0 0 auto; min-width:64px}
  .stbl-m td:last-child{white-space:normal !important}
  .stbl-m td > *{min-width:0}
  .stbl-m td:empty{display:none !important}
  /* stbl-fixed의 고정폭 규칙이 카드전환을 방해하지 않도록 무력화 */
  .stbl-m.stbl-fixed{table-layout:auto !important}
  .stbl-m.stbl-fixed td, .stbl-m.stbl-fixed th{width:auto !important}
  .tblwrap{overflow-x:visible}
}

/* ===== canvas ===== */
.cgrid{display:grid; gap:11px; margin-top:15px}
.cblock{border:1.5px solid var(--line); border-radius:var(--r-s); padding:14px; background:var(--card)}
.cblock:focus-within{border-color:var(--navy)}
.cblock-h{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
.cblock-n{font-weight:700; font-size:14.5px}
.cblock textarea{
  width:100%; min-height:82px; border:none; resize:vertical; padding:0;
  font-size:14.5px; line-height:1.62; background:transparent;
}
.cblock textarea:focus{outline:none}
.cblock-hint{font-size:12.5px; color:var(--ink-3); margin-bottom:9px; line-height:1.55}
.lbls{display:flex; gap:5px; flex-wrap:wrap; margin-top:9px}
/* 감사(모바일): 캔버스 사실/가설/미확인/재확인 토글이 높이 25px라 손가락 오조작이 잦음.
   좁은 화면에서만 4칸 그리드로 펴고 터치 타깃을 키운다(보고서 안 배지는 .lbls 밖이라 영향 없음). */
@media (max-width:600px){
  .lbls{display:grid; grid-template-columns:repeat(2,1fr); gap:7px}
  .lbls .lbl{padding:10px 8px; font-size:12.5px; min-height:42px}
}
.lbl{padding:4px 9px; border-radius:7px; font-size:11.5px; font-weight:650; border:1.3px solid var(--line); background:var(--card); color:var(--ink-3)}
.lbl.on-fact{background:var(--ok-bg); border-color:var(--ok); color:var(--ok)}
.lbl.on-hyp{background:var(--warn-bg); border-color:var(--warn); color:var(--warn)}
.lbl.on-unk{background:#eef0f5; border-color:var(--ink-3); color:var(--ink-2)}
.lbl.on-recheck{background:var(--info-bg); border-color:var(--info); color:var(--info)}

/* ===== filters / chips ===== */
.chips{display:flex; gap:7px; flex-wrap:wrap}
.chip{padding:7px 13px; border-radius:99px; border:1.4px solid var(--line); background:var(--card); font-size:13px; font-weight:600; color:var(--ink-2)}
.chip.on{background:var(--navy); border-color:var(--navy); color:#fff}

/* ===== pattern ===== */
.pcard{border:1.5px solid var(--line); border-radius:var(--r-s); padding:16px; background:var(--card)}
.pcard.caution{border-color:#e8c49a; background:#fffdf8}
.ptags{display:flex; gap:5px; flex-wrap:wrap; margin-top:10px}
.ptag{font-size:11px; padding:3px 8px; border-radius:6px; background:#eef0f5; color:var(--ink-2); font-weight:600}

/* ===== matrix ===== */
.mtx{position:relative; width:100%; aspect-ratio:1; max-width:430px; margin:16px auto 34px; border:1.5px solid var(--line); border-radius:var(--r-s); background:linear-gradient(90deg,#fafbfd 50%,#fff7ec 50%)}
@media (max-width:600px){ .mtx{max-width:270px; margin:14px auto 30px} .mtx-dot{width:23px; height:23px; font-size:11px} }
/* 모바일에선 2×2 매트릭스를 숨기고 아래 "먼저 검증할 순서" 목록만 보여준다.
   좁은 화면에서 매트릭스는 점이 겹치고 라벨이 잘려 가독성이 낮다. 데스크톱·PDF는 유지. */
@media (max-width:600px){ .mtx-block{display:none} }
/* 감사(모바일) 개선: BM 시뮬레이터 2단 그리드가 좁은 화면에서 슬라이더를 129px로 눌러
   손가락 조작이 불가능해짐 → 모바일에선 1단으로 펴서 슬라이더 폭을 확보. */
@media (max-width:600px){ .sim-grid{grid-template-columns:1fr !important; gap:14px 0 !important} .sim-cards{justify-content:flex-start !important} }
.mtx-q{position:absolute; font-size:11px; font-weight:700; color:var(--ink-3)}
.mtx-ax{position:absolute; font-size:11px; font-weight:650; color:var(--navy-300)}
.mtx-ax-x{bottom:-24px; left:50%; transform:translateX(-50%)}
.mtx-ax-y{left:-13px; top:50%; transform:rotate(-90deg) translateX(50%); transform-origin:left center; white-space:nowrap}
.mtx-dot{position:absolute; width:26px; height:26px; border-radius:50%; background:var(--navy); color:#fff; font-size:11.5px; font-weight:700; display:flex; align-items:center; justify-content:center; transform:translate(-50%,50%); border:2px solid #fff; box-shadow:0 2px 7px rgba(0,0,0,.16)}

/* ===== modal ===== */
.ovl{position:fixed; inset:0; background:rgba(16,22,36,.5); z-index:200; display:flex; align-items:center; justify-content:center; padding:18px}
.modal{background:var(--card); border-radius:16px; padding:24px; max-width:520px; width:100%; max-height:86vh; overflow-y:auto; box-shadow:0 22px 50px rgba(0,0,0,.24)}

/* ===== footer ===== */
.foot{background:#1a2438; color:#a8b2c6; padding:38px 0 32px; font-size:12.5px; line-height:1.75}
.foot-in{max-width:min(var(--bar-w, var(--maxw)), calc(100vw - var(--gutter, 40px) * 2)); margin:0 auto; padding:0 18px}
.foot-name{color:#e6eaf2; font-size:14px; font-weight:700; margin-bottom:7px}
.foot-line{margin-bottom:3px}
.foot-dot{margin:0 5px; opacity:.5}
.foot a{color:#9fb6d8; text-decoration:none}
.foot a:hover{text-decoration:underline}
.foot-cert{display:block; width:fit-content; max-width:100%;
  margin-top:14px; padding:6px 12px; border:1px solid #37425c; border-radius:7px;
  font-size:11.5px; color:#c3cbdb; line-height:1.5}
.foot-cr{margin-top:16px; padding-top:14px; border-top:1px solid #2b3448;
  font-size:11.5px; color:#77839b;
  display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline}
.foot-ver{opacity:.8}

/* ===== disclaimer ===== */
.disc{background:#f1f3f8; border:1px solid var(--line); border-radius:var(--r-s); padding:14px 16px; font-size:12.5px; color:var(--ink-2); line-height:1.72}

/* ===== bottom bar =====
   fixed가 아니라 sticky로 둡니다.
   스크롤 중에는 화면 하단에 붙어 있다가, 문서 끝에 닿으면
   제자리에 놓여 푸터와 자연스럽게 이어집니다.
   (fixed로 두면 푸터 위에 계속 떠 있어 푸터가 잘려 보입니다) */
.bbar{position:sticky; bottom:0; z-index:70;
  background:rgba(255,255,255,.97); backdrop-filter:blur(10px);
  border-top:1px solid var(--line);
  padding:14px 0 calc(14px + env(safe-area-inset-bottom));
  margin:44px 0 20px}
.bbar-in{max-width:100%; margin:0 auto; padding:0; display:flex; gap:10px; justify-content:center}
/* 버튼 크기 정책:
   - 바 전체를 꽉 채우지 않고 적정 폭으로 둡니다(컨설팅 툴다운 절제된 크기).
   - 주 버튼(.btn)은 유연하되 상한을 두고, 보조 버튼(.btn-g)은 내용 기준 고정.
   - 그룹을 가운데 정렬해 1개든 2개든 균형 있게 보이도록 합니다. */
.bbar .btn{flex:1 1 auto; max-width:340px; min-width:120px}
.bbar .btn-g{flex:0 1 auto; max-width:200px; min-width:96px}
@media (max-width:768px){ .bbar{margin:36px 0 16px} }
/* 하단 고정 바가 있을 때 푸터가 가려지지 않도록 여백을 확보합니다 */
/* 하단 바를 sticky로 두어 문서 흐름에 포함되므로 푸터 보정 여백이 필요 없습니다 */

/* ===== back bar ===== */
.backbar{position:sticky; top:50px; z-index:55; background:rgba(246,247,250,.95);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--line)}
.backbar-in{max-width:min(var(--bar-w, var(--maxw)), calc(100vw - var(--gutter, 40px) * 2)); margin:0 auto; padding:8px 18px;
  display:flex; align-items:center; gap:10px}
.backbtn{display:inline-flex; align-items:center; gap:7px; padding:7px 13px 7px 10px;
  border-radius:9px; font-size:13.5px; font-weight:650; color:var(--navy);
  background:var(--card); border:1.4px solid var(--line); min-height:38px; transition:.13s}
.backbtn:hover{background:var(--navy-50); border-color:var(--navy-300)}
.backbtn span:first-child{font-size:15px; line-height:1}
.homebtn{padding:7px 12px; border-radius:9px; font-size:13px; font-weight:600;
  color:var(--ink-3); background:transparent; border:1.4px solid transparent; min-height:38px}
.homebtn:hover{color:var(--navy); background:var(--navy-50)}
.backbar-sp{flex:1}
.backbar-cur{font-size:12.5px; color:var(--ink-3); font-weight:600;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
@media (max-width:768px){ .backbar{top:47px} .prog{top:93px} }
@media (max-width:360px){ .backbar-cur{display:none} }

/* ===== canvas sticky header ===== */
.cv-sticky{position:sticky; top:98px; z-index:48; background:rgba(246,247,250,.96);
  backdrop-filter:blur(8px); margin:0 -18px; padding:11px 18px 0;
  border-bottom:1px solid var(--line)}
.cv-sticky-in{display:flex; align-items:center; gap:12px; padding-bottom:9px}
.cv-title{font-size:14.5px; font-weight:700; color:var(--navy);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.cv-sub{font-size:12px; color:var(--ink-3); margin-top:2px}
.cv-pct{font-size:18px; font-weight:750; color:var(--navy); flex:0 0 auto}
.cv-bar{height:4px; background:#e4e8f0; margin:0 -18px}
.cv-bar i{display:block; height:100%; background:var(--navy); transition:width .4s}
@media (max-width:768px){
  .cv-sticky{top:93px; margin:0 -15px; padding:10px 15px 0}
  .cv-bar{margin:0 -15px}
}

/* ===== canvas examples ===== */
.ex-btn{font-size:12.5px; font-weight:650; color:var(--info);
  padding:5px 10px; border-radius:7px; background:var(--info-bg)}
.ex-btn:hover{background:#dceafa}
.ex-box{margin-top:9px; padding:12px 13px; background:#fafbfd;
  border:1px solid var(--line); border-radius:9px}
.ex-row{display:flex; gap:9px; align-items:flex-start; margin-bottom:8px;
  font-size:13px; line-height:1.6}
.ex-tag{flex:0 0 auto; font-size:11px; font-weight:700; padding:3px 8px; border-radius:6px}
.ex-tag.ok{background:var(--ok-bg); color:var(--ok)}
.ex-tag.bad{background:var(--bad-bg); color:var(--bad)}
.ex-tip{font-size:12.5px; color:var(--ink-2); padding-top:8px;
  border-top:1px dashed var(--line); line-height:1.6}

/* ===== framework switch chips ===== */
.chip.fw-rec{border-color:var(--ok); background:var(--ok-bg); color:var(--ok); font-weight:700}
.chip.fw-rec:hover{background:#d8ede5}
.chip.fw-mid{border-color:var(--line); background:var(--card); color:var(--ink-2)}
.chip.fw-blocked{border-color:#e6d3d1; background:#fdf6f5; color:#a5807c;
  border-style:dashed}
.fw-legend{display:flex; gap:15px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-3)}
.fw-legend span{display:inline-flex; align-items:center; gap:5px}
.fw-legend .d{width:9px; height:9px; border-radius:50%; display:inline-block}
.fw-legend .d.rec{background:var(--ok)}
.fw-legend .d.mid{background:#c3c9d6}
.fw-legend .d.blk{background:#e0bdb9}

/* ===== landing ===== */
.lp-nav{
  display:flex; align-items:center; justify-content:space-between; gap:13px; width:100%; text-align:left;
  padding:15px 17px; border:1.5px solid var(--line); border-radius:11px; background:var(--card);
  min-height:60px; transition:.14s;
}
.lp-nav:hover{border-color:var(--navy-300); background:var(--navy-50)}
.lp-nav b{font-size:14.5px}
.lp-arrow{color:var(--navy-300); font-size:17px; flex:0 0 auto}
.lp-nav:hover .lp-arrow{color:var(--navy)}

.pf-narrow{display:none}
.pf-row{display:flex; gap:14px; align-items:flex-start; padding:16px 0; border-bottom:1px solid var(--line)}
.pf-row:last-child{border-bottom:none}
.pf-row.on{background:linear-gradient(90deg,var(--navy-50),transparent);
  margin:0 -10px; padding-left:10px; padding-right:10px; border-radius:9px}
.pf-num{flex:0 0 32px; height:32px; border-radius:50%; background:var(--navy); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:14.5px; font-weight:700}
.pf-num.opt{background:var(--warn); font-size:17px}
.pf-time{font-size:12px; font-weight:700; color:var(--navy-700); background:#e3e8f2;
  padding:5px 11px; border-radius:11px; white-space:nowrap}
.pf-time.opt{color:#7a4e00; background:#f6ecd8}
.pf-row.opt{background:#fdfbf5; margin:0 -10px; padding-left:10px; padding-right:10px;
  border-radius:9px; border:1px dashed #e0d4b8; border-bottom:1px dashed #e0d4b8}
.pf-row.opt b{color:#7a4e00}

/* 진행 흐름 카드는 다른 카드와 같은 폭을 씁니다 */
.pf-card{padding:24px 22px}
@media (max-width:768px){ .pf-card{padding:19px 17px} }

/* ===== responsive ===== */
/* 5단계 가로 배치는 좁은 화면에서 글자가 뭉개지므로 900px 아래는 세로로 전환합니다 */
@media (max-width:900px){ .pf-wide{display:none} .pf-narrow{display:block} }
@media (max-width:768px){
  :root{--fs-h1:24px; --fs-h2:19px; --fs-h3:16px; --fs-b:15px; --gutter:16px}
  .wrap{padding:0 15px}
  .card{padding:17px; border-radius:12px}
  .opts.two{grid-template-columns:1fr}
  .topbar-in{padding:10px 15px}
  .brand-s{display:none}
  .main{padding:18px 0 0}
  .pf-wide{display:none}
  .pf-narrow{display:block}
}
@media (max-width:360px){
  :root{--fs-h1:22px; --fs-b:14.5px}
  .wrap{padding:0 13px}
  .card{padding:15px}
  .btn{padding:12px 15px; font-size:14.5px}
  .bbar .btn{max-width:none}
  .bbar .btn-g{flex:0 0 96px; min-width:96px}
}


/* ===== 모바일 최적화 ===== */
@media (max-width:768px){
  /* 상단 고정 요소가 화면을 너무 먹지 않도록 축약합니다 */
  .topbar-in{padding:8px 15px}
  .brand img{width:24px; height:24px}
  .brand-t{font-size:14px}
  .backbar{top:43px}
  .backbar-in{padding:6px 15px}
  .backbtn{padding:8px 11px 8px 9px; font-size:13px; min-height:40px}
  .homebtn{padding:8px 10px; font-size:12.5px; min-height:40px}
  .prog{top:82px; padding:9px 0 5px}
  .cv-sticky{top:82px}
  /* 카드 여백 축소로 본문 확보 */
  .card{padding:16px 15px}
  .card+.card{margin-top:12px}
  /* 입력 요소는 iOS 확대 방지를 위해 16px 유지 */
  input,textarea,select{font-size:16px}
  /* 긴 표는 카드형 스크롤 */
  .stbl{font-size:12.5px}
  .stbl th,.stbl td{padding:7px 6px}
  /* 하단바 버튼 */
  .bbar .btn{font-size:14.5px; padding:12px 14px}
  .bbar .btn-g{max-width:130px}
}
@media (max-width:400px){
  .backbar-cur{display:none}
  .bbar .btn-g{max-width:104px; font-size:13.5px}
  .chips{gap:6px}
  .chip{padding:6px 11px; font-size:12.5px}
}

/* ===== print / A4 ===== */
@media print{
  @page{ size:A4 portrait; margin:13mm 13mm 14mm 13mm; }
  html,body{background:#fff !important; font-size:10.2pt; line-height:1.5}
  .topbar,.bbar,.prog,.no-print,button{display:none !important}
  .main{padding:0}
  .wrap{max-width:none; padding:0}
  /* 여백 최소화 원칙: 섹션(카드)이 페이지 경계에 걸리면 통째로 밀지 말고 이어서 쪼갠다.
     대신 제목이 페이지 맨 아래 홀로 남지 않게, 그리고 표의 행·작은 블록만 쪼개짐을 막는다. */
  .card{box-shadow:none; border:1px solid #d3d8e2; border-radius:6px; padding:9px 12px; margin-bottom:7px}
  .rep-sec{margin-bottom:7px}
  .rep-sec h2,.rep-sec h3{break-after:avoid; page-break-after:avoid; break-inside:avoid}
  /* 표지: 과한 상단 여백(52mm)이 첫 장을 반쯤 비웠음 → 적정치로 축소 */
  /* 표지: 내용을 페이지 세로 중앙에 배치(상단 여백으로 밀어내던 방식이 하단을 크게 비웠음) */
  .rep-cover{break-after:page; page-break-after:always; text-align:center;
    min-height:250mm; display:flex; flex-direction:column; justify-content:center;
    padding-top:0; padding-bottom:0; border:none}
  /* 오늘 할 일·핵심 요약 같은 짧고 중요한 카드만 쪼개짐 방지 */
  .rep-sec.keep, .card.keep{break-inside:avoid; page-break-inside:avoid}
  table{break-inside:auto}
  tr,td,th{break-inside:avoid; page-break-inside:avoid}
  thead{display:table-header-group}
  svg,.mtx{break-inside:avoid; page-break-inside:avoid; max-width:100%}
  /* 증거 막대: absolute 자식(막대·기준선)이 인쇄 레이아웃에서 삐져나와 뒤 요소와 겹치는 것 방지 */
  .evbar{overflow:hidden !important}
  .evbar > div{ top:0 !important; bottom:0 !important }
  .rep-sec,.card{position:relative}
  a{color:#000; text-decoration:none}
  a[href^="http"]::after{content:" (" attr(href) ")"; font-size:8pt; color:#666; word-break:break-all}
  .foot{background:#fff !important; color:#333 !important; border-top:1px solid #ccc; padding:10px 0}
  .foot b,.foot a{color:#000 !important}
  .print-only{display:block !important}
  details{display:block !important}
  details > summary{display:none !important}
  details > *:not(summary){display:block !important}
  * { -webkit-print-color-adjust:exact; print-color-adjust:exact }
}
.print-only{display:none}
@media (prefers-reduced-motion:reduce){ *{animation:none !important; transition:none !important} }
</style>
</head>

/* 적합도 5단계 라벨 */
function fitLabel(score) {
  if (score >= 80) return { key:'high',    label:'매우 적합', tone:'ok'   };
  if (score >= 65) return { key:'good',    label:'적합',      tone:'ok'   };
  if (score >= 50) return { key:'mid',     label:'보통',      tone:'warn' };
  if (score >= 35) return { key:'low',     label:'낮음',      tone:'warn' };
  return             { key:'avoid',   label:'권장하지 않음', tone:'bad' };
}

/* ---------- 1. 사업단계 판별 (업력 단독 사용 금지) ---------- */
function resolveStage(a) {
  const reasons = [];
  const hasBiz    = a.hasBusiness === 'yes';
  const rev       = a.revenueStatus;       // none | once | occasional | recurring
  const repeat    = a.repeatPurchase;      // none | some | many | unknown
  const product   = a.productReadiness;    // idea | designing | prototype | launched | improving
  const headcount = a.headcount;

  let stage;
  if (rev === 'recurring' && repeat === 'many') {
    stage = (headcount === 'mid' || headcount === 'large') ? 'growth' : 'repeat';
    reasons.push('반복매출이 발생하고 재구매 고객이 다수 확인되었습니다.');
    if (stage === 'growth') reasons.push('조직 규모를 함께 고려해 성장 단계로 판정했습니다.');
  } else if (rev === 'recurring' || (rev === 'occasional' && repeat === 'many')) {
    stage = 'repeat';
    reasons.push('매출이 반복되고 있으나 재구매 구조가 완전히 검증되지는 않았습니다.');
  } else if (rev === 'occasional' || rev === 'once') {
    stage = 'revenue';
    reasons.push('매출이 발생했으나 아직 반복성이 확인되지 않았습니다.');
  } else if (product === 'launched' || product === 'improving') {
    stage = 'early';
    reasons.push('제품·서비스는 출시되었으나 매출이 아직 없어 초기고객 확보 단계로 판정했습니다.');
  } else if (product === 'prototype') {
    stage = 'mvp';
    reasons.push('시제품·MVP를 개발 중인 상태입니다.');
  } else if (product === 'designing') {
    stage = 'problem';
    reasons.push('설계 단계이며 고객 문제 확인이 우선인 상태입니다.');
  } else {
    stage = 'idea';
    reasons.push('아이디어를 구체화하는 단계입니다.');
  }

  // 성숙·전환 보정: 사업자 보유 + 업력 7년 이상 + 반복매출
  if (hasBiz && a.yearsInBusiness >= 7 && (rev === 'recurring')) {
    stage = 'mature';
    reasons.push('업력 7년 이상이며 반복매출이 있어 성숙·전환 단계로 판정했습니다.');
  }

  reasons.push('※ 업력만으로 단계를 결정하지 않고 매출·재구매·제품 완성도·조직 규모를 함께 사용했습니다.');
  return { stage, reasons };
}

function resolveEvidence(list) {
  const items = (list || []).filter(x => x !== 'none');
  const raw = items.reduce((s,k) => s + (EVIDENCE_WEIGHTS[k] || 0), 0);
  const maxRaw = Object.values(EVIDENCE_WEIGHTS).reduce((a,b)=>a+b,0); // 100

  // 0~100 연속 점수 (A안)
  const score = Math.round(Math.min(100, raw));

  // 단계별 진행도 (C안)
  const stages = EVIDENCE_STAGES.map(st => {
    const got = st.items.filter(i => items.includes(i));
    const pts = got.reduce((s,k)=>s+(EVIDENCE_WEIGHTS[k]||0),0);
    const pct = Math.round(pts / st.max * 100);
    return {
      id:st.id, name:st.name, desc:st.desc,
      value: Math.min(100, pct),
      points: pts, max: st.max,
      got: got,
      cleared: pct >= EVIDENCE_BASELINE,
      label: pct===0 ? '아직 없음' : pct>=EVIDENCE_BASELINE ? '확인됨' : '일부 확인'
    };
  });

  // 도달 단계: 통과한 단계 중 가장 뒤쪽을 기준으로 봅니다.
  // (앞 단계를 건너뛰고 파일럿부터 한 경우도 실제로 흔합니다)
  let reached = -1;
  stages.forEach((s,i)=>{ if (s.cleared) reached = i; });

  // 다음 목표: 아직 통과하지 못한 단계 중 가장 앞쪽
  const nextStage = stages.find(s => !s.cleared) || null;

  // 건너뛴 단계 안내용
  const skipped = stages.filter((s,i)=> i < reached && !s.cleared);

  // 5단계 라벨 (프레임워크 적합도 계산에 사용)
  let level, label;
  if (score === 0)      { level='none';   label='증거 없음'; }
  else if (score <= 15) { level='weak';   label='초기 증거'; }
  else if (score <= 45) { level='medium'; label='중간 수준 증거'; }
  else                  { level='strong'; label='충분한 증거'; }

  return {
    level, label, score, raw, maxRaw,
    count: items.length, items,
    stages, reached, nextStage, skipped,
    baseline: EVIDENCE_BASELINE
  };
}

/* ---------- 3. 프레임워크 점수 ---------- */
function scoreFrameworks(answers, frameworks) {
  const { stage } = resolveStage(answers);
  const ev = resolveEvidence(answers.evidence);

  // 가중치 조정 적용
  const adj = GOAL_WEIGHT_ADJUST[answers.goal] || {};
  const weights = {};
  DIMENSIONS.forEach(d => { weights[d.id] = d.weight + (adj[d.id] || 0); });

  const offeringsAll = answers.offerings || [];
  const isMulti = answers.customerType === 'multi' || answers.customerType === 'c2c'
    || offeringsAll.includes('platform') || offeringsAll.includes('marketplace');

  const results = frameworks.map(fw => {
    const parts = [];

    const stageFit = fw.stageFit[stage] ?? 0.5;
    parts.push({ dim:'stage', name:'사업단계 적합성', weight:weights.stage, fit:stageFit,
      explain:`현재 ${STAGES.find(s=>s.id===stage).name}에 대한 이 프레임워크의 적합도입니다.` });

    const offerings = answers.offerings || [];
    const offFit = offerings.length
      ? Math.max(...offerings.map(o => fw.offeringFit[o] ?? 0.5))
      : 0.5;
    parts.push({ dim:'offering', name:'제공형태 적합성', weight:weights.offering, fit:offFit,
      explain: offerings.length ? '선택하신 제공형태 중 가장 적합도가 높은 값을 사용했습니다.' : '제공형태 미입력으로 중립값을 적용했습니다.' });

    const custFit = fw.customerFit[answers.customerType] ?? 0.5;
    parts.push({ dim:'customer', name:'고객구조 적합성', weight:weights.customer, fit:custFit,
      explain:'비용을 지불하는 고객 구조와의 적합도입니다.' });

    const revs = answers.revenues || [];
    const revFit = revs.length
      ? Math.max(...revs.map(r => fw.revenueFit[r] ?? 0.5))
      : (fw.revenueFit.none ?? 0.5);
    parts.push({ dim:'revenue', name:'수익구조 적합성', weight:weights.revenue, fit:revFit,
      explain: revs.length ? '현재(계획) 수익구조와의 적합도입니다.' : '수익구조가 아직 없는 상태를 기준으로 계산했습니다.' });

    const evFit = fw.evidenceFit[ev.level] ?? 0.5;
    parts.push({ dim:'evidence', name:'증거요건 적합도', weight:weights.evidence, fit:evFit,
      explain:`이 프레임워크가 요구하는 증거 수준과 현재 보유 증거(${ev.label})의 맞춤 정도입니다. 증거의 양(증거 충족도)과는 다른 값입니다.` });

    const opsFit = fw.opsFit[answers.headcount] ?? 0.7;
    parts.push({ dim:'ops', name:'규제·자본·운영 적합성', weight:weights.ops, fit:opsFit,
      explain:'조직 규모와 운영 여건에 대한 적합도입니다.' });

    let total = 0;
    parts.forEach(p => { p.contribution = Math.round(p.weight * p.fit); total += p.contribution; });

    // 하드필터: 구조적으로 성립하지 않는 조합
    const blocks = [];
    if (fw.id === 'platform' && !isMulti) {
      blocks.push('고객 집단이 하나인 단면 구조에서는 플랫폼 캔버스가 존재하지 않는 양면성을 가정하게 됩니다.');
    }
    if (fw.id === 'circular' && !answers.circularRelevant) {
      blocks.push('자원 회수·재사용 활동이 확인되지 않아 순환경제 캔버스의 전제가 성립하지 않습니다.');
    }
    if (fw.id === 'mission' && answers.customerType !== 'split' && answers.customerType !== 'b2g' && !answers.socialMission) {
      blocks.push('수혜자와 비용 지불자가 분리된 구조가 확인되지 않았습니다.');
    }
    if (fw.id === 'bmnav' && (stage === 'idea' || stage === 'problem')) {
      blocks.push('해체할 기존 사업모델이 없어 패턴 이식 방식의 적용이 어렵습니다.');
    }
    if (fw.id === 'pss' && !offerings.includes('product') && !offerings.includes('pss')) {
      blocks.push('제품 요소가 없어 제품–서비스 통합 구조의 전제가 성립하지 않습니다.');
    }
    if (blocks.length) total = total * 0.45;

    /* 특수구조 가산점
       BMC와 린 캔버스는 모든 상황에 두루 맞는 범용 도구여서, 가중치만으로는
       특수구조 전용 프레임워크를 항상 앞지릅니다. 특정 구조가 실제로 확인된
       경우에만 해당 전용 프레임워크에 가산점을 부여해 순위를 바로잡습니다.
       가산 근거는 사용자에게 그대로 공개합니다. */
    const bonuses = [];
    const addBonus = (pts, text) => bonuses.push({ points: pts, text });

    if (fw.id === 'pss' && (offerings.includes('pss') ||
        (offerings.includes('product') && (revs.includes('rental') || revs.includes('usage') || revs.includes('performance') || answers.servitizing)))) {
      addBonus(12, '제품에 서비스를 결합하는 구조가 확인되어 이 구조 전용 프레임워크에 가산점을 부여했습니다.');
    }
    if (fw.id === 'circular' && answers.circularRelevant) {
      addBonus(14, '자원 회수·재사용 활동이 확인되어 순환구조 전용 프레임워크에 가산점을 부여했습니다.');
    }
    if (fw.id === 'mission' && (answers.socialMission || answers.customerType === 'split')) {
      addBonus(10, '수혜자와 비용 지불자가 분리된 구조가 확인되어 가산점을 부여했습니다.');
    }
    if (fw.id === 'platform' && isMulti) {
      addBonus(10, '양면·다면 구조가 확인되어 플랫폼 전용 프레임워크에 가산점을 부여했습니다.');
    }
    if (fw.id === 'bmnav' && (stage === 'mature' || stage === 'growth') && answers.goal === 'newbiz') {
      addBonus(8, '기존 사업을 보유한 상태에서 신사업을 검토 중이므로 패턴 이식 도구에 가산점을 부여했습니다.');
    }

    /* 범용 프레임워크 감산
       위에서 전용 프레임워크가 발동한 경우, 범용 도구는 여전히 유용하지만
       '주 프레임워크'로 앞세울 이유가 약해집니다. 보조 모델 위치로 내립니다. */
    const specialTriggered = answers.circularRelevant || answers.socialMission ||
      answers.servitizing || isMulti || answers.customerType === 'split';
    if ((fw.id === 'bmc' || fw.id === 'lean') && specialTriggered) {
      addBonus(-9, '이 사업에는 구조 전용 프레임워크가 더 정확하므로, 범용 도구는 보조 모델로 배치했습니다.');
    }

    bonuses.forEach(b => { total += b.points; });
    total = Math.round(Math.max(0, Math.min(100, total)));
    return { framework: fw, score: total, parts, bonuses, blocks, fit: fitLabel(total), stage, evidence: ev };
  });

  results.sort((a,b) => b.score - a.score);
  return { results, stage, evidence: ev, weights, weightNote: adj.note || null };
}

/* ---------- 4. 패턴 매칭 ---------- */
function STAGE_LABEL(stage){
  return ({idea:'아이디어',problem:'문제 확인',mvp:'MVP 개발',early:'초기고객 확보',
    revenue:'초기매출',repeat:'반복매출 검증',growth:'성장',mature:'성숙·전환'})[stage] || '현재';
}

/* ── 레드팀 개선 #1: 증거 점수 맥락 프레이밍 ──
   같은 점수라도 사업 단계에 따라 의미가 다릅니다.
   초기 단계의 낮은 점수는 '실패 판정'이 아니라 '정상적인 출발선'이고,
   후기 단계의 낮은 점수는 '지금 채워야 할 신호'입니다.
   숫자 옆에 이 맥락을 숫자만큼 강하게 배치해, 정직한 점수가 이탈로 이어지지 않게 합니다.
   반환: { tone:'normal'|'progress'|'signal', head:'한 줄 진단', body:'맥락 설명' } */
function evidenceContext(stage, score){
  // 단계별로 '이 시점에 기대되는 증거 수준'의 눈높이가 다릅니다.
  const early  = ['idea','problem','mvp'].includes(stage);      // 아직 시장검증 전 — 낮아도 정상
  const mid    = ['early','revenue'].includes(stage);           // 검증이 붙기 시작하는 구간
  const late   = ['repeat','growth','mature'].includes(stage);  // 증거가 쌓여 있어야 정상
  const sLabel = STAGE_LABEL(stage);

  if (early) {
    if (score < 30) return { tone:'normal',
      head:`${sLabel} 단계에서는 대부분 여기서 시작합니다`,
      body:'아직 고객을 만나기 전이라 증거가 적은 것이 자연스러운 시점입니다. 이 점수는 "부족함"이 아니라 "출발선"이며, 앞으로 무엇을 확인해 나갈지를 보여주는 지도로 읽으시면 됩니다.' };
    if (score < 60) return { tone:'progress',
      head:`${sLabel} 단계치고 증거를 잘 쌓아 오셨습니다`,
      body:'같은 단계의 평균보다 앞서 고객 확인이 진행된 편입니다. 지금 흐름을 이어 결제·재구매까지 확인하면 다음 단계로 올라섭니다.' };
    return { tone:'progress',
      head:`${sLabel} 단계에서 이례적으로 탄탄한 증거입니다`,
      body:'현재 단계 대비 증거가 앞서 있습니다. 다음 단계(초기고객·매출)로 판단 기준을 옮겨 검증하실 시점입니다.' };
  }
  if (mid) {
    if (score < 40) return { tone:'signal',
      head:`${sLabel} 단계라면 증거를 더 확보하실 시점입니다`,
      body:'출시·매출이 시작된 단계에서는 고객 반응·결제 증거가 이만큼 쌓여 있어야 다음 판단이 단단해집니다. 부정적 신호라기보다 "지금 집중할 지점"이 어디인지를 알려주는 값입니다.' };
    if (score < 60) return { tone:'progress',
      head:`증거가 기준선을 향해 쌓이는 중입니다`,
      body:'결제·재구매 증거를 조금 더 확보하면 기준선을 넘어 단계가 확정됩니다. 어떤 증거가 비어 있는지는 아래 단계별 막대에서 확인하실 수 있습니다.' };
    return { tone:'normal',
      head:`${sLabel} 단계에 걸맞은 증거를 갖추셨습니다`,
      body:'현재 단계에서 기대되는 증거 수준을 충족합니다. 이 기반 위에서 다음 단계 전략으로 넘어가셔도 좋습니다.' };
  }
  if (late) {
    if (score < 60) return { tone:'signal',
      head:`${sLabel} 단계 대비 증거 보강이 필요합니다`,
      body:'반복매출·성장 단계에서는 재구매와 지속 결제 증거가 충분히 쌓여 있어야 안정적입니다. 낮은 값은 성과가 없다는 뜻이 아니라, 기록·측정되지 않은 증거를 정리해 드러낼 필요가 있다는 신호입니다.' };
    return { tone:'normal',
      head:`${sLabel} 단계에 맞는 증거가 확인됩니다`,
      body:'현재 단계에서 기대되는 증거 기반을 갖추고 있습니다.' };
  }
  // 폴백
  if (score < 60) return { tone:'progress',
    head:'증거를 쌓아가는 과정에 있습니다',
    body:'이 점수는 확보한 증거의 강도를 나타내며, 사업 성공 가능성이 아닙니다. 아래에서 다음에 확보할 증거를 확인하실 수 있습니다.' };
  return { tone:'normal',
    head:'증거 기반이 안정적으로 확인됩니다',
    body:'현재까지 확보된 증거가 충분한 수준입니다.' };
}
function OFFER_CUST_LABEL(ct){
  return ({b2c:'개인 대상(B2C)',b2b:'기업 대상(B2B)',b2b2c:'기업·소비자 연계(B2B2C)',
    multi:'다면시장',c2c:'개인 간 거래(C2C)',gov:'공공·기관'})[ct] || '현재';
}
function scorePatterns(answers, patterns) {
  const { stage } = resolveStage(answers);
  const ev = resolveEvidence(answers.evidence);
  const offerings = answers.offerings || [];
  const revs = answers.revenues || [];
  const evRank = { none:0, weak:1, medium:2, strong:3 }[ev.level];

  const scored = patterns.map(p => {
    let s = 0; const why = []; const caution = [];
    const nm = p.nameKo || p.name || '이 패턴';

    if (p.suitableStages.includes(stage)) { s += 30; why.push(`${STAGE_LABEL(stage)} 단계에서 ${nm} 방식은 무리 없이 시작할 수 있습니다.`); }
    else { s += 6; }

    const offHit = offerings.filter(o => p.suitableIndustries.includes(o));
    if (offHit.length) { s += 25; why.push(`${p.valueCreationLogic||nm+'의 가치 생산 방식'} — 지금 제공형태와 맞물립니다.`); }
    else { s += 5; }

    if (p.suitableCustomerTypes.includes(answers.customerType)) { s += 20; why.push(`${OFFER_CUST_LABEL(answers.customerType)} 고객구조에 ${nm}을(를) 적용할 수 있습니다.`); }
    else { s += 4; }

    const revHit = revs.filter(r => matchRevenueToPattern(r, p.patternId));
    if (revHit.length) { s += 15; why.push(`수익 실현: ${p.revenueLogic||'선택한 수익구조와 직접 연결됩니다.'}`); }

    // 증거 요건
    const needsEvidence = ['marketplace','multi-sided','transaction-fee','franchise','freemium','advertising','outcome-based','performance-based'];
    if (needsEvidence.includes(p.patternId)) {
      if (evRank >= 2) { s += 10; }
      else {
        s -= 12;
        caution.push(`${nm}은(는) 양쪽 참여자(또는 반복 거래)가 어느 정도 모인 뒤라야 작동합니다. 지금은 증거가 얇아, 먼저 소규모로 거래를 성사시켜 수요를 확인한 뒤 확대하십시오.`);
      }
    } else { s += 10; }

    // 자본 요건
    if (p.tags.capital === 'high' && (answers.headcount === 'micro' || stage === 'idea' || stage === 'problem')) {
      s -= 10;
      caution.push(`${nm}은(는) 초기 투입이 큽니다. 현재 규모·단계에서는 최소 실행 범위로 쪼개고, 회수 시점을 기준으로 확대 여부를 정하십시오.`);
    }
    // 양면 구조 요건
    if (p.tags.platform && !['multi','c2c','b2b2c'].includes(answers.customerType)
        && !offerings.includes('platform') && !offerings.includes('marketplace')) {
      s -= 14;
      caution.push(`${nm}은(는) 공급자·수요자 양면 구조를 전제로 합니다. 지금 구조에서는 이 전제가 확인되지 않아, 한쪽 집단부터 확보한 뒤 검토하는 편이 안전합니다.`);
    }

    s = Math.max(0, Math.min(100, s));
    return { pattern:p, score:s, why, caution };
  });

  scored.sort((a,b) => b.score - a.score);
  const recommended = scored.filter(x => x.caution.length === 0).slice(0,5);
  const cautions    = scored.filter(x => x.caution.length > 0).sort((a,b)=>b.score-a.score).slice(0,3);
  return { recommended, cautions, all: scored };
}

function matchRevenueToPattern(rev, pid) {
  const map = {
    product:['direct-sales','razor-blade','bundling','white-label','long-tail'],
    service:['direct-sales','brokerage','performance-based','bundling'],
    subscription:['subscription','freemium','servitization','open-source'],
    usage:['usage-based','servitization','rental'],
    transaction:['transaction-fee','marketplace','multi-sided'],
    brokerage:['brokerage','marketplace'],
    ad:['advertising','cross-subsidy','multi-sided'],
    license:['license','white-label','open-source'],
    rental:['rental','leasing','servitization'],
    franchise:['franchise'],
    data:['data-monetization','long-tail'],
    performance:['performance-based','outcome-based'],
    public:['ecosystem','cross-subsidy'],
    other:[]
  };
  return (map[rev] || []).includes(pid);
}

/* ---------- 5. 가설 추출 ---------- */
function extractHypotheses(answers, canvasEntries, topFw) {
  const hyps = [];
  const push = (title, basis, importance, uncertainty, method) =>
    hyps.push({ id:'h'+(hyps.length+1), title, basis, importance, uncertainty, method });

  const ev = resolveEvidence(answers.evidence);
  const items = ev.items;
  // 감사 개선 #1: 사업 단계에 따라 검증할 가설의 성격이 달라집니다.
  // 초기(문제가 진짜인가) ↔ 후기(이 구조가 반복·확장 가능한가).
  const stg = resolveStage(answers).stage;
  const late = ['repeat','growth','mature'].includes(stg);   // 반복매출~성숙: 이미 사업이 돎
  const mid  = ['revenue','early'].includes(stg);            // 매출은 나되 반복성 검증 중

  if (!items.includes('interview') && !items.includes('survey')) {
    if (late) push('핵심 고객 세그먼트별로 남는 문제와 이탈 사유가 무엇인지 확인되어 있다',
      '고객 인터뷰·설문 증거가 입력되지 않았습니다.', 4, 4,
      '이탈·해지 고객 8~12명 인터뷰로 떠난 이유와 남은 불만을 분류합니다.');
    else if (mid) push('지금 사는 고객이 그 문제를 정말 중요하게 여겨 계속 살 이유가 된다',
      '고객 인터뷰·설문 증거가 입력되지 않았습니다.', 5, 4,
      '최근 구매 고객 8~10명 인터뷰로 구매 이유와 계속 살 이유를 확인합니다.');
    else push('고객이 실제로 이 문제를 중요하게 겪고 있다',
      '고객 인터뷰·설문 증거가 입력되지 않았습니다.', 5, 5,
      '목표 고객 8~12명 인터뷰. 문제 발생 빈도와 현재 해결 방식을 질문합니다.');
  }
  if (!items.includes('sales') && !items.includes('contract') && !items.includes('preorder')) {
    if (late) push('거래 한 건의 단위경제성이 표준 지표로 측정·관리되고 있다',
      '판매·계약 증거가 입력되지 않았습니다.', 5, 4,
      '대표 거래·매장·채널 3곳의 건당 공헌이익과 회수 기간을 같은 기준으로 측정합니다.');
    else if (mid) push('반복 가능한 판매 경로에서 실제 결제가 일어난다',
      '판매·계약·사전예약 증거가 입력되지 않았습니다.', 5, 4,
      '한 채널에서 반복 결제가 나는지 4주 이상 추적해 확인합니다.');
    else push('고객이 이 문제 해결에 실제로 돈을 지불한다',
      '판매·계약·사전예약 증거가 입력되지 않았습니다.', 5, 5,
      '사전예약 또는 유료 파일럿을 소규모로 개설해 실제 결제 발생 여부를 확인합니다.');
  }
  if (!items.includes('repeat') && !items.includes('retention')) {
    if (late) push('반복·재구매 구조가 지표로 측정되어 확장해도 유지된다',
      '재구매·리텐션 증거가 입력되지 않았습니다.', 5, 4,
      '재구매율·해지율을 정기 지표로 만들어, 확장 전후로 값이 유지되는지 확인합니다.');
    else push('구매한 고객이 다시 구매한다',
      '재구매·리텐션 증거가 입력되지 않았습니다.', 5, 4,
      '초기 구매 고객의 재구매 주기를 추적하고 이탈 사유를 확인합니다.');
  }
  (answers.revenues || []).forEach(r => {
    if (r === 'subscription') push('고객이 정기 결제를 유지할 만큼 반복 가치를 느낀다',
      '구독 수익구조를 선택하셨습니다.', 5, 4, '3개월 이상 갱신율과 해지 사유를 측정합니다.');
    if (r === 'transaction' || r === 'brokerage') push('플랫폼 밖 직거래로 이탈하지 않는다',
      '거래·중개 수수료 구조를 선택하셨습니다.', 4, 4, '거래 후 재방문율과 외부 이탈 흔적을 추적합니다.');
    if (r === 'ad') push('광고 수익이 의미 있는 규모가 될 만큼 트래픽이 확보된다',
      '광고 수익구조를 선택하셨습니다.', 4, 5, '월간 활성 이용자와 체류시간을 측정해 광고 단가와 대조합니다.');
  });
  if ((answers.offerings||[]).some(o => ['platform','marketplace'].includes(o))) {
    push('공급자와 수요자를 동시에 확보할 수 있다',
      '플랫폼·마켓플레이스 형태를 선택하셨습니다.', 5, 5,
      '한쪽을 먼저 좁은 영역에서 확보하고 거래 성사율을 측정합니다.');
  }
  if ((answers.offerings||[]).some(o => ['ai','data'].includes(o))) {
    push('추론·데이터 처리 원가가 과금액보다 낮게 유지된다',
      'AI·데이터 형태를 선택하셨습니다.', 5, 4,
      '실사용 기준 건당 원가를 측정하고 과금 단가와 비교합니다.');
    push('데이터 수집·활용 권리가 확보되어 있다',
      'AI·데이터 형태를 선택하셨습니다.', 5, 3,
      '수집 동의 범위와 목적 외 이용 여부를 법률 검토합니다.');
  }
  // 캔버스에서 가설로 표시한 항목
  // 원문을 그대로 넣지 않고, 검증 가능한 명제 형태로 변환합니다.
  (canvasEntries || []).forEach(e => {
    if (e.label !== 'hypothesis' || !e.text || !e.text.trim()) return;
    const t = e.text.trim();
    // 블록 성격(axis)에 따라 확인해야 할 명제가 달라집니다.
    const tmpl = {
      customer:    ['이 고객군이 실제로 존재하고 접근할 수 있다',      '해당 고객군 명단을 확보하고 실제 접촉이 되는지 확인합니다.'],
      problem:     ['고객이 이 문제를 실제로 겪고 있고 중요하게 여긴다','고객 인터뷰에서 이 문제가 스스로 언급되는지 확인합니다.'],
      value:       ['고객이 이 가치를 인정하고 대가를 지불한다',        '이 가치만 설명한 뒤 구매 의사와 지불 가능 금액을 확인합니다.'],
      solution:    ['이 방식으로 고객 문제가 실제로 해결된다',          '소수 고객에게 적용해 문제가 해소되는지 측정합니다.'],
      channel:     ['이 경로로 고객에게 도달할 수 있다',                '경로별로 실제 유입 수와 비용을 측정해 비교합니다.'],
      relation:    ['이 방식으로 고객 관계가 유지된다',                 '접촉 후 재방문·재문의 발생률을 추적합니다.'],
      revenue:     ['이 방식으로 실제 수익이 발생한다',                 '소규모로 실제 과금을 시도해 결제 발생 여부를 확인합니다.'],
      cost:        ['예상한 비용 범위 안에서 운영이 가능하다',          '3개월간 실제 지출을 집계해 예상치와 비교합니다.'],
      resource:    ['이 자원을 실제로 확보하고 유지할 수 있다',         '확보 경로와 조달 기간, 비용을 구체적으로 확인합니다.'],
      activity:    ['이 활동을 반복 가능한 수준으로 수행할 수 있다',    '동일 활동을 여러 건 수행해 소요 시간과 품질 편차를 측정합니다.'],
      partner:     ['이 파트너와 실제로 협력 관계를 맺을 수 있다',      '접촉해 협력 조건과 계약 가능성을 확인합니다.'],
      advantage:   ['이 강점이 경쟁사가 쉽게 따라오기 어려운 것이다',   '경쟁사가 동일 수준에 도달하는 데 필요한 시간·비용을 추정합니다.'],
      metric:      ['이 지표가 사업 상태를 제대로 반영한다',            '지표가 실제 매출·유지와 함께 움직이는지 대조합니다.'],
      alternative: ['고객이 지금 쓰는 대안을 우리 것으로 바꾼다',       '전환 이유와 전환을 막는 요인을 인터뷰로 확인합니다.']
    }[e.axis] || ['이 항목의 내용이 실제로 성립한다', '소수의 실제 고객·현장에 적용해 이 내용이 사실인지 직접 확인합니다.'];

    // 원문은 근거란에 요약해서 남깁니다(과도하게 길면 자릅니다).
    const excerpt = t.length > 45 ? t.slice(0,45).replace(/\n/g,' ') + '…' : t.replace(/\n/g,' ');
    push(
      `${e.blockName}: ${tmpl[0]}`,
      `"${excerpt}" 를 가설로 표시하셨습니다.`,
      4, 4, tmpl[1]
    );
  });
  return hyps;
}

/* ---------- 6. 단위경제성 ----------
   사업 형태(mode)에 따라 입력 항목이 다릅니다.
   어떤 모드든 최종적으로 '거래 한 건의 공헌이익'으로 환산해 같은 지표를 냅니다.
   입력하지 않은 값은 계산하지 않으며, 업계 평균을 임의로 넣지 않습니다. */
function calcUnitEconomics(u) {
  const out = { available:false, mode:u.ueMode||'unit', items:[], notes:[], warns:[] };
  // 'unknown'은 사용자가 '모른다'고 표시한 값입니다. 0으로 치환하지 않고 계산에서 뺍니다.
  const n = v => {
    if (v === '' || v === null || v === undefined || v === 'unknown') return null;
    const cleaned = String(v).replace(/,/g,'');
    return isNaN(Number(cleaned)) ? null : Number(cleaned);
  };
  const mode = out.mode;

  const fixed = n(u.fixedCost);
  const cac   = n(u.cac);
  const repeat= n(u.repeatCount);

  /* 1) 모드별로 '건당 단가'와 '건당 변동비'를 구합니다 */
  let unitPrice = null, unitCost = null, volume = null, unitLabel = '건';

  if (mode === 'unit') {
    unitPrice = n(u.price); unitCost = n(u.variableCost); volume = n(u.monthlyQty);
    unitLabel = '개';
  } else if (mode === 'monthly') {
    const rev = n(u.monthlyRevenue), rate = n(u.costRate), orders = n(u.monthlyOrders);
    if (rev !== null && orders !== null && orders > 0) {
      unitPrice = Math.round(rev / orders);
      out.items.push({ name:'객단가', value:unitPrice, unit:'원',
        formula:'월 매출 ÷ 월 거래건수',
        detail:`${fmt(rev)} ÷ ${fmt(orders)}건 = ${fmt(unitPrice)}원` });
    }
    if (unitPrice !== null && rate !== null) {
      // 반올림 오차를 줄이려 공헌이익 기준으로 역산합니다
      unitCost = unitPrice - Math.round(unitPrice * (100-rate) / 100);
    }
    volume = orders; unitLabel = '건';
  } else if (mode === 'project') {
    unitPrice = n(u.dealSize);
    const dr = n(u.directCostRate);
    if (unitPrice !== null && dr !== null) unitCost = Math.round(unitPrice * dr / 100);
    volume = n(u.monthlyDeals); unitLabel = '건';
  } else if (mode === 'subscription') {
    unitPrice = n(u.price); unitCost = n(u.variableCost); volume = n(u.subscribers);
    unitLabel = '명';
  }

  /* 2) 공헌이익 */
  let cm = null;
  if (unitPrice !== null && unitCost !== null) {
    cm = unitPrice - unitCost;
    out.items.push({ name: mode==='subscription' ? '고객당 월 공헌이익' : '건당 공헌이익',
      value: cm, unit:'원',
      formula: mode==='monthly' ? '객단가 − (객단가 × 원가율)'
             : mode==='project' ? '계약금액 − 직접비'
             : '판매가 − 변동비',
      detail:`${fmt(unitPrice)} − ${fmt(unitCost)} = ${fmt(cm)}원` });
    if (unitPrice > 0) {
      const cmr = cm/unitPrice*100;
      out.items.push({ name:'공헌이익률', value:+cmr.toFixed(1), unit:'%',
        formula:'공헌이익 ÷ 단가 × 100',
        detail:`${fmt(cm)} ÷ ${fmt(unitPrice)} × 100 = ${cmr.toFixed(1)}%` });
    }
    if (cm <= 0) out.warns.push('공헌이익이 0 이하입니다. 팔수록 손실이 커지는 구조이므로 가격이나 원가를 먼저 조정해야 합니다.');
  }

  /* 3) 손익분기 */
  if (cm !== null && cm > 0 && fixed !== null) {
    const bep = Math.ceil(fixed / cm);
    out.items.push({ name:'손익분기 판매량', value:bep, unit:`${unitLabel}/월`,
      formula:'월 고정비 ÷ 공헌이익',
      detail:`${fmt(fixed)} ÷ ${fmt(cm)} = 월 ${fmt(bep)}${unitLabel}` });
    if (volume !== null && volume > 0) {
      const gap = volume - bep;
      out.items.push({ name:'손익분기 대비 현재', value:gap, unit:`${unitLabel}`,
        formula:'현재 판매량 − 손익분기 판매량',
        detail: gap>=0
          ? `월 ${fmt(volume)}${unitLabel} 판매 중이므로 손익분기를 ${fmt(gap)}${unitLabel} 넘었습니다.`
          : `손익분기까지 ${fmt(Math.abs(gap))}${unitLabel}이 더 필요합니다.` });
      if (gap < 0) out.warns.push(`현재 판매량으로는 고정비를 회수하지 못합니다. 판매량을 ${fmt(Math.abs(gap))}${unitLabel} 늘리거나 고정비를 줄여야 합니다.`);
    }
  }

  /* 4) 월 영업이익 (판매량을 아는 경우) */
  if (cm !== null && volume !== null && fixed !== null) {
    const profit = cm*volume - fixed;
    out.items.push({ name:'월 영업이익(추정)', value:profit, unit:'원',
      formula:'(공헌이익 × 판매량) − 월 고정비',
      detail:`(${fmt(cm)} × ${fmt(volume)}) − ${fmt(fixed)} = ${fmt(profit)}원` });
  }

  /* 5) 고객생애가치 */
  let ltv = null;
  if (mode === 'subscription') {
    const churn = n(u.churnRate);
    if (cm !== null && churn !== null && churn > 0) {
      const life = 100/churn;
      ltv = Math.round(cm * life);
      out.items.push({ name:'고객생애가치(LTV)', value:ltv, unit:'원',
        formula:'월 공헌이익 ÷ 월 해지율',
        detail:`${fmt(cm)} ÷ ${churn}% = ${fmt(ltv)}원 (예상 유지 ${life.toFixed(1)}개월)` });
    }
  } else if (cm !== null && repeat !== null && repeat > 0) {
    ltv = cm * repeat;
    out.items.push({ name:'고객생애가치(LTV)', value:ltv, unit:'원',
      formula:'공헌이익 × 평균 거래 횟수',
      detail:`${fmt(cm)} × ${repeat}회 = ${fmt(ltv)}원` });
  }

  /* 6) LTV/CAC · 회수기간 */
  if (ltv !== null && cac !== null && cac > 0) {
    const ratio = ltv/cac;
    out.items.push({ name:'LTV / CAC', value:+ratio.toFixed(2), unit:'배',
      formula:'고객생애가치 ÷ 고객획득비용',
      detail:`${fmt(ltv)} ÷ ${fmt(cac)} = ${ratio.toFixed(2)}배` });
    if (ratio < 1) out.warns.push('고객 한 명을 데려오는 비용이 그 고객에게서 얻는 이익보다 큽니다. 획득 경로나 가격 구조를 점검해야 합니다.');
    else if (ratio < 3) out.notes.push('일반적으로 이 비율이 3배 이상이면 여유가 있다고 봅니다. 다만 업종에 따라 기준이 다르므로 참고만 하시기 바랍니다.');
  }
  if (cm !== null && cm > 0 && cac !== null && cac > 0) {
    const pb = cac/cm;
    const pbUnit = mode==='subscription' ? '개월' : mode==='project' ? '건' : '회';
    out.items.push({ name:'획득비용 회수', value:+pb.toFixed(1), unit:pbUnit,
      formula:'고객획득비용 ÷ 공헌이익',
      detail:`${fmt(cac)} ÷ ${fmt(cm)} = ${pb.toFixed(1)}${pbUnit}`
        + (pb<1 ? ' — 첫 거래에서 바로 회수됩니다.' : '') });
  }

  /* 7) 안내 */
  if (cac === null) out.notes.push('광고·홍보비를 입력하지 않으셨습니다. 0으로 처리하지 않고 관련 지표를 계산하지 않았습니다.');
  // 시뮬레이터 시작값: 실제 입력에서 확보된 것만 채우고, 없는 값은 두지 않습니다(임의 대체 금지).
  if (unitPrice !== null || unitCost !== null || cac !== null) {
    out.seed = {
      price:  unitPrice !== null ? unitPrice : 30000,
      cost:   unitCost  !== null ? unitCost  : 12000,
      cac:    cac       !== null ? cac       : 40000,
      retain: (mode==='subscription' && n(u.churnRate)>0) ? Math.round(100/n(u.churnRate)) : 6
    };
  }
  out.available = out.items.length > 0;
  if (!out.available) out.notes.push('입력된 값이 없어 계산하지 않았습니다. 업계 평균값을 임의로 넣지 않습니다.');
  return out;
}
function fmt(v){ return v === null || v === undefined || isNaN(v) ? '-' : Number(v).toLocaleString('ko-KR'); }

/* ---------- 7. 30·60·90 로드맵 ---------- */
function buildRoadmap(hyps, answers) {
  const ranked = [...hyps].sort((a,b) => (b.importance*b.uncertainty) - (a.importance*a.uncertainty));
  const phases = [
    { id:'d30', name:'0~30일', focus:'가장 위험한 가정부터 확인합니다', items:[] },
    { id:'d60', name:'31~60일', focus:'확인된 내용을 실제 거래로 검증합니다', items:[] },
    { id:'d90', name:'61~90일', focus:'반복 가능한 구조인지 확인합니다', items:[] }
  ];
  ranked.slice(0,3).forEach(h => phases[0].items.push(taskFrom(h, '검증')));
  ranked.slice(3,6).forEach(h => phases[1].items.push(taskFrom(h, '검증')));
  if (phases[1].items.length === 0 && ranked[0]) phases[1].items.push(taskFrom(ranked[0], '확대 검증'));

  phases[1].items.push({
    name:'가격·과금 조건 실험', purpose:'지불 의사와 적정 가격대를 확인합니다',
    hypothesis:'고객은 제시한 가격에 지불한다',
    method:'서로 다른 가격 조건 2안을 소규모 고객군에 제시하고 결제 전환을 비교합니다',
    needs:'가격 2안, 결제 수단, 최소 20건의 접점', owner:'미지정',
    metric:'조건별 결제 전환율', done:'두 조건 간 전환율 차이를 확인', next:'가격 확정 또는 재실험'
  });
  phases[2].items.push({
    name:'단위경제성 재계산', purpose:'실제 데이터로 수익 구조가 성립하는지 확인합니다',
    hypothesis:'고객 한 명에서 이익이 남는다',
    method:'실거래 기준으로 공헌이익, CAC, 회수기간을 다시 계산합니다',
    needs:'실제 판매·비용 데이터', owner:'미지정',
    metric:'공헌이익, LTV/CAC', done:'실측값으로 계산 완료', next:'확대 여부 결정'
  });
  phases[2].items.push({
    name:'재구매·유지 구조 점검', purpose:'반복 매출 가능성을 확인합니다',
    hypothesis:'구매 고객의 일부가 다시 구매한다',
    method:'초기 고객군의 재구매 여부와 이탈 사유를 추적합니다',
    needs:'고객 명부, 접촉 채널', owner:'미지정',
    metric:'재구매율, 이탈 사유 분류', done:'재구매 데이터 확보', next:'반복 구조 설계 또는 피벗'
  });
  return phases;
}
function taskFrom(h, prefix) {
  return {
    name:`${prefix}: ${h.title.slice(0,40)}`,
    purpose:'이 가정이 틀렸을 때 사업 방향이 바뀌므로 먼저 확인합니다',
    hypothesis:h.title, method:h.method,
    needs:'대상 고객 명단, 질문지 또는 실험 환경', owner:'미지정',
    metric:'응답·전환 데이터', done:'판단 가능한 수준의 데이터 확보',
    next:'가설 유지 / 수정 / 폐기 결정'
  };
}

function scanCoherence(answers, unitResult) {
  const a = answers;
  const offerings = a.offerings || [];
  const revs = a.revenues || [];
  const evList = a.evidence || [];
  const has = (...ids)=> ids.some(id=>evList.includes(id));
  const ev = resolveEvidence(evList);
  const stage = a.stage || '';
  const ctx = {
    subscription: revs.includes('subscription'),
    platform: ['multi','c2c','b2b2c'].includes(a.customerType)
              || offerings.includes('platform') || offerings.includes('marketplace'),
    hasRepeatEvidence: has('repeat','retention','referral'),
    hasBothSidesSignal: has('contract','sales','paidconv') && has('pilot','poc','preorder','waitlist'),
    hasAskEvidence: has('interview','survey'),
    evScore: ev.score,
    unitEconomicsOk: !!(unitResult && unitResult.available
                        && !(unitResult.warns||[]).some(w=>/공헌이익이 0 이하/.test(w))),
    revCount: revs.filter(r=>r && r!=='none').length,
    earlyStage: ['idea','problem','mvp','early'].includes(stage),
    hardOffer: offerings.includes('product') || offerings.includes('pss') || offerings.includes('sw'),
    aiOffer: offerings.includes('ai'),
    hasDataMoat: offerings.includes('data') || revs.includes('data')
  };
  const hits = COHERENCE_RULES.filter(r=>{ try { return r.when(a,ctx); } catch(e){ return false; } });
  return { hits, ctx,
    count: hits.length,
    high: hits.filter(h=>h.level==='high').length };
}

function buildRisks(answers, patternResult, fw) {
  const offerings = answers.offerings || [];
  const revs = answers.revenues || [];
  const recPatterns = (patternResult.recommended||[]).map(x=>x.pattern.patternId);
  const cauPatterns = (patternResult.cautions||[]).map(x=>x.pattern.patternId);
  const active = new Set([...recPatterns, ...cauPatterns]);

  // 조건 충족 여부
  const cond = {
    product: offerings.includes('product') || offerings.includes('pss'),
    platform: ['multi','c2c','b2b2c'].includes(answers.customerType)
              || offerings.includes('platform') || offerings.includes('marketplace'),
    subscription: revs.includes('subscription') || active.has('subscription'),
    freemium: active.has('freemium'),
    franchise: offerings.includes('franchise') || revs.includes('franchise'),
    data: offerings.includes('data') || revs.includes('data'),
    ai: offerings.includes('ai'),
    highcap: [...active].some(p => {
      const pt = PATTERNS.find(x=>x.patternId===p);
      return pt && pt.tags.capital === 'high';
    })
  };

  const ev = resolveEvidence(answers.evidence);
  const out = [];
  RISK_LIBRARY.forEach(r => {
    // 필요 조건이 하나라도 걸리면 채택. 조건이 비어 있으면 공통 리스크.
    const relevant = r.need.length === 0 || r.need.some(n => cond[n]);
    if (!relevant) return;

    /* 심각도 판정
       "높음"이 남발되면 우선순위 변별이 사라지므로,
       (a) 이 사업의 핵심 구조에 직결되고 (b) 증거가 부족한 경우로 좁힙니다. */
    let sev = 1;

    // 이 사업의 핵심 구조에 해당하는가
    const isCore =
      (r.need.includes('platform')     && cond.platform) ||
      (r.need.includes('freemium')     && cond.freemium) ||
      (r.need.includes('subscription') && cond.subscription) ||
      (r.need.includes('franchise')    && cond.franchise) ||
      (r.need.includes('data')         && cond.data) ||
      (r.need.includes('ai')           && cond.ai) ||
      (r.need.includes('product')      && cond.product);

    if (isCore) sev = 2;

    // 증거가 부족한 상태에서 수요·자금 리스크는 실제로 위험합니다.
    if (isCore && ev.score < 40 && (r.group === 'demand' || r.group === 'capital')) sev = 3;

    // 규제는 미확인 상태일 때만 높음으로 봅니다.
    if (r.group === 'legal') {
      const licensed = answers.d5_license === 'done';
      sev = licensed ? 1 : (cond.platform || cond.data ? 3 : 2);
    }

    // 증거가 충분히 쌓였으면 수요 리스크는 낮춥니다.
    if (ev.score >= 60 && r.group === 'demand') sev = Math.min(sev, 1);

    out.push({
      ...r,
      group: r.group,
      groupName: RISK_GROUPS[r.group].name,
      severity: sev,
      sevLabel: sev===3?'높음':sev===2?'보통':'낮음',
      sevTone: sev===3?'bad':sev===2?'warn':'ok'
    });
  });

  // 그룹별로 묶고, 그룹 안에서는 심각도 순
  const grouped = Object.keys(RISK_GROUPS)
    .sort((a,b)=>RISK_GROUPS[a].order-RISK_GROUPS[b].order)
    .map(g => ({
      id:g, name:RISK_GROUPS[g].name,
      items: out.filter(r=>r.group===g).sort((a,b)=>b.severity-a.severity)
    }))
    .filter(g => g.items.length > 0);

  return { grouped, total: out.length, high: out.filter(r=>r.severity===3).length };
}
/* ---------- 10. 가치 흐름 매핑 ----------
   axis만으로 매핑하면 '매칭 방식'이 가치 창출로 가는 등 오배치가 생깁니다.
   프레임워크별로 어떤 블록이 창출/전달/수익에 해당하는지 명시합니다. */
const FLOW_MAP = {
  lean:     { create:['solution'],        deliver:['channels'],            revenue:['revenue'] },
  bmc:      { create:['activities','resources'], deliver:['channels','relations'], revenue:['revenue'] },
  vpc:      { create:['products','gainCreators'], deliver:['painRelievers'],  revenue:[] },
  jtbd:     { create:['desiredOutcome'],  deliver:['hiringCriteria'],      revenue:[] },
  platform: { create:['coreInteraction','valueUnit'], deliver:['onboarding','matching'], revenue:['monetization'] },
  pss:      { create:['product','service'], deliver:['lifecycle'],         revenue:['pricing','ownership'] },
  circular: { create:['valueLoop','lifeExtension'], deliver:['takeBack'],  revenue:['revenue'] },
  mission:  { create:['intervention'],    deliver:['partners'],            revenue:['revenue'] },
  bmnav:    { create:['what'],            deliver:['how'],                 revenue:['whyValue'] }
};
function buildFlow(fw, entries, fallback) {
  const m = FLOW_MAP[fw.id] || { create:[], deliver:[], revenue:[] };
  const get = ids => {
    const hits = ids.map(id => (entries||[]).find(e=>e.blockId===id))
                    .filter(e => e && e.text && e.text.trim());
    if (!hits.length) return null;
    return { text: hits.map(h=>h.text.trim()).join(' / '), from:'canvas',
             blocks: hits.map(h=>h.blockName) };
  };
  const wrapFb = v => v ? { text:v, from:'diagnosis', blocks:[] } : null;
  return {
    create:  get(m.create)  || wrapFb(fallback.create),
    deliver: get(m.deliver) || wrapFb(fallback.deliver),
    revenue: get(m.revenue) || wrapFb(fallback.revenue)
  };
}

/* ---------- 11. 가설 우선순위 해석 ----------
   2×2 배치가 무엇을 뜻하는지 사분면별 행동 지침을 함께 냅니다. */
function quadrantOf(h) {
  const hiImp = h.importance >= 4, hiUnc = h.uncertainty >= 4;
  if (hiImp && hiUnc)   return { id:'now',   name:'지금 검증',   tone:'bad',
    guide:'이게 틀리면 지금 그리는 사업 그림 자체가 바뀝니다. 그런데 아직 시장에서 확인된 게 아니라 가정입니다 — 다른 일을 미루더라도 여기부터 고객에게 확인하세요.' };
  if (hiImp && !hiUnc)  return { id:'keep',  name:'근거 유지',   tone:'ok',
    guide:'사업의 핵심 축이면서 이미 어느 정도 시장에서 확인된 부분입니다. 새로 검증할 필요는 없지만, IR·지원사업에서 근거로 쓸 수 있게 관련 데이터·후기를 정리해 두세요.' };
  if (!hiImp && hiUnc)  return { id:'later', name:'나중에',     tone:'warn',
    guide:'아직 불확실하지만 틀려도 사업 방향을 바꿀 정도는 아닙니다. 위쪽 "지금 검증"을 끝낸 뒤 순서대로 확인해도 됩니다.' };
  return { id:'skip', name:'확인 불필요', tone:'gray',
    guide:'중요도와 불확실성이 모두 낮아, 지금 이걸 확인하는 데 돈·시간을 쓰는 것은 낭비입니다. 사업이 커진 뒤 다시 보면 됩니다.' };
}

function calcMetrics(answers, canvasEntries, hyps, fwResult) {
  const ev = resolveEvidence(answers.evidence);
  const filled = (canvasEntries||[]).filter(e => e.text && e.text.trim()).length;
  const totalBlocks = (canvasEntries||[]).length || 1;
  const factCount = (canvasEntries||[]).filter(e => e.label === 'fact' && e.text && e.text.trim()).length;
  const hypCount  = (canvasEntries||[]).filter(e => e.label === 'hypothesis' && e.text && e.text.trim()).length;

  const requiredKeys = ['hasBusiness','startDate','industry','offerings','customerType',
    'productReadiness','revenueStatus','repeatPurchase','evidence','revenues','goal','headcount'];
  const answered = requiredKeys.filter(k => {
    const v = answers[k];
    return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && v !== '');
  }).length;

  const inputPct  = Math.round(answered/requiredKeys.length*100);
  const canvasPct = Math.round(filled/totalBlocks*100);
  const highRisk  = hyps.filter(h => h.importance*h.uncertainty >= 20).length;
  const revCount  = (answers.revenues||[]).filter(r=>r!=='none').length;

  /* 상태 판정 + 대응방안 */
  const S = (v, good, mid) => v>=good ? {t:'양호',tone:'ok'} : v>=mid ? {t:'보통',tone:'warn'} : {t:'주의',tone:'bad'};

  const missing = requiredKeys.length - answered;
  /* 다음에 밟을 단계 = 통과 못 한 가장 앞 단계(nextStage).
     증거는 순서대로 쌓는 게 정석이므로, 뒤 단계를 먼저 확인했더라도
     비어 있는 앞 단계부터 메우도록 안내한다.
     skippedAhead = 앞 단계는 비었는데 그보다 뒤 단계를 이미 통과한 경우. */
  const targetStage = ev.nextStage;
  const allCleared  = !ev.nextStage;
  const skippedAhead = ev.reached >= 0 && targetStage &&
    ev.stages.indexOf(targetStage) < ev.reached;
  const nx = (!allCleared && targetStage) ? EVIDENCE_PLAYBOOK[targetStage.id] : null;

  return [
    { name:'입력 완성도', value:inputPct, unit:'%',
      state:S(inputPct,100,70),
      note: inputPct>=100
        ? '필수 12문항을 모두 답하셔서, 아래 추천·진단이 빠진 정보 없이 계산되었습니다.'
        : `필수 12문항 중 ${missing}개가 비어 있어, 그만큼 추천 근거가 추정으로 대체됩니다.`,
      action: inputPct>=100
        ? '추가 입력은 필요 없습니다. 캔버스 작성률로 넘어가 내용을 채우시면 됩니다.'
        : `상단 진단으로 돌아가 남은 ${missing}개 문항을 채우세요. 특히 업종·고객·수익구조는 추천 결과를 직접 바꾸는 항목입니다.` },

    { name:'캔버스 작성률', value:canvasPct, unit:'%',
      state:S(canvasPct,80,40),
      note: canvasPct>=80
        ? `선택한 캔버스 ${totalBlocks}칸 중 ${filled}칸을 채우셨습니다. 보고서 본문이 실제 내용으로 채워집니다.`
        : `${totalBlocks}칸 중 ${filled}칸만 채워져, 빈 칸 항목은 "진단 답변 기반" 폴백으로 채워집니다.`,
      action: canvasPct>=80
        ? '작성 분량은 충분합니다. 각 칸을 "사실/가설"로 구분 표시하면 근거 있는 항목 지표가 올라갑니다.'
        : '캔버스 화면에서 빈 칸부터 한 문장씩 채우세요. 목표는 전체의 80% 이상 — 특히 고객·가치제안·수익 칸을 우선 채우면 보고서 완성도가 크게 올라갑니다.' },

    { name:'증거 충족도', value:ev.score, unit:'점',
      state:S(ev.score,60,30),
      note: (()=>{
        if (allCleared)
          return `고객 확인 증거 100점 중 ${ev.score}점. 5개 증거 단계가 모두 확인되어, 사업 판단이 가설이 아닌 실제 거래 위에 서 있습니다.`;
        if (skippedAhead)
          return `고객 확인 증거 100점 중 ${ev.score}점. "${ev.stages[ev.reached].name}" 단계는 확인됐지만 그 앞의 "${targetStage.name}" 단계가 비어 있습니다. 뒤 단계가 우연·소수 사례일 수 있어, 앞 단계부터 다시 메워야 근거가 탄탄해집니다.`;
        const reachedName = ev.reached>=0 ? ev.stages[ev.reached].name : null;
        if (reachedName)
          return `고객 확인 증거 100점 중 ${ev.score}점. "${reachedName}" 단계까지 확인되었고, 그다음 "${targetStage.name}" 단계가 아직 비어 있습니다.`;
        return `고객 확인 증거 100점 중 ${ev.score}점(기준선 60점). 아직 확인된 단계가 없어, 사업 판단의 대부분이 검증 안 된 가정입니다.`;
      })(),
      action: nx
        ? `지금 할 일: ${nx.do} — 판정 기준: ${nx.pass} ${nx.next}`
        : '5개 증거 단계(물어봤다→반응→써봤다→돈을 냈다→다시 왔다)를 모두 통과하셨습니다. 이제 같은 방식을 더 많은 고객으로 확장하세요.' },

    { name:'모델 적합도', value: fwResult ? fwResult.score : 0, unit:'점',
      state:S(fwResult?fwResult.score:0,80,60),
      note:`추천 프레임워크가 현재 사업 조건과 얼마나 맞는지를 나타내는 값입니다(성공 확률이 아님). 100점에 가까울수록 이 캔버스로 설계하기에 무리가 없다는 뜻입니다.`,
      action: (fwResult?fwResult.score:0) >= 80
        ? '적합도가 높으므로 이 프레임워크로 바로 설계를 진행하세요. 감점 요인은 6번 근거표에서 확인하실 수 있습니다.'
        : '6번 근거표에서 감점이 큰 축(단계·제공형태·고객구조 등)을 먼저 확인하세요. 그 축의 입력을 조정하거나 2순위 프레임워크와 비교하는 것이 안전합니다.' },

    { name:'검증할 가정 수', value:hyps.length, unit:'건',
      state: hyps.length<=5 ? {t:'양호',tone:'ok'} : hyps.length<=10 ? {t:'보통',tone:'warn'} : {t:'주의',tone:'bad'},
      note: hyps.length===0
        ? '검증이 필요한 미확인 가정이 감지되지 않았습니다. 증거가 충분하거나, 입력이 적어 가정이 추출되지 않은 경우입니다.'
        : `아직 사실로 확인되지 않아 검증이 필요한 가정이 ${hyps.length}건입니다. 이 숫자 자체보다, 그중 무엇을 먼저 볼지가 중요합니다.`,
      action: hyps.length===0
        ? '캔버스 항목을 "가설"로 표시하면 검증 대상이 자동 추출됩니다.'
        : `한 번에 다 검증하지 마세요. 15번 검증 우선순위 상위 3건만 이번 달 대상으로 삼고, "중요도×불확실성"이 높은 것부터 처리하세요.` },

    { name:'먼저 확인할 가정', value:highRisk, unit:'건',
      state: highRisk<=2 ? {t:'양호',tone:'ok'} : highRisk<=4 ? {t:'보통',tone:'warn'} : {t:'주의',tone:'bad'},
      note: highRisk>0
        ? `틀리면 사업 방향 자체가 바뀌는데 아직 확인도 안 된 가정이 ${highRisk}건입니다. 이 항목이 실패의 가장 큰 원인이 됩니다.`
        : '방향을 뒤집을 만한 고위험 미확인 가정은 없습니다. 나머지 가정은 순차 검증해도 됩니다.',
      action: highRisk>0
        ? `이 ${highRisk}건을 30일 안에 각각 고객 5명 이상에게 직접 확인하세요. 검증 전에는 이 가정에 맞춰 큰 비용(재고·개발·채용)을 쓰지 마세요.`
        : '고위험 항목은 없으니, 검증할 가정 수 지표의 순서대로 진행하세요.' },

    { name:'근거 있는 항목', value:factCount, unit:'건',
      state: (factCount===0 && hypCount===0) ? {t:'미작성',tone:'gray'}
             : factCount>=hypCount ? {t:'양호',tone:'ok'} : {t:'보통',tone:'warn'},
      note: (factCount===0 && hypCount===0)
        ? '아직 캔버스를 작성하지 않아 "사실/가설" 분류가 없습니다. 캔버스를 채우고 각 항목을 사실·가설로 표시하면 이 지표가 활성화됩니다.'
        : `캔버스에서 "사실(확인됨)"로 표시한 항목이 ${factCount}건, "가설(미확인)"이 ${hypCount}건입니다. 사실이 많을수록 보고서가 추정이 아닌 근거 위에 섭니다.`,
      action: (factCount===0 && hypCount===0)
        ? '결과 화면에서 "캔버스 작성하기"를 눌러 핵심 칸부터 채우고, 확인된 것은 "사실"로 표시하세요.'
        : factCount>=hypCount
        ? '근거가 가설보다 많아 균형이 좋습니다. 남은 가설 항목만 증거로 전환해 가세요.'
        : `가설 ${hypCount}건 중 위험한 것부터 근거를 붙이세요. 방법은 위 "증거 충족도"의 지금 할 일과 동일 — 고객에게 직접 확인한 결과를 캔버스에 "사실"로 다시 표시하면 됩니다.` },

    { name:'수익원 개수', value:revCount, unit:'개',
      state: revCount===0 ? {t:'주의',tone:'bad'} : revCount<=3 ? {t:'양호',tone:'ok'} : {t:'보통',tone:'warn'},
      note: revCount===0
        ? '돈을 버는 방식(수익구조)을 아직 선택하지 않으셨습니다. 이 상태로는 매출 로드맵을 세울 수 없습니다.'
        : `수익구조를 ${revCount}개 선택하셨습니다. 초기에는 개수보다 "하나가 실제로 작동하는지"가 중요합니다.`,
      action: revCount===0
        ? '진단으로 돌아가 수익구조를 최소 1개 선택하세요. 고객이 실제로 지불하는 방식(구독·건별·수수료 등) 중 가장 가까운 것을 고르면 됩니다.'
        : revCount>3
          ? `${revCount}개는 초기엔 넓습니다. 이번 분기에는 가장 매출이 큰 1개에 집중해 검증하고, 나머지는 이후로 미루세요.`
          : '수익원 범위가 초기 사업에 적절합니다. 이 중 하나를 골라 유료 전환(증거 "돈을 냈다" 단계)을 만드는 데 집중하세요.' }
  ];
}

/* ---------- 프레임워크 전환 매핑 (개념 축 기준) ----------
   같은 axis를 가진 블록끼리 이전합니다.
   1:N 이면 원문을 복사하고 '검토 필요'로 표시합니다. */
function mapCanvasEntries(fromFw, toFw, entries) {
  const byAxis = {};
  entries.forEach(e => {
    if (!e.text || !e.text.trim()) return;
    (byAxis[e.axis] = byAxis[e.axis] || []).push(e);
  });
  const carried = [], review = [], archived = [];
  const usedAxes = new Set();

  const newEntries = toFw.blocks.map(b => {
    const src = byAxis[b.axis];
    if (!src || !src.length) return { blockId:b.id, blockName:b.name, axis:b.axis, text:'', label:'unset', status:'new' };
    usedAxes.add(b.axis);
    const targetCount = toFw.blocks.filter(x => x.axis === b.axis).length;
    const text = src.map(s => s.text.trim()).join('\n');
    const status = (targetCount > 1 || src.length > 1) ? 'review' : 'carried';
    (status === 'review' ? review : carried).push(b.name);
    // 전환 시 사실 라벨은 재확인 필요로 강등
    return { blockId:b.id, blockName:b.name, axis:b.axis, text, label:'recheck', status };
  });

  Object.keys(byAxis).forEach(ax => {
    if (!usedAxes.has(ax)) byAxis[ax].forEach(e => archived.push(e));
  });
  return { newEntries, carried, review, archived };
}

/* 업종군: 예시를 사용자 상황에 맞게 골라 보여줍니다.
   업종(industry)을 먼저 보고, 판단이 안 될 때만 제공형태로 보완합니다.
   (제공형태만 보면 베이커리도 '유형 제품'이라 제조업 예시가 나갑니다) */
function industryGroup(answers){
  const ind = answers.industry;
  const offs = answers.offerings || [];

  // 1) 업종으로 먼저 판정
  const byIndustry = {
    food:'local', retail:'local',
    mfg:'product', const:'product',
    sw:'digital', ai:'digital',
    plat:'platform',
    social:'social',
    edu:'service', bio:'service', env:'product', etc:'service'
  }[ind];

  // 2) 플랫폼 구조는 업종보다 우선합니다 (구조가 완전히 다르므로)
  if (offs.includes('platform') || offs.includes('marketplace')) return 'platform';
  if (answers.customerType === 'multi' || answers.customerType === 'c2c') return 'platform';

  // 3) 사회적 목적 구조도 우선합니다
  if (answers.customerType === 'split' || answers.socialMission) return 'social';

  if (byIndustry) return byIndustry;

  // 4) 업종이 없으면 제공형태로 보완
  if (offs.includes('saas') || offs.includes('ai') || offs.includes('data') || offs.includes('digital')) return 'digital';
  if (offs.includes('product') || offs.includes('pss')) return 'product';
  if (offs.includes('public')) return 'social';
  return 'service';
}

/* 블록에 맞는 안내를 찾아 줍니다.
   ① 프레임워크·블록 전용 예시(BLOCK_GUIDE)를 먼저 찾고,
   ② 없으면 axis 기준(AXIS_GUIDE)으로 폴백합니다.
   같은 axis를 공유하는 서로 다른 블록이 동일 예시를 내보내던 문제를
   블록 전용 예시가 있는 경우에 한해 해소합니다. */
function guideFor(axis, answers, blockId, fwId){
  const base = AXIS_GUIDE[axis] || null;
  const grp = industryGroup(answers);
  const bg = (fwId && blockId && BLOCK_GUIDE[fwId] && BLOCK_GUIDE[fwId][blockId]) || null;

  if (bg) {
    // 블록 전용 예시가 있으면 우선. tip/bad도 블록 전용이 있으면 그것을, 없으면 axis 것을 사용.
    return {
      label: base ? base.label : '',
      tip:  bg.tip ?? (base ? base.tip : ''),
      bad:  bg.bad ?? (base ? base.bad : ''),
      example: bg.ex[grp] || bg.ex.service || (base ? (base.ex[grp] || base.ex.service) : ''),
      group: grp,
      blockSpecific: true
    };
  }
  if (!base) return null;
  return { ...base, example: base.ex[grp] || base.ex.service, group: grp, blockSpecific: false };
}

/* ---------- AI 연결 상태 ----------
   서버리스 프록시가 준비되면 AI_ENDPOINT만 채우면 켜집니다.
   키는 프런트엔드에 두지 않고 서버에 보관합니다. */
const AI_ENDPOINT = '/.netlify/functions/claude'; // Netlify Functions 프록시(키는 서버 환경변수에 은닉)
const AI_STREAM_ENDPOINT = '/api/claude-stream';  // Edge Function 스트리밍 프록시(10초 벽 우회)
const AI_ENABLED  = AI_ENDPOINT.length > 0;

/* 스트리밍 텍스트 호출.
   Edge Function으로 SSE를 받아 델타 텍스트를 onDelta(chunk)로 흘려보내고, 최종 전체 텍스트를 resolve.
   실패(네트워크·비200·스트림없음)하면 예외를 던져 호출부가 비스트리밍으로 폴백하게 한다.
   반환: { text }.  중단용 AbortSignal 지원. */
async function streamClaudeText(body, onDelta, signal) {
  const res = await fetch(AI_STREAM_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
    signal,
  });
  if (!res.ok) {
    let detail = '';
    try { const ej = await res.json(); detail = (ej.error && ej.error.message) || ''; } catch (_) {}
    const err = new Error(detail || ('HTTP ' + res.status));
    err.status = res.status;
    throw err;
  }
  if (!res.body || !res.body.getReader) throw new Error('스트리밍 미지원(응답 본문 없음)');

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  let full = '';
  // SSE 파싱: "event: ...\n" + "data: {...}\n\n" 블록 단위. Anthropic은 content_block_delta에 text_delta를 담아 보낸다.
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const block = buf.slice(0, idx);
      buf = buf.slice(idx + 2);
      // 블록 안의 data: 라인만 취함
      const dataLines = block.split('\n').filter(l => l.startsWith('data:'));
      if (!dataLines.length) continue;
      const dataStr = dataLines.map(l => l.slice(5).trim()).join('');
      if (dataStr === '[DONE]') continue;
      let ev;
      try { ev = JSON.parse(dataStr); } catch (_) { continue; }
      if (ev.type === 'content_block_delta' && ev.delta) {
        const piece = ev.delta.text || ev.delta.partial_json || '';
        if (piece) { full += piece; if (onDelta) onDelta(piece, full); }
      } else if (ev.type === 'error') {
        throw new Error((ev.error && ev.error.message) || '스트림 오류');
      }
    }
  }
  if (!full.trim()) throw new Error('스트림에서 받은 내용이 없습니다');
  return { text: full };
}
