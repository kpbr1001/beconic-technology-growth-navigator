/* ================= Diagnose ================= */
function Diagnose({answers, setAnswers, onDone, onExit}){
  const steps = useMemo(()=>{
    const g = {};
    CORE_QUESTIONS.forEach(q => (g[q.step] = g[q.step] || []).push(q));
    return Object.keys(g).sort().map(k => g[k]);
  },[]);
  const [si, setSi] = useState(0);
  const cur = steps[si];
  const pct = Math.round(((si)/steps.length)*100);
  const topRef = useRef(null);
  useEffect(()=>{ window.scrollTo({top:0,behavior:'smooth'}); },[si]);

  const set = (id,v) => setAnswers(a => ({...a,[id]:v}));
  const toggleMulti = (id,v,max) => setAnswers(a=>{
    const cur = a[id] || [];
    if (v === 'none') return {...a,[id]:['none']};
    let next = cur.filter(x=>x!=='none');
    next = next.includes(v) ? next.filter(x=>x!==v) : [...next, v];
    if (max && next.length > max) next = next.slice(next.length-max);
    return {...a,[id]:next};
  });

  const canNext = cur.every(q=>{
    if (!q.required) return true;
    const v = answers[q.id];
    return Array.isArray(v) ? v.length>0 : (v!==undefined && v!==null && v!=='');
  });

  return html`<div class="wrap" ref=${topRef}>
    <div class="prog no-print">
      <div class="prog-bar"><div class="prog-fill" style=${{width:pct+'%'}}></div></div>
      <div class="prog-meta"><span>${si+1} / ${steps.length} 단계${cur.some(q=>q.type==='textgroup')?' · 선택 입력':''}</span><span>${pct}% 완료</span></div>
    </div>

    ${cur.map(q => html`<div class="card" key=${q.id}>
      <h2 class="h3">${q.title}</h2>
      ${q.help && html`<p class="sub">${q.help}</p>`}

      ${q.type==='single' && html`<div class="opts">
        ${q.options.map(o=>html`<button key=${o.value}
          class=${'opt'+(answers[q.id]===o.value?' on':'')}
          role="radio" aria-checked=${answers[q.id]===o.value}
          onClick=${()=>set(q.id,o.value)}>
          <span class="opt-mark"></span><span>${o.label}</span></button>`)}
      </div>`}

      ${q.type==='multi' && html`<div>
        <div class="opts two">
          ${q.options.map(o=>html`<button key=${o.value}
            class=${'opt'+((answers[q.id]||[]).includes(o.value)?' on':'')}
            role="checkbox" aria-checked=${(answers[q.id]||[]).includes(o.value)}
            onClick=${()=>toggleMulti(q.id,o.value,q.max)}>
            <span class="opt-mark sq"></span><span>${o.label}</span></button>`)}
        </div>
        ${q.allowNone && html`<button
          class=${'opt mt8'+((answers[q.id]||[]).includes('none')?' on':'')}
          onClick=${()=>toggleMulti(q.id,'none')}>
          <span class="opt-mark sq"></span><span>${q.id==='evidence'?'아직 증거가 없습니다':'아직 정하지 않았습니다'}</span></button>`}
      </div>`}

      ${q.type==='year' && html`<div class="opts two">
        ${[2026,2025,2024,2023,2022,2021,2020,2019].map(y=>html`<button key=${y}
          class=${'opt'+(answers[q.id]===y?' on':'')} onClick=${()=>set(q.id,y)}>
          <span class="opt-mark"></span><span>${y>=2026?'2026년 이후 (예정)':(y===2019?'2019년 이전':y+'년')}</span></button>`)}
      </div>`}

      ${q.type==='textgroup' && html`<div class="txtgroup">
        ${q.fields.map(f=>html`<label key=${f.key} class="txtfield">
          <span class="txtlabel">${f.label}</span>
          <input type="text" class="txtinput" placeholder=${f.placeholder||''}
            value=${answers[f.key]||''}
            onInput=${e=>set(f.key, e.target.value)} />
        </label>`)}
        ${q.id==='bizdef' && html`<div class="muted" style=${{fontSize:'12.5px',marginTop:'4px',
          display:'flex',alignItems:'center',gap:'6px'}}>
          <span aria-hidden="true">💡</span>
          <span>막히는 칸은 비워 두고 <b>다음</b>으로 넘어가셔도 진단은 정상 진행됩니다. 예시를 참고해 편하게 적어 보세요.</span>
        </div>`}
      </div>`}
    </div>`)}

    <div class="bbar no-print"><div class="bbar-in">
      <button class="btn btn-g" onClick=${()=> si===0 ? onExit() : setSi(si-1)}>
        이전</button>
      <button class="btn" disabled=${!canNext}
        onClick=${()=> si===steps.length-1 ? onDone() : setSi(si+1)}>
        ${si===steps.length-1?'진단 결과 보기':'다음'}</button>
    </div></div>
  </div>`;
}

/* ================= Deep blocks ================= */
/* 문항 하나를 그립니다.
   이 컴포넌트를 DeepDive 안에 두면 렌더마다 새 타입으로 인식되어
   입력창이 다시 만들어지고 글자가 지워집니다. 반드시 밖에 둡니다. */
function DeepQ({q, answers, set}){
  return html`<div class="card">
    <h3 class="h3">${q.title}</h3>
    ${q.help && html`<p class="sub">${q.help}</p>`}
    ${q.type==='single' && html`<div class="opts">
      ${q.options.map(o=>html`<button key=${o.value} class=${'opt'+(answers[q.id]===o.value?' on':'')}
        onClick=${()=>set(q.id,o.value)}>
        <span class="opt-mark"></span>
        <span style=${{minWidth:0}}>${o.label}
          ${o.note && html`<span class="opt-note">${o.note}</span>`}</span>
      </button>`)}
    </div>`}
    ${q.type==='number' && html`<div style=${{marginTop:'13px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:'9px'}}>
        <input type="text" inputMode="numeric" value=${
            (answers[q.id]==='unknown'||answers[q.id]==null||answers[q.id]==='')
              ? '' : Number(String(answers[q.id]).replace(/,/g,'')).toLocaleString('ko-KR')}
          aria-label=${q.title}
          onInput=${e=>{
            const raw = e.target.value.replace(/[^0-9.]/g,'');
            set(q.id, raw==='' ? '' : raw);
          }}
          style=${{flex:1,padding:'13px 14px',border:'1.5px solid var(--line)',borderRadius:'10px',minHeight:'48px',fontSize:'16px'}} />
        <span class="muted" style=${{flex:'0 0 auto',fontSize:'14px'}}>${q.unit}</span>
      </div>
      <div class="btn-row mt8">
        ${q.allowUnknown && html`<button
          class=${'btn btn-sm '+(answers[q.id]==='unknown'?'':'btn-g')}
          onClick=${()=>set(q.id, answers[q.id]==='unknown' ? '' : 'unknown')}>
          ${answers[q.id]==='unknown' ? '모른다고 표시함' : '이 항목은 모릅니다'}</button>`}
      </div>
      ${answers[q.id]==='unknown' && html`<p class="muted mt8">
        이 값은 계산에서 빼고, 보고서에 "확인되지 않음"으로 표시합니다.</p>`}
    </div>`}
    ${q.type==='text' && html`<input type="text" value=${answers[q.id]??''} placeholder=${q.placeholder||''}
      aria-label=${q.title} onInput=${e=>set(q.id,e.target.value)}
      style=${{width:'100%',marginTop:'13px',padding:'13px 14px',border:'1.5px solid var(--line)',borderRadius:'10px',minHeight:'48px'}} />`}
  </div>`;
}

function DeepDive({block, answers, setAnswers, onBack}){
  const set=(id,v)=>setAnswers(a=>({...a,[id]:v}));

  /* 단위경제성은 사업 형태를 먼저 고른 뒤 그에 맞는 문항만 보여줍니다.
     상품이 하나인 곳과 스무 개인 곳에 같은 질문을 하면 답을 못 하기 때문입니다. */
  const mq = block.modeQuestion;
  const mode = mq ? answers[mq.id] : null;
  const qs = mq ? (mode ? (block.questionsByMode[mode] || []) : []) : block.questions;

  return html`<div class="wrap">
    <div class="card">
      <div class="eyebrow">선택 심화 · ${block.id}</div>
      <h2 class="h2">${block.name}</h2>

    ${mq && mode && mode!=='unknown' && html`<div class="card" style=${{background:'var(--navy-50)',borderColor:'var(--navy-300)'}}>
      <p style=${{fontSize:'13.5px',color:'var(--ink-2)',margin:0}}>

        업계 평균값을 임의로 넣지 않습니다.
      </p>
    </div>`}

    ${mq && mode==='unknown' && html`<div class="card">
      <h3 class="h3">숫자를 아직 모르셔도 괜찮습니다</h3>
      <p class="sub" style=${{marginBottom:'11px'}}>
        예비창업·초기 단계에서는 단가·원가·거래 건수를 확정하기 어렵습니다.
        보고서 14번에서 <b>지금 확인할 수 있는 방법과 순서</b>를 안내해 드립니다.
      </p>

        대략적인 숫자라도 아신다면 위에서 다른 방식을 골라 입력하시면 계산이 나옵니다.
        지금은 이대로 두고 넘어가셔도 됩니다.
      </p>
    </div>`}

    ${qs.map(q=>html`<${DeepQ} key=${q.id} q=${q} answers=${answers} set=${set} />`)}

    ${mq && !mode && html`<div class="card">
      <p class="sub" style=${{margin:0}}>위에서 계산 방식을 먼저 골라 주세요.</p>
    </div>`}

    <div class="bbar no-print"><div class="bbar-in">
      <button class="btn" onClick=${onBack}>저장하고 결과 보기</button>
    </div></div>
  </div>`;
}

  const subtotal = r.parts.reduce((s,p)=> s + (Number(p.contribution)||0), 0);
  const bonusSum = (r.bonuses||[]).reduce((s,b)=> s + (Number(b.points)||0), 0);
  const subRounded = Math.round(subtotal);
  return html`<div class="tblwrap mt12"><table class="stbl">
    <thead><tr><th>평가 항목</th><th>배점</th><th>적합</th><th>점수</th></tr></thead>
    <tbody>
      ${r.parts.map(p=>html`<tr key=${p.dim}>
        <td><b>${p.name}</b><div class="muted" style=${{marginTop:'2px'}}>${p.explain}</div></td>
        <td>${p.weight}점</td>
        <td>${Math.round(p.fit*100)}%</td>
        <td><b>${p.contribution}</b></td>
      </tr>`)}
      <tr style=${{background:'var(--navy-50)'}}>
        <td colspan="3"><b>적합성 소계</b>
          <div class="muted" style=${{marginTop:'2px'}}>위 6개 평가 항목 점수의 합계입니다.</div></td>
        <td><b>${subRounded}점</b></td></tr>
      ${(r.bonuses||[]).map((b,i)=>html`<tr key=${'b'+i}>
        <td colspan="3"><b>${b.points>0?'가산':'조정'}</b>
          <div class="muted" style=${{marginTop:'2px'}}>${b.text}</div></td>
        <td><b>${b.points>0?'+':''}${b.points}</b></td>
      </tr>`)}
      ${r.blocks.map((b,i)=>html`<tr key=${'x'+i}>
        <td colspan="3" style=${{color:'var(--bad)'}}><b>구조 불일치</b>
          <div class="muted" style=${{marginTop:'2px'}}>${b}</div></td>
        <td style=${{color:'var(--bad)'}}>감점</td>
      </tr>`)}
      <tr style=${{borderTop:'2px solid var(--navy)'}}><td colspan="3"><b>합계</b>
        <div class="muted" style=${{marginTop:'2px'}}>적합성 소계 ${subRounded}점${bonusSum!==0?` ${bonusSum>0?'+':'−'} 가점·조정 ${Math.abs(bonusSum)}점`:''} = 최종 ${r.score}점 (0~100 범위로 보정)</div></td>
        <td><b>${r.score}점</b></td></tr>
    </tbody>
  </table></div>`;
}

/* ================= Canvas ================= */
/* 진단 기본정보를 라벨로 변환하는 공용 헬퍼(캔버스 헤더·보고서 공용).
   사용자가 캔버스 칸을 채울 때 "내 업종·고객·제공형태가 무엇이었는지" 상단에서 바로 확인하게 해,
   진단 답변과 캔버스 내용이 어긋나는 오류를 줄인다. */
function coreLabel(qid, val){
  const q = CORE_QUESTIONS.find(x=>x.id===qid);
  if(!q || !q.options) return '';
  return (q.options.find(o=>o.value===val)||{}).label || '';
}
function basicInfoItems(answers){
  const offs = (answers.offerings||[]).map(o=>coreLabel('offerings',o)).filter(Boolean).join(', ');
  const revs = (answers.revenues||[]).filter(r=>r!=='none').map(r=>coreLabel('revenues',r)).filter(Boolean).join(', ');
  return [
    ['업종', coreLabel('industry', answers.industry)],
    ['제공 형태', offs],
    ['고객 구조', coreLabel('customerType', answers.customerType)],
    ['수익 구조', revs || '아직 없음'],
    ['사업 단계', STAGE_LABEL(resolveStage(answers).stage)]
  ].filter(([,v])=>v);
}

function Canvas({fwId, answers, entries, setEntries, onSwitch, onNext, onBack}){
  const fw = FRAMEWORKS.find(f=>f.id===fwId);
  const cur = entries[fwId] || fw.blocks.map(b=>({blockId:b.id,blockName:b.name,axis:b.axis,text:'',label:'unset',status:'new'}));
  useEffect(()=>{ if(!entries[fwId]) setEntries(e=>({...e,[fwId]:cur})); },[fwId]);
  const [openEx, setOpenEx] = useState(null);
  const [switching, setSwitching] = useState(null);
  const [showLegend, setShowLegend] = useState(false);

  /* 추천 순위를 알아야 전환 목록에서 색을 구분할 수 있습니다. */
  const rank = useMemo(()=>{
    const sc = scoreFrameworks(answers, FRAMEWORKS);
    const m = {};
    sc.results.forEach((r,i)=> m[r.framework.id] = {pos:i, score:r.score, fit:r.fit, blocked:r.blocks.length>0});
    return m;
  },[answers]);

  const upd = (i,patch) => setEntries(e=>{
    const arr = [...(e[fwId]||cur)];
    arr[i] = {...arr[i], ...patch};
    return {...e,[fwId]:arr};
  });
  const filled = cur.filter(x=>x.text&&x.text.trim()).length;
  const needReview = cur.filter(x=>x.status==='review').length;
  const unlabeled = cur.filter(x=>x.text&&x.text.trim()&&x.label==='unset').length;
  const pct = Math.round(filled/cur.length*100);

  const doSwitch = (toId) => {
    const toFw = FRAMEWORKS.find(f=>f.id===toId);
    setSwitching({toFw, res: mapCanvasEntries(fw, toFw, cur)});
  };
  const confirmSwitch = () => {
    const {toFw,res} = switching;
    setEntries(e=>({...e,[toFw.id]:res.newEntries, _archive:[...(e._archive||[]),...res.archived]}));
    setSwitching(null);
    onSwitch(toFw.id);
  };

  return html`<div class="wrap">
    <div class="cv-sticky no-print">
      <div class="cv-sticky-in">
        <div style=${{minWidth:0,flex:1}}>
          <div class="cv-title">${fw.nameKo}</div>
          <div class="cv-sub">${filled} / ${cur.length}개 작성 · 예상 ${fw.estMinutes}분</div>
        </div>
        <div class="cv-pct">${pct}%</div>
      </div>
      <div class="cv-bar"><i style=${{width:pct+'%'}}></i></div>
    </div>

    <div class="card mt16">
      <div class="eyebrow">${fw.nameEn} · ${fw.author} (${fw.year})</div>
      <h1 class="h2">${fw.nameKo}</h1>
      <p class="sub">${fw.purpose}</p>

      <div class="cv-role mt12" style=${{display:'flex',gap:'8px',flexWrap:'wrap',alignItems:'center'}}>
        ${(rank[fwId]&&rank[fwId].pos===0)
          ? html`<span class="pill" style=${{background:'var(--navy)',color:'#fff',fontWeight:700}}>주 모델</span>`
          : html`<span class="pill pill-gray" style=${{fontWeight:700}}>보조 모델</span>`}
        <span class="muted" style=${{fontSize:'12px'}}>${(rank[fwId]&&rank[fwId].pos===0)
          ? '보고서의 중심이 되는 캔버스입니다.'
          : '주 모델을 보완하는 관점입니다. 보고서에는 요약으로 반영됩니다.'}</span>
      </div>

      <div class="cv-basic mt12" style=${{background:'var(--warn-bg)',border:'1px solid var(--warn)',borderRadius:'10px',padding:'12px 14px'}}>
        <div style=${{fontSize:'12.5px',fontWeight:'700',color:'var(--warn)',marginBottom:'7px'}}>
          ⚠ 내 진단 기본정보 — 각 칸을 채우실 때 이 내용과 <b>어긋나지 않게</b> 작성하세요</div>
        <div style=${{display:'flex',flexWrap:'wrap',gap:'7px'}}>
          ${basicInfoItems(answers).map(([k,v])=>html`<span key=${k} style=${{
            display:'inline-flex',alignItems:'center',gap:'5px',background:'#fff',
            border:'1px solid var(--line)',borderRadius:'7px',padding:'4px 9px',fontSize:'12px'}}>
            <b style=${{color:'var(--ink-3)',fontWeight:600}}>${k}</b>
            <span style=${{color:'var(--ink)'}}>${v}</span></span>`)}
        </div>
      </div>

      <p class="muted mt12" style=${{fontSize:'12px'}}>
        ✓ 작성 내용은 <b>자동 저장</b>됩니다. 중간에 나가셨다가 다시 오셔도 이어서 작성하실 수 있습니다.
        ${(entries._archive&&entries._archive.length)?' 프레임워크를 바꾸실 때 이전 내용도 보관됩니다.':''}
      </p>

      ${needReview>0 && html`<div class="why mt12" style=${{background:'var(--info-bg)',color:'var(--info)'}}>
        <b>검토 필요 ${needReview}건</b> — 다른 프레임워크에서 옮겨온 내용입니다. 이 캔버스 맥락에 맞게 다듬어 주세요.
      </div>`}

      <div class="mt16">
        <button class="btn btn-g btn-sm" onClick=${()=>setShowLegend(!showLegend)}>
          ${showLegend?'표시 방법 접기':'사실·가설 표시는 무엇인가요?'}</button>
        ${showLegend && html`<div class="disc mt12">
          <b>각 항목에 근거 수준을 표시해 주세요</b>
          <p style=${{margin:'7px 0 11px',fontSize:'12.5px'}}>
            무엇이 확인된 사실이고 무엇이 아직 가정인지 구분해 두면,
            보고서에서 <b>먼저 검증할 항목</b>을 자동으로 뽑아 드립니다. 표시하지 않으셔도 작성은 됩니다.
          </p>
          <div style=${{display:'grid',gap:'9px'}}>
            ${Object.keys(LABELS).map(k=>html`<div key=${k} style=${{display:'flex',gap:'10px',alignItems:'flex-start'}}>
              <span class=${'lbl '+LABELS[k].c} style=${{flex:'0 0 auto'}}>${LABELS[k].t}</span>
              <span style=${{fontSize:'12.5px',lineHeight:'1.6'}}>
                ${LABELS[k].d}<br/><span class="muted">${LABELS[k].when}</span>
              </span>
            </div>`)}
          </div>
        </div>`}
      </div>
      ${unlabeled>0 && html`<p class="muted mt12">
        작성하신 ${unlabeled}개 항목에 아직 표시가 없습니다. 표시해 두시면 검증 우선순위가 정확해집니다.</p>`}
    </div>

    <div class="cgrid">
      ${cur.map((e,i)=>{
        const b = fw.blocks.find(x=>x.id===e.blockId) || {};
        const g = guideFor(e.axis, answers, e.blockId, fw.id);
        const isOpen = openEx===e.blockId;
        return html`<div class="cblock" key=${e.blockId}>
          <div class="cblock-h">
            <span class="cblock-n">${e.blockName}</span>
            ${e.status==='review' && html`<${Pill} tone="info">검토 필요<//>`}
            ${e.status==='carried' && html`<${Pill} tone="gray">이전됨<//>`}
          </div>
          <div class="cblock-hint">${b.hint||''}</div>

          <textarea value=${e.text} placeholder="내용을 입력해 주세요"
            aria-label=${e.blockName}
            onInput=${ev=>upd(i,{text:ev.target.value, status:e.status==='review'?'carried':e.status})}></textarea>

          ${g && html`<div class="mt8">
            <button class="ex-btn" onClick=${()=>setOpenEx(isOpen?null:e.blockId)}>
              ${isOpen?'예시 접기':'작성 예시 보기'}</button>
            ${isOpen && html`<div class="ex-box">
              ${g.blockSpecific===false && html`<div class="muted" style=${{fontSize:'11px',marginBottom:'6px'}}>
                아래는 <b>${b.name}</b> 성격에 맞춘 일반 예시입니다. 이 캔버스(${fw.nameKo})의 이 칸 취지에 맞게 고쳐 쓰세요.</div>`}
              <div class="ex-row">
                <span class="ex-tag ok">이렇게</span><span>${g.example}</span>
              </div>
              <div class="ex-row">
                <span class="ex-tag bad">이렇게는</span><span>${g.bad}</span>
              </div>
              <div class="ex-tip">${g.tip}</div>
              ${e.text.trim()==='' && html`<button class="btn btn-g btn-sm mt8"
                onClick=${()=>{upd(i,{text:g.example, label:'hypothesis'}); setOpenEx(null);}}>
                예시를 넣고 고쳐 쓰기</button>`}
            </div>`}
          </div>`}

          <div class="lbls">
            ${Object.keys(LABELS).map(k=>html`<button key=${k}
              class=${'lbl'+(e.label===k?' '+LABELS[k].c:'')}
              title=${LABELS[k].d+' — '+LABELS[k].when}
              onClick=${()=>upd(i,{label:e.label===k?'unset':k})}>${LABELS[k].t}</button>`)}
          </div>
        </div>`;
      })}
    </div>

    <div class="card mt16">
      <div class="eyebrow">다른 프레임워크로 전환</div>
      <p class="sub">작성한 내용은 개념이 같은 항목으로 자동 이전됩니다. 삭제되지 않습니다.</p>
      <div class="chips mt12">
        ${FRAMEWORKS.filter(f=>f.id!==fwId).map(f=>{
          const r = rank[f.id] || {};
          const cls = r.blocked ? 'chip fw-blocked'
                    : r.pos<=2 ? 'chip fw-rec'
                    : r.pos<=4 ? 'chip fw-mid' : 'chip';
          return html`<button key=${f.id} class=${cls}
            title=${r.blocked ? '현재 사업 구조와 맞지 않습니다'
                  : '적합도 '+(r.fit?r.fit.label:'')+' · '+(r.score||0)+'점'}
            onClick=${()=>doSwitch(f.id)}>
            ${f.nameKo}${r.pos<=2 && !r.blocked ? ' ·추천' : ''}
          </button>`;
        })}
      </div>
      <div class="fw-legend mt12">
        <span><i class="d rec"></i>추천</span>
        <span><i class="d mid"></i>검토 가능</span>
        <span><i class="d blk"></i>구조 불일치</span>
      </div>
    </div>

    <div class="card">
      <div class="eyebrow">이 프레임워크의 한계</div>
      <ul style=${{margin:'6px 0 0',paddingLeft:'18px',fontSize:'14px',color:'var(--ink-2)'}}>
        ${fw.limitations.map((l,i)=>html`<li key=${i}>${l}</li>`)}
      </ul>
      <div class="why mt12"><b>흔한 오해</b><br/>${fw.misuse}</div>
      <p class="muted mt12">출처: ${fw.source}${fw.license?' · '+fw.license:''}</p>
    </div>

    ${switching && html`<div class="ovl" onClick=${()=>setSwitching(null)}>
      <div class="modal" onClick=${e=>e.stopPropagation()}>
        <h2 class="h3">${fw.nameKo} → ${switching.toFw.nameKo} 전환</h2>
        <div style=${{marginTop:'15px',display:'grid',gap:'9px',fontSize:'14px'}}>
          <div><${Pill} tone="ok">자동 이전<//> ${switching.res.carried.length}개 항목</div>
          <div><${Pill} tone="warn">검토 필요<//> ${switching.res.review.length}개 항목
            ${switching.res.review.length>0 && html`<div class="muted" style=${{marginTop:'4px'}}>
              원문이 복사되었습니다. 새 프레임워크의 문맥에 맞게 다듬어 주세요.</div>`}</div>
          <div><${Pill} tone="gray">보관<//> ${switching.res.archived.length}개 항목
            ${switching.res.archived.length>0 && html`<div class="muted" style=${{marginTop:'4px'}}>
              대응 항목이 없어 보관합니다. 이 프레임워크로 되돌아오면 복원됩니다.</div>`}</div>
        </div>
        <div class="disc mt16" style=${{fontSize:'12px'}}>
          전환 시 모든 항목의 사실·가설 표시는 "재확인 필요"로 바뀝니다.
          프레임워크가 달라지면 같은 문장이라도 요구되는 근거 수준이 달라지기 때문입니다.
        </div>
        <div class="btn-row mt16">
          <button class="btn btn-g btn-sm" onClick=${()=>setSwitching(null)}>취소</button>
          <button class="btn btn-sm" onClick=${confirmSwitch}>전환하고 검토하기</button>
        </div>
      </div>
    </div>`}

    <div class="bbar no-print"><div class="bbar-in">
      <button class="btn" onClick=${onNext}>보고서 만들기</button>
    </div></div>
  </div>`;
}

/* ================= Patterns ================= */
function Patterns({answers, onBack}){
  const [f, setF] = useState({stage:'',customer:'',capital:'',recurring:'',platform:'',aiData:'',esg:''});
  const ps = useMemo(()=>scorePatterns(answers, PATTERNS),[answers]);
  const scoreMap = useMemo(()=>{ const m={}; ps.all.forEach(x=>m[x.pattern.patternId]=x); return m; },[ps]);
  const [sel, setSel] = useState(null);

  const list = PATTERNS.filter(p=>{
    if (f.stage && !p.suitableStages.includes(f.stage)) return false;
    if (f.customer && !p.suitableCustomerTypes.includes(f.customer)) return false;
    if (f.capital && p.tags.capital!==f.capital) return false;
    if (f.recurring==='y' && !p.tags.recurring) return false;
    if (f.platform==='y' && !p.tags.platform) return false;
    if (f.aiData==='y' && !p.tags.aiData) return false;
    if (f.esg==='y' && !p.tags.esg) return false;
    return true;
  }).sort((a,b)=>(scoreMap[b.patternId]?.score||0)-(scoreMap[a.patternId]?.score||0));

  const FG = ({label, k, opts}) => html`<div style=${{marginBottom:'11px'}}>
    <div class="muted" style=${{marginBottom:'6px',fontWeight:'650'}}>${label}</div>
    <div class="chips">
      <button class=${'chip'+(f[k]===''?' on':'')} onClick=${()=>setF({...f,[k]:''})}>전체</button>
      ${opts.map(([v,l])=>html`<button key=${v} class=${'chip'+(f[k]===v?' on':'')}
        onClick=${()=>setF({...f,[k]:v})}>${l}</button>`)}
    </div>
  </div>`;

  return html`<div class="wrap">
    <div class="card">
      <div class="eyebrow">BM 패턴 탐색</div>
      <h1 class="h2">26개 수익·거래 패턴</h1>
      <p class="sub">현재 진단 결과 기준으로 적합도가 높은 순서로 정렬됩니다.</p>
    </div>
    <div class="card">
      <${FG} label="사업단계" k="stage" opts=${STAGES.map(s=>[s.id,s.name])} />
      <${FG} label="고객유형" k="customer" opts=${[['b2c','B2C'],['b2b','B2B'],['b2g','B2G'],['b2b2c','B2B2C'],['c2c','C2C'],['multi','다면시장'],['split','지불자 분리']]} />
      <${FG} label="초기자본" k="capital" opts=${[['low','낮음'],['mid','보통'],['high','높음']]} />
      <${FG} label="특성" k="recurring" opts=${[['y','반복매출']]} />
      <${FG} label="구조" k="platform" opts=${[['y','플랫폼형']]} />
      <${FG} label="AI·데이터" k="aiData" opts=${[['y','해당']]} />
      <${FG} label="ESG·순환" k="esg" opts=${[['y','해당']]} />
      <p class="muted mt8">${list.length}개 패턴이 조건에 맞습니다.</p>
    </div>

    <div style=${{display:'grid',gap:'11px',marginTop:'14px'}}>
      ${list.map(p=>{
        const s = scoreMap[p.patternId];
        const caution = s && s.caution.length>0;
        return html`<div class=${'pcard'+(caution?' caution':'')} key=${p.patternId}>
          <div style=${{display:'flex',justifyContent:'space-between',gap:'8px',flexWrap:'wrap'}}>
            <div><h3 class="h3">${p.nameKo}</h3><div class="rec-en">${p.nameEn}</div></div>
            ${caution ? html`<${Pill} tone="warn">주의<//>` : html`<${Pill} tone=${s.score>=70?'ok':'gray'}>${s.score>=70?'적합':'검토 가능'}<//>`}
          </div>
          <p class="sub">${p.summary}</p>
          ${caution && s.caution.map((c,i)=>html`<div key=${i} class="why"
            style=${{background:'var(--warn-bg)',color:'var(--warn)',fontSize:'13px'}}>${c}</div>`)}
          <div class="ptags">
            <span class="ptag">자본 ${({low:'낮음',mid:'보통',high:'높음'})[p.tags.capital]}</span>
            <span class="ptag">난이도 ${({low:'낮음',mid:'보통',high:'높음'})[p.tags.complexity]}</span>
            ${p.tags.recurring && html`<span class="ptag">반복매출</span>`}
            ${p.tags.platform && html`<span class="ptag">플랫폼형</span>`}
            ${p.tags.aiData && html`<span class="ptag">AI·데이터</span>`}
            ${p.tags.esg && html`<span class="ptag">ESG·순환</span>`}
          </div>
          <button class="btn btn-g btn-sm mt12" onClick=${()=>setSel(sel===p.patternId?null:p.patternId)}>
            ${sel===p.patternId?'접기':'자세히 보기'}</button>
          ${sel===p.patternId && html`<div class="mt12" style=${{fontSize:'13.5px',color:'var(--ink-2)'}}>
            <${DL} t="가치 창출" v=${p.valueCreationLogic} />
            <${DL} t="가치 전달" v=${p.valueDeliveryLogic} />
            <${DL} t="수익 논리" v=${p.revenueLogic} />
            <${DL} t="필요 역량" v=${p.requiredCapabilities.join(', ')} />
            <${DL} t="필요 증거" v=${p.requiredEvidence.join(', ')} />
            <${DL} t="핵심 지표" v=${p.keyMetrics.join(', ')} />
            <${DL} t="장점" v=${p.advantages.join(' · ')} />
            <${DL} t="한계" v=${p.limitations.join(' · ')} />
            <${DL} t="주요 위험" v=${p.majorRisks.join(' · ')} />
            <${DL} t="맞지 않는 조건" v=${p.incompatibleConditions.join(' · ')} />
            <p class="muted mt8">출처: ${p.sourceName} (${p.sourceYear}) · ${p.referenceNote}</p>
          </div>`}
        </div>`;
      })}
    </div>
  </div>`;
}
function DL({t,v}){ return html`<div style=${{marginBottom:'7px'}}>
  <b style=${{color:'var(--navy)'}}>${t}</b> · ${v}</div>`; }

/* ================= Library ================= */
function Library({onBack}){
  const [sel,setSel]=useState(null);
  return html`<div class="wrap">
    <div class="card">
      <div class="eyebrow">프레임워크 라이브러리</div>

      <div style=${{display:'flex',justifyContent:'space-between',gap:'9px',flexWrap:'wrap'}}>
        <div><h2 class="h3">${f.nameKo}</h2>
          <div class="rec-en">${f.nameEn} · ${f.author} (${f.year})</div></div>

      </div>

        <${DL} t="함께 쓰면 좋은 도구" v=${f.combineWith.map(c=>FRAMEWORKS.find(x=>x.id===c)?.nameKo).filter(Boolean).join(', ')} />
        <div class="why" style=${{fontSize:'13px'}}><b>흔한 오해</b><br/>${f.misuse}</div>
        <p class="muted mt8">출처: ${f.source}</p>
        <p class="muted">라이선스·상표: ${f.license}</p>
      </div>`}
    </div>`)}

}

/* ================= Compare ================= */
function Compare({answers, onBack}){
  const sc = useMemo(()=>scoreFrameworks(answers, FRAMEWORKS),[answers]);
  const [picked,setPicked]=useState(sc.results.slice(0,3).map(r=>r.framework.id));
  const toggle=id=>setPicked(p=>p.includes(id)?p.filter(x=>x!==id):(p.length>=3?p:[...p,id]));
  const rows=[
    ['적합도', r=>`${r.fit.label} (${r.score}점)`],
    ['목적', r=>r.framework.purpose],
    ['작성 항목 수', r=>r.framework.blocks.length+'개'],
    ['예상 작성시간', r=>r.framework.estMinutes+'분'],
    ['주요 장점', r=>r.framework.advantages[0]],
    ['주요 한계', r=>r.framework.limitations[0]],
    ['필요 증거 수준', r=>{const l=r.framework.evidenceFit; const best=Object.keys(l).sort((a,b)=>l[b]-l[a])[0];
      return ({none:'증거 없어도 가능',weak:'초기 증거 필요',medium:'중간 증거 필요',strong:'충분한 증거 필요'})[best];}],
    ['구조 불일치', r=>r.blocks.length?r.blocks[0]:'없음']
  ];
  const sel=picked.map(id=>sc.results.find(r=>r.framework.id===id)).filter(Boolean);

  return html`<div class="wrap">
    <div class="card">
      <div class="eyebrow">BM 비교</div>
      <h1 class="h2">최대 3개까지 비교</h1>
      <p class="sub">어느 하나가 가장 좋다고 단정하지 않습니다. 지금 상황에서의 적합도 차이를 보여 드립니다.</p>
      <div class="chips mt12">
        ${sc.results.map(r=>html`<button key=${r.framework.id}
          class=${'chip'+(picked.includes(r.framework.id)?' on':'')}
          onClick=${()=>toggle(r.framework.id)}>${r.framework.nameKo}</button>`)}
      </div>
    </div>
    <div class="card">
      <div class="tblwrap"><table class="stbl" style=${{minWidth:(sel.length*180+130)+'px'}}>
        <thead><tr><th>비교 항목</th>
          ${sel.map(r=>html`<th key=${r.framework.id} style=${{textAlign:'left'}}>${r.framework.nameKo}</th>`)}
        </tr></thead>
        <tbody>${rows.map(([label,fn])=>html`<tr key=${label}>
          <td><b>${label}</b></td>
          ${sel.map(r=>html`<td key=${r.framework.id} style=${{textAlign:'left'}}>${fn(r)}</td>`)}
        </tr>`)}</tbody>
      </table></div>
      <p class="muted mt12">화면이 좁으면 표를 좌우로 밀어서 보실 수 있습니다.</p>
    </div>
  </div>`;
}

<script>
/* =========================================================
   BECONIC BM Navigator — 결과보고서 (20섹션) + 루트
   ========================================================= */

/* ---------- SVG 시각화 ---------- */
function BarChart({items, max=100, unit='점'}){
  const ROW = 34, PAD = 10, AXIS = 18;
  const h = items.length*ROW + PAD*2 + AXIS;
  const LBL = 210;          // 이름 영역
  const BAR = 480;          // 막대 영역
  const VW = LBL + BAR + 46;
  const ticks = [0,25,50,75,100];
  const chartTop = PAD;
  const chartBottom = PAD + items.length*ROW;
  return html`<svg viewBox=${`0 0 ${VW} ${h}`} width="100%" style=${{maxWidth:'100%',height:'auto'}}
    role="img" aria-label="적합도 비교 막대그래프">
    <!-- 눈금선 (세로 격자) -->
    ${ticks.map(t=>{
      const x = LBL + (t/100)*BAR;
      return html`<g key=${'t'+t}>
        <line x1=${x} y1=${chartTop} x2=${x} y2=${chartBottom} stroke="#eceff4" stroke-width="1"/>
        <text x=${x} y=${chartBottom+14} font-size="9.5" fill="#9aa1b0" text-anchor="middle">${t}</text>
      </g>`;
    })}
    <!-- 막대 -->
    ${items.map((it,i)=>{
      const y = PAD + i*ROW;
      const barH = 13;
      const w = Math.max(2,(it.value/max)*BAR);
      const col = it.tone==='ok'?'#0f7b5f':it.tone==='warn'?'#c98a1a':it.tone==='bad'?'#c0392b':'#2b3a5c';
      return html`<g key=${i}>
        <text x="0" y=${y+13} font-size="12" font-weight="600" fill="#151a24">${it.label}</text>
        ${it.note && html`<text x="0" y=${y+26} font-size="10" fill="#727a8c">${it.note}</text>`}
        <rect x=${LBL} y=${y+4} width=${w} height=${barH} rx="2.5" fill=${col}/>
        <text x=${LBL+w+8} y=${y+4+barH-2} font-size="11.5" font-weight="700" fill=${col}>${it.value}</text>
      </g>`;
    })}
  </svg>`;
}

/* 증거 단계 진행바 — 기준선 표시로 현재 상태를 바로 확인할 수 있게 합니다. */
function EvidenceStages({ev, stage}){
  // 레드팀 #1: 점수 옆에 단계 맥락을 숫자만큼 강하게 배치
  const ctx = stage ? evidenceContext(stage, ev.score) : null;
  const ctxStyle = {
    normal:   { bg:'#eef6f0', bd:'#bcdcc7', accent:'#1f9d57' },
    progress: { bg:'#eef2fb', bd:'#c6d3ee', accent:'var(--navy)' },
    signal:   { bg:'#fdf4ea', bd:'#f0d9b8', accent:'#c98a1a' }
  }[ctx && ctx.tone] || { bg:'#eef2fb', bd:'#c6d3ee', accent:'var(--navy)' };
  return html`<div>
    <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',
      flexWrap:'wrap',gap:'8px',marginBottom:'13px'}}>
      <div>
        <span style=${{fontSize:'27px',fontWeight:'750',color:'var(--navy)'}}>${ev.score}</span>
        <span class="muted" style=${{fontSize:'14px'}}> / 100점</span>
      </div>
      <${Pill} tone=${ev.score>=60?'ok':ev.score>=30?'warn':'bad'}>${ev.label}<//>
    </div>

    ${ctx && html`<div style=${{background:ctxStyle.bg,border:'1px solid '+ctxStyle.bd,
      borderRadius:'10px',padding:'12px 14px',marginBottom:'15px'}}>
      <div style=${{fontSize:'14.5px',fontWeight:'750',color:ctxStyle.accent,marginBottom:'4px'}}>
        ${ctx.head}</div>
      <div style=${{fontSize:'13px',lineHeight:'1.62',color:'#3d4658'}}>${ctx.body}</div>
    </div>`}

    <div style=${{display:'grid',gap:'11px'}}>
      ${ev.stages.map(s=>html`<div key=${s.id}>
        <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:'8px'}}>
          <span style=${{fontSize:'13.5px',fontWeight:'650'}}>${s.name}</span>
          <span class="muted" style=${{fontSize:'12px'}}>
            ${s.label} · ${s.value}점</span>
        </div>
        <div class="evbar" style=${{position:'relative',height:'11px',background:'#e8ebf2',
          borderRadius:'99px',marginTop:'5px',overflow:'visible'}}>
          <div style=${{position:'absolute',left:0,top:0,bottom:0,width:s.value+'%',
            background: s.cleared?'var(--ok)':s.value>0?'var(--warn)':'transparent',
            borderRadius:'99px',transition:'width .5s'}}></div>
          <div title=${'기준선 '+ev.baseline+'점'}
            style=${{position:'absolute',left:ev.baseline+'%',top:'-3px',bottom:'-3px',
            width:'2px',background:'var(--navy)',opacity:.55}}></div>
        </div>
        <div class="muted" style=${{fontSize:'11.5px',marginTop:'3px'}}>${s.desc}</div>
      </div>`)}
    </div>

    <div style=${{display:'flex',alignItems:'center',gap:'6px',marginTop:'11px'}}>
      <span style=${{display:'inline-block',width:'2px',height:'12px',background:'var(--navy)',opacity:.55}}></span>
      <span class="muted" style=${{fontSize:'11.5px'}}>세로선은 기준선 ${ev.baseline}점입니다. 이 선을 넘으면 해당 단계가 확인된 것으로 봅니다.</span>
    </div>

    ${ev.nextStage && html`<div class="why mt12">
      <b style=${{color:'var(--navy)'}}>다음에 확보하실 증거</b><br/>
      <b>${ev.nextStage.name}</b> — ${ev.nextStage.desc}
    </div>`}
  </div>`;
}

function FlowDiagram({create, deliver, revenue, sources}){
  const src = sources||{};
  const box=(x,title,sub,body,fill,srcLabel)=>html`<g>
    <rect x=${x} y="6" width="206" height="150" rx="11" fill=${fill} stroke="#d5dbe6" stroke-width="1.2"/>
    <text x=${x+103} y="30" font-size="14" font-weight="750" fill="#1b2740" text-anchor="middle">${title}</text>
    <text x=${x+103} y="46" font-size="10.5" fill="#8a92a6" text-anchor="middle">${sub}</text>
    ${wrap(body,26).slice(0,5).map((ln,i)=>html`<text key=${i} x=${x+103} y=${66+i*15} font-size="11"
      fill="#3d4658" text-anchor="middle">${ln}</text>`)}
    ${srcLabel && html`<text x=${x+103} y="148" font-size="9.5" fill="#9aa1b0" text-anchor="middle">${srcLabel}</text>`}
  </g>`;
  return html`<svg viewBox="0 0 720 168" width="100%" style=${{maxWidth:'100%',height:'auto'}}
    role="img" aria-label="가치 창출·전달·수익화 흐름도">
    ${box(0,'가치 창출','무엇을 만드는가',create||'미입력','#eef1f7',src.create)}
    ${box(257,'가치 전달','어떻게 닿는가',deliver||'미입력','#f2f5fa',src.deliver)}
    ${box(514,'수익 확보','어떻게 받는가',revenue||'미입력','#e9eff9',src.revenue)}
    <path d="M208 81 L253 81" stroke="#7d8caa" stroke-width="1.8" marker-end="url(#ar)"/>
    <path d="M465 81 L510 81" stroke="#7d8caa" stroke-width="1.8" marker-end="url(#ar)"/>
    <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7d8caa"/></marker></defs>
  </svg>`;
}
function wrap(s,n){ const w=String(s||'').split(/\s+/); const out=[]; let c='';
  w.forEach(x=>{ if((c+' '+x).trim().length>n){ out.push(c.trim()); c=x; } else c+=' '+x; });
  if(c.trim()) out.push(c.trim()); return out; }

/* 8번 고객–가치 프로세스 컨테이너. 고객 → 문제 → 제공가치를 하나의 흐름으로 시각화.
   각 단계가 채워졌는지(●), 추정 초안인지를 색으로 구분. 밋밋한 표 대신 "이어지는 논리"를 보여줌. */
function CustomerValueFlow({cust, prob, val}){
  const box=(x,title,sub,item,fill)=>{
    const filled = item && item.text;
    const draft = item && item.from==='diagnosis';
    const stroke = !filled ? '#d5dbe6' : draft ? '#c98a1a' : '#1f9d57';
    const body = filled ? item.text : '미확인';
    return html`<g>
      <rect x=${x} y="6" width="206" height="150" rx="11" fill=${fill} stroke=${stroke} stroke-width=${filled?'1.8':'1.2'}/>
      <text x=${x+103} y="30" font-size="14" font-weight="750" fill="#1b2740" text-anchor="middle">${title}</text>
      <text x=${x+103} y="46" font-size="10.5" fill="#8a92a6" text-anchor="middle">${sub}</text>
      ${wrap(body,26).slice(0,5).map((ln,i)=>html`<text key=${i} x=${x+103} y=${66+i*15} font-size="11"
        fill=${filled?'#3d4658':'#aab0bd'} text-anchor="middle">${ln}</text>`)}
      ${filled && html`<text x=${x+103} y="148" font-size="9.5" fill=${draft?'#c98a1a':'#1f9d57'} text-anchor="middle">${draft?'진단 답변 기반':'캔버스 작성'}</text>`}
    </g>`;
  };
  return html`<svg viewBox="0 0 720 168" width="100%" style=${{maxWidth:'100%',height:'auto'}}
    role="img" aria-label="고객–문제–가치 흐름도">
    ${box(0,'고객','누구인가',cust,'#eef1f7')}
    ${box(257,'문제','무엇이 불편한가',prob,'#f2f5fa')}
    ${box(514,'제공 가치','어떻게 해결하는가',val,'#e9eff9')}
    <path d="M208 81 L253 81" stroke="#7d8caa" stroke-width="1.8" marker-end="url(#ar2)"/>
    <path d="M465 81 L510 81" stroke="#7d8caa" stroke-width="1.8" marker-end="url(#ar2)"/>
    <defs><marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7d8caa"/></marker></defs>
  </svg>`;
}

/* 선택한 프레임워크의 블록들을 실제 캔버스처럼 그리드 카드로 시각화합니다.
   각 칸: 블록명 + 내용(작성 시) + 사실/가설 색 띠. 밋밋한 표 대신 한눈에 들어오는 산출물. */
/* 대표 프레임워크의 실제 캔버스 레이아웃. 각 블록 id를 grid area에 배치.
   매핑이 없는 프레임워크는 균등 그리드로 폴백. */
const CANVAS_LAYOUTS = {
  bmc: {
    cols: 'repeat(10, 1fr)', rows: 'auto auto auto',
    areas: [
      '"partners partners activities activities value value relations relations segments segments"',
      '"partners partners resources resources value value channels channels segments segments"',
      '"cost cost cost cost cost revenue revenue revenue revenue revenue"'
    ],
    place: { partners:'partners', activities:'activities', resources:'resources', value:'value',
             relations:'relations', channels:'channels', segments:'segments', cost:'cost', revenue:'revenue' }
  },
  lean: {
    cols: 'repeat(10, 1fr)', rows: 'auto auto auto',
    areas: [
      '"problem problem solution solution uvp uvp advantage advantage segments segments"',
      '"problem problem metrics metrics uvp uvp channels channels segments segments"',
      '"cost cost cost cost cost revenue revenue revenue revenue revenue"'
    ],
    place: { problem:'problem', solution:'solution', metrics:'metrics', uvp:'uvp',
             advantage:'advantage', channels:'channels', segments:'segments', cost:'cost', revenue:'revenue',
             alternatives:null }  // alternatives는 별도 행으로
  },
  platform: {
    cols: 'repeat(10, 1fr)', rows: 'auto auto auto auto',
    areas: [
      '"producers producers matching matching coreInteraction coreInteraction onboarding onboarding consumers consumers"',
      '"producers producers trust trust valueUnit valueUnit liquidity liquidity consumers consumers"',
      '"networkEffect networkEffect networkEffect networkEffect networkEffect monetization monetization monetization monetization monetization"',
      '"cost cost cost cost cost cost cost cost cost cost"'
    ],
    place: { producers:'producers', consumers:'consumers', coreInteraction:'coreInteraction', valueUnit:'valueUnit',
             onboarding:'onboarding', matching:'matching', trust:'trust', liquidity:'liquidity',
             monetization:'monetization', networkEffect:'networkEffect', cost:'cost' }
  }
};

function CanvasVisual({fw, entries}){
  const byId = {};
  (entries||[]).forEach(e=>{ byId[e.blockId] = e; });
  const filled = (entries||[]).filter(e=>e.text&&e.text.trim()).length;
  const total = fw.blocks.length;
  const labelColor = { fact:'#1f9d57', hypothesis:'#c98a1a', unset:'#c2c8d4' };
  const labelText  = { fact:'사실', hypothesis:'가설', unset:'미분류' };
  const layout = CANVAS_LAYOUTS[fw.id];

  // 카드 하나 렌더 (레이아웃/그리드 공용). gridArea 지정 가능.
  const card = (b, gridArea) => {
    const e = byId[b.id];
    const has = e && e.text && e.text.trim();
    const lab = has ? (e.label||'unset') : null;
    return html`<div key=${b.id} style=${{
        gridArea: gridArea||'auto',
        border:'1px solid var(--line)', borderRadius:'8px',
        padding:'9px 10px', background: has?'#fff':'#fafbfd',
        borderTop: has?`3px solid ${labelColor[lab]}`:'3px solid #e5e8ef',
        minHeight:'82px', display:'flex', flexDirection:'column', gap:'3px', overflow:'hidden'}}>
      <div style=${{display:'flex',justifyContent:'space-between',alignItems:'baseline',gap:'5px'}}>
        <span style=${{fontWeight:'700',fontSize:'11.5px',color:'var(--ink)',lineHeight:'1.25'}}>${b.name}</span>
        ${has && html`<span style=${{fontSize:'9px',fontWeight:'700',color:labelColor[lab],flex:'0 0 auto'}}>${labelText[lab]}</span>`}
      </div>
      ${has
        ? html`<div style=${{fontSize:'11px',lineHeight:'1.5',color:'var(--ink-2)',whiteSpace:'pre-wrap'}}>${e.text.length>110?e.text.slice(0,108)+'…':e.text}</div>`
        : html`<div style=${{fontSize:'12px',lineHeight:'1.5',color:'var(--ink-3)',fontStyle:'italic'}}>${b.hint? (b.hint.length>40?b.hint.slice(0,38)+'…':b.hint) : '미작성'}</div>`}
    </div>`;
  };

  const legend = html`<div style=${{display:'flex',gap:'14px',marginTop:'9px',fontSize:'11px',color:'var(--ink-3)',flexWrap:'wrap'}}>
    <span><span style=${{display:'inline-block',width:'9px',height:'9px',background:'#1f9d57',borderRadius:'2px',marginRight:'4px'}}></span>사실</span>
    <span><span style=${{display:'inline-block',width:'9px',height:'9px',background:'#c98a1a',borderRadius:'2px',marginRight:'4px'}}></span>가설</span>
    <span><span style=${{display:'inline-block',width:'9px',height:'9px',background:'#c2c8d4',borderRadius:'2px',marginRight:'4px'}}></span>미분류</span>
    <span style=${{marginLeft:'auto'}}>작성 ${filled} / ${total} 블록</span>
  </div>`;

  if (layout) {
    // 실제 캔버스 레이아웃 (BMC/린/플랫폼). area에 매핑된 블록은 배치, place가 null이거나 없는 블록은 하단 별도 행.
    const placed = fw.blocks.filter(b=>layout.place[b.id]);
    const extra  = fw.blocks.filter(b=>!layout.place[b.id]);
    return html`<div>
      <div class="canvas-grid" style=${{
        display:'grid',
        gridTemplateColumns: layout.cols,
        gridTemplateAreas: layout.areas.join(' '),
        gap:'7px', marginTop:'6px'}}>
        ${placed.map(b=>card(b, layout.place[b.id]))}
      </div>
      ${extra.length>0 && html`<div style=${{display:'grid',gridTemplateColumns:`repeat(${Math.min(extra.length,3)}, 1fr)`,gap:'7px',marginTop:'7px'}}>
        ${extra.map(b=>card(b))}
      </div>`}
      ${legend}
    </div>`;
  }

  // 폴백: 균등 그리드
  return html`<div>
    <div class="canvas-grid" style=${{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(150px, 1fr))',gap:'8px',marginTop:'6px'}}>
      ${fw.blocks.map(b=>card(b))}
    </div>
    ${legend}
  </div>`;
}

function Matrix2x2({hyps}){
  const quads = [
    { id:'now',   name:'지금 검증',    pos:{top:'6px',right:'9px'},   tone:'bad'  },
    { id:'keep',  name:'근거 유지',    pos:{top:'6px',left:'9px'},    tone:'ok'   },
    { id:'later', name:'나중에',       pos:{bottom:'6px',right:'9px'},tone:'warn' },
    { id:'skip',  name:'확인 불필요',  pos:{bottom:'6px',left:'9px'}, tone:'gray' }
  ];
  /* 우선순위 점수 = 중요도 × 불확실성. 이 값이 매트릭스 오른쪽 위(중요·불확실)로 갈수록 커집니다.
     8개 가설을 이 점수 내림차순으로 정렬해 번호를 매기고, 그 번호를
     매트릭스 점과 아래 목록에 똑같이 씁니다(둘의 번호는 동일). */
  const ordered = hyps.slice(0,8)
    .map(h=>({...h, prio:(h.importance||0)*(h.uncertainty||0), q:quadrantOf(h)}))
    .sort((a,b)=> b.prio - a.prio);
  const withQ = ordered.map((h,i)=>({...h, idx:i+1}));
  // 같은 좌표(중요도·불확실성 동일)에 점이 겹치면 하나만 보여 정보가 사라진다.
  // 동일 셀 점들을 작은 원형으로 흩뜨려(jitter) 모두 보이게 한다.
  const cellKey = h => h.importance+'-'+h.uncertainty;
  const groups = {};
  withQ.forEach(h=>{ (groups[cellKey(h)] = groups[cellKey(h)]||[]).push(h); });
  const placed = withQ.map(h=>{
    const g = groups[cellKey(h)];
    const baseL = h.uncertainty/5*80+9;
    const baseB = h.importance/5*80+9;
    const clamp = v => Math.max(7, Math.min(93, v));
    if(g.length<=1) return {...h, L:clamp(baseL), B:clamp(baseB)};
    const k = g.indexOf(h);
    const ang = (k/g.length)*Math.PI*2 - Math.PI/2;
    const rad = g.length<=2 ? 5.5 : 7;
    return {...h, L: clamp(baseL + Math.cos(ang)*rad), B: clamp(baseB + Math.sin(ang)*rad)};
  });
  const byQ = q => withQ.filter(h=>h.q.id===q);
  const toneColor = t => t==='bad'?'var(--bad)':t==='warn'?'var(--warn)':t==='ok'?'var(--ok)':'var(--ink-3)';
  const nowList = byQ('now');

  return html`<div>
    <div class="mtx-block">
      <p class="sub" style=${{marginBottom:'9px'}}>
        가로는 <b>불확실성</b>(오른쪽일수록 아직 확인이 덜 된 것), 세로는 <b>중요도</b>(위쪽일수록 틀렸을 때 사업 타격이 큰 것)입니다.
        두 값을 곱한 <b>검증 우선순위 = 중요도 × 불확실성</b>이 클수록, 즉 <b>오른쪽 위</b>에 가까울수록 먼저 확인해야 합니다.
      </p>
      <p class="muted" style=${{marginBottom:'11px',fontSize:'12px'}}>
        아래 매트릭스의 점 번호와 <b>먼저 검증할 순서</b>의 번호는 <b>같은 가설</b>을 가리킵니다. 번호가 작을수록 우선순위가 높습니다.
      </p>
      <div class="mtx">
        ${quads.map(q=>html`<div key=${q.id} class="mtx-q" style=${q.pos}>${q.name}</div>`)}
        <div class="mtx-ax mtx-ax-x">불확실성 →</div>
        <div class="mtx-ax mtx-ax-y">중요도 →</div>
        ${placed.map(h=>html`<div key=${h.id} class="mtx-dot"
        title=${`${h.idx}. ${h.title} (중요도 ${h.importance}·불확실성 ${h.uncertainty})`}
        style=${{left:h.L+'%', bottom:h.B+'%',
                 background: toneColor(h.q.tone)}}>${h.idx}</div>`)}
      </div>
    </div>

    ${withQ.length>0 && html`<div style=${{marginTop:'14px',padding:'12px 14px',background:'#fff5f5',
        border:'1px solid var(--bad)',borderRadius:'8px'}}>
      <div style=${{fontWeight:'700',color:'var(--bad)',fontSize:'13.5px',marginBottom:'5px'}}>
        ${withQ.length>1 ? '먼저 검증할 순서 — 왜 이 순서인가' : '먼저 검증할 가설'}</div>
      <div class="muted" style=${{fontSize:'12.5px',marginBottom:'9px'}}>
        ${withQ.length>1
          ? html`중요도와 불확실성을 곱한 점수가 높은 순입니다. 위쪽일수록 "틀리면 사업이 흔들리는데 아직 근거가 없는" 가설이라, 30일 안에 이것부터 시장에서 확인해야 합니다.`
          : html`이 가설이 "틀리면 사업이 흔들리는데 아직 근거가 없는" 가장 핵심적인 가정입니다. 30일 안에 시장에서 먼저 확인하십시오.`}
        ${(withQ.length>1 && nowList.length>0) ? html` <b style=${{color:'var(--bad)'}}>특히 상위 ${nowList.length}건은 방향을 바꿀 수 있는 핵심 가설입니다.</b>` : ''}</div>
      <ol style=${{margin:'0',paddingLeft:'20px',fontSize:'13.5px',listStyle:'none'}}>
        ${withQ.slice(0,6).map(h=>html`<li key=${h.id} style=${{marginBottom:'8px'}}>
          <span style=${{display:'inline-flex',alignItems:'center',justifyContent:'center',width:'19px',height:'19px',borderRadius:'50%',background:toneColor(h.q.tone),color:'#fff',fontSize:'11px',fontWeight:'700',marginRight:'6px',verticalAlign:'middle'}}>${h.idx}</span>
          <b>${h.title}</b>
          <span class="muted" style=${{fontSize:'11.5px'}}> — 우선순위 점수 ${h.prio}(중요도 ${h.importance}×불확실성 ${h.uncertainty})</span>
          ${h.method && html`<div class="muted" style=${{fontSize:'12px',marginTop:'2px',paddingLeft:'25px'}}>확인 방법: ${h.method}</div>`}
        </li>`)}
      </ol>
    </div>`}
  </div>`;
}

/* BM 시뮬레이터 — 단위경제성 3개 레버(객단가·건당원가·고객획득비)를 움직여
   건당 공헌이익·손익분기 고객수·CAC 회수 개월을 즉시 재계산. 예측이 아니라
   "가정을 바꾸면 구조가 어떻게 반응하는가"를 사용자가 직접 만져보는 도구.
   16번 로드맵과 연계: 어떤 레버를 먼저 검증할지 판단 근거. */
function BMSimulator({answers, ue}){
  // 초기값: 실제 입력이 있으면 그것을, 없으면 사업형태별 보수적 기본값(임의 수치 아님을 명시).
  const seeded = ue && ue.available && ue.seed;
  const base = seeded || { price: 30000, cost: 12000, cac: 40000, retain: 6 };
  const isSub = (answers.revenues||[]).includes('subscription');
  const [price, setPrice] = useState(base.price);
  const [cost, setCost]   = useState(base.cost);
  const [cac, setCac]     = useState(base.cac);
  const [retain, setRetain] = useState(base.retain); // 구독 유지 개월(구독형에서만 의미)

  const margin = Math.max(0, price - cost);             // 건당(월) 공헌이익
  const ltv = isSub ? margin * retain : margin;         // 구독=공헌이익×유지개월, 그 외=1회
  const netAfterCac = margin - cac;                     // 획득비까지 반영한 실질 손익(1건 기준)
  const payback = margin > 0 ? cac / margin : Infinity;  // CAC 회수: 몇 건(구독=몇 개월)
  const ltvCac = cac > 0 ? ltv / cac : Infinity;         // LTV/CAC 배수
  const fmt = n => n===Infinity ? '∞' : n.toLocaleString('ko-KR');
  const won = n => fmt(n)+'원';

  const verdict = ltvCac===Infinity ? {t:'획득비 0 가정',tone:'gray'}
    : ltvCac>=3 ? {t:'건전 (LTV/CAC ≥ 3)',tone:'ok'}
    : ltvCac>=1 ? {t:'회수는 되나 얇음',tone:'warn'}
    : {t:'구조적 적자 위험',tone:'bad'};

  const Slider = ({label, val, set, min, max, step, unit}) => html`<div style=${{marginBottom:'12px'}}>
    <div style=${{display:'flex',justifyContent:'space-between',fontSize:'13px',marginBottom:'4px'}}>
      <b>${label}</b><span style=${{color:'var(--navy)',fontWeight:700}}>${fmt(val)}${unit}</span></div>
    <input type="range" min=${min} max=${max} step=${step} value=${val}
      onInput=${e=>set(Number(e.target.value))}
      style=${{width:'100%',accentColor:'var(--navy)'}} />
  </div>`;

  return html`<div>
    <p class="sub" style=${{marginBottom:'11px'}}>
      아래 값을 움직이면 <b>건당 이익·손익분기·회수 기간</b>이 즉시 다시 계산됩니다.
      ${seeded?'입력하신 단위경제성 값을 시작점으로 불러왔습니다.':'아직 실측값이 없어 사업 형태에 맞는 보수적 시작값을 넣었습니다 — 실제 값으로 바꿔 보십시오.'}
      이것은 미래 예측이 아니라, <b>가정을 바꾸면 구조가 어떻게 반응하는지</b>를 직접 확인하는 도구입니다.
    </p>
    <div style=${{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0 24px'}} class="sim-grid">
      <div>
        <${Slider} label=${isSub?'월 구독료':'객단가(판매가)'} val=${price} set=${setPrice} min=${0} max=${Math.max(200000, base.price*3)} step=${1000} unit="원" />
        <${Slider} label=${isSub?'1인 월 원가':'건당 원가'} val=${cost} set=${setCost} min=${0} max=${Math.max(150000, base.cost*3)} step=${1000} unit="원" />
        <${Slider} label="고객 획득비(CAC)" val=${cac} set=${setCac} min=${0} max=${Math.max(300000, base.cac*3)} step=${1000} unit="원" />
        ${isSub && html`<${Slider} label="평균 유지 개월" val=${retain} set=${setRetain} min=${1} max=${48} step=${1} unit="개월" />`}
      </div>
      <div style=${{display:'flex',flexDirection:'column',gap:'9px',justifyContent:'center'}} class="sim-cards">
        ${[
          [isSub?'월 공헌이익':'건당 공헌이익', won(margin), '판매가 − 원가'],
          [isSub?'고객 생애가치(LTV)':'획득비 반영 손익', isSub?won(ltv):(netAfterCac>=0?won(netAfterCac):'−'+won(Math.abs(netAfterCac))), isSub?`공헌이익 × 유지 ${retain}개월`:'공헌이익 − 획득비 · 1건'],
          ['CAC 회수 시점', payback===Infinity?'회수 불가':(isSub?`${payback.toFixed(1)}개월`:`${payback.toFixed(1)}건`), '획득비 ÷ 공헌이익'],
          ['LTV / CAC 배수', ltvCac===Infinity?'∞':ltvCac.toFixed(2)+'배', '3배 이상이면 건전']
        ].map(([k,v,sub],i)=>html`<div key=${i} style=${{background:'var(--navy-50)',borderRadius:'9px',padding:'10px 13px'}}>
          <div style=${{fontSize:'12px',color:'var(--ink-3)'}}>${k}</div>
          <div style=${{fontSize:'18px',fontWeight:'800',color:'var(--navy)'}}>${v}</div>
          <div class="muted" style=${{fontSize:'11px'}}>${sub}</div>
        </div>`)}
      </div>
    </div>
    <div style=${{marginTop:'12px',display:'flex',alignItems:'center',gap:'9px',flexWrap:'wrap'}}>
      <${Pill} tone=${verdict.tone}>${verdict.t}<//>
      <span class="muted" style=${{fontSize:'12.5px'}}>
        ${margin<=0 ? '지금 값에서는 팔수록 손해입니다. 원가를 낮추거나 가격을 올리는 레버부터 16번 로드맵에서 검증하십시오.'
          : ltvCac<1 ? '한 고객에게서 회수하는 금액이 획득비보다 작습니다. CAC를 낮출 채널을 먼저 찾으셔야 합니다.'
          : ltvCac<3 ? '회수는 되지만 여유가 얇습니다. 유지율(구독)·재구매·객단가 중 하나를 올리는 실험을 16번에서 우선하십시오.'
          : '구조적으로 건전합니다. 이 가정이 실제로 성립하는지 11번 검증 우선순위대로 시장에서 확인하십시오.'}
      </span>
    </div>
    <p class="muted mt8" style=${{fontSize:'11.5px'}}>
      ※ 이 계산은 입력값에 대한 산술일 뿐, 시장 성과를 보장하지 않습니다. 여기서 얻은 감을 실제 거래로 검증하는 것이 다음 단계입니다.</p>
  </div>`;
}

/* 13번 코호트 포지셔닝 — 같은 업종·단계 집단 안에서 우리 증거수준의 상대 위치.
   실제 표본이 없으므로 '합성 분포'(결정론적 규칙)로 참고선을 만든다.
   원칙: 이 분포는 실측 데이터가 아니라 방법론적 참고선임을 명시하고, 예측·순위 단정 금지.
   합성 방법: 업종·단계별로 중앙값을 규칙으로 정하고, 정규분포 근사 종형을 그려
   사용자 점수의 백분위를 오차함수(erf) 근사로 산출한다. */
function cohortMedian(industry, stageId){
  // 단계가 올라갈수록 그 코호트의 '전형적 증거수준'이 높다는 통념을 반영(임의 정밀 수치 아님, 참고선).
  const stageBase = { idea:18, problem:28, mvp:40, early:52, revenue:64, repeat:72, growth:80, mature:84 };
  const base = stageBase[stageId] ?? 45;
  // 업종은 소폭 보정만(과대 해석 방지). 규제·검증 부담이 큰 업종은 증거 확보가 느린 경향을 약하게 반영.
  const indAdj = { manufacturing:-3, food:-2, bio:-5, it:+2, content:0, service:0, commerce:+1 };
  const m = Math.max(10, Math.min(90, base + (indAdj[industry]||0)));
  return m;
}
function normPercentile(x, mean, sd){
  // erf 근사(Abramowitz & Stegun 7.1.26)로 표준정규 CDF → 백분위(%)
  const z = (x-mean)/sd;
  const t = 1/(1+0.2316419*Math.abs(z));
  const d = 0.3989423*Math.exp(-z*z/2);
  let p = d*t*(0.3193815+t*(-0.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));
  p = z>0 ? 1-p : p;
  return Math.round(p*100);
}
function CohortPositioning({industry, industryLabel, stage, score}){
  const mean = cohortMedian(industry, stage.id);
  const sd = 16; // 코호트 내 분산(참고선 폭)
  const pct = Math.max(1, Math.min(99, normPercentile(score, mean, sd)));
  // 종형 곡선 좌표 생성
  const W=560, H=150, pad=8;
  const xs = [];
  for(let s=0;s<=100;s+=2){ const d=Math.exp(-Math.pow((s-mean)/sd,2)/2); xs.push([s,d]); }
  const maxD = Math.max(...xs.map(p=>p[1]));
  const px = s => pad + (s/100)*(W-2*pad);
  const py = d => H-24 - (d/maxD)*(H-46);
  const path = xs.map((p,i)=>`${i===0?'M':'L'} ${px(p[0]).toFixed(1)} ${py(p[1]).toFixed(1)}`).join(' ');
  const area = `${path} L ${px(100).toFixed(1)} ${(H-24).toFixed(1)} L ${px(0).toFixed(1)} ${(H-24).toFixed(1)} Z`;
  const band = pct>=80?{t:'상위권',tone:'ok'} : pct>=50?{t:'중상위',tone:'ok'} : pct>=25?{t:'중하위',tone:'warn'} : {t:'하위권',tone:'bad'};
  return html`<div>
    <p class="sub" style=${{marginBottom:'10px'}}>
      같은 <b>${industryLabel||'업종'} · ${stage.name}</b> 집단을 가정한 <b>참고 분포</b> 안에서
      귀사의 증거수준(${score}점)이 어디쯤인지 보여줍니다.
    </p>
    <svg viewBox=${`0 0 ${W} ${H}`} width="100%" style=${{maxWidth:'100%',height:'auto'}} role="img" aria-label="코호트 분포 내 위치">
      <path d=${area} fill="#e9eff9" stroke="none"/>
      <path d=${path} fill="none" stroke="#8a9bbd" stroke-width="1.6"/>
      <line x1=${px(mean)} y1=${py(maxD)-4} x2=${px(mean)} y2=${H-24} stroke="#b7c0d4" stroke-width="1.2" stroke-dasharray="4 3"/>
      <text x=${px(mean)} y=${py(maxD)-8} font-size="10.5" fill="#8a92a6" text-anchor="middle">코호트 중앙값 ${mean}</text>
      <line x1=${px(score)} y1="18" x2=${px(score)} y2=${H-24} stroke=${band.tone==='bad'?'#c0392b':band.tone==='warn'?'#c98a1a':'#0b6b5b'} stroke-width="2.2"/>
      <circle cx=${px(score)} cy=${py(Math.exp(-Math.pow((score-mean)/sd,2)/2))} r="5" fill=${band.tone==='bad'?'#c0392b':band.tone==='warn'?'#c98a1a':'#0b6b5b'}/>
      <text x=${px(score)} y="14" font-size="11" font-weight="750" fill="#1b2740" text-anchor="middle">우리 ${score}점</text>
      <line x1=${pad} y1=${H-24} x2=${W-pad} y2=${H-24} stroke="#d5dbe6" stroke-width="1"/>
      ${[0,25,50,75,100].map(t=>html`<text key=${t} x=${px(t)} y=${H-8} font-size="10" fill="#9aa1b0" text-anchor="middle">${t}</text>`)}
    </svg>
    <div style=${{marginTop:'10px',display:'flex',alignItems:'center',gap:'9px',flexWrap:'wrap'}}>
      <${Pill} tone=${band.tone}>추정 백분위 ${pct}% · ${band.t}<//>
      <span class="muted" style=${{fontSize:'12.5px'}}>
        ${pct>=50 ? '같은 조건 집단 대비 증거 확보가 앞선 편입니다. 다음 단계(결제·재구매) 증거로 격차를 벌리십시오.'
          : '같은 조건 집단 대비 증거가 아직 얇습니다. 11번 우선순위 가설부터 확인해 위치를 끌어올리십시오.'}
      </span>
    </div>
    <p class="muted mt8" style=${{fontSize:'11.5px'}}>
      ※ 이 분포는 실제 기업 표본이 아니라 <b>업종·단계 통념으로 만든 방법론적 참고선</b>입니다.
      순위·우열을 단정하는 값이 아니며, 자기 위치를 가늠하는 용도로만 참고하십시오.</p>
  </div>`;
}

/* 내비게이션 바 — 모든 화면 상단에 고정으로 두어, 아래로 스크롤하지 않아도

        aria-label="진단 문항 수정하기" title="업종·매출·증거 같은 기본 답변을 수정합니다">

/* ---------- Report ---------- */
function Report({answers, entries, fwId, onBack}){
  const sc = useMemo(()=>scoreFrameworks(answers, FRAMEWORKS),[answers]);
  const ps = useMemo(()=>scorePatterns(answers, PATTERNS),[answers]);
  // 주 모델 결정: 대표 지시 "주 모델 중심". 사용자가 어떤 순서로 캔버스를 열었든,
  // 보고서의 주 모델은 '작성된 캔버스 중 추천 순위가 가장 높은 것'으로 고정한다.
  // (마지막에 연 캔버스가 주 모델이 되어버리는 혼란 방지.) 작성분이 없으면 추천 1순위.
  const primaryFwId = useMemo(()=>{
    const rankPos = {};
    sc.results.forEach((r,i)=>{ rankPos[r.framework.id]=i; });
    const written = Object.keys(entries||{})
      .filter(k=>k!=='_archive' && Array.isArray(entries[k]) && entries[k].some(e=>e.text&&e.text.trim()));
    if(written.length){
      written.sort((a,b)=>(rankPos[a]??99)-(rankPos[b]??99));
      return written[0];
    }
    return fwId || sc.results[0].framework.id;
  },[entries,sc,fwId]);
  const fw = FRAMEWORKS.find(f=>f.id===primaryFwId);
  const ent = (entries[fw.id]||[]).filter(e=>e.text&&e.text.trim());
  // 보조 모델: 주 모델(fw.id) 외에 실제로 내용이 채워진 다른 프레임워크 캔버스.
  // 주 모델 중심 + 보조는 '보완 관점' 요약으로 반영(대표 지시).
  const secondaryCanvases = useMemo(()=>{
    return Object.keys(entries||{})
      .filter(k=>k!==fw.id && k!=='_archive' && Array.isArray(entries[k]))
      .map(k=>({ fw: FRAMEWORKS.find(f=>f.id===k), ent:(entries[k]||[]).filter(e=>e.text&&e.text.trim()) }))
      .filter(x=>x.fw && x.ent.length>0);
  },[entries,fw]);
  // 상충 감지: 같은 축(customer/value/revenue 등)에서 주·보조의 텍스트가 실질적으로 다르면 코멘트.
  const canvasConflicts = useMemo(()=>{
    if(!ent.length || !secondaryCanvases.length) return [];
    const norm = s => String(s||'').replace(/\s+/g,'').toLowerCase();
    const primByAxis = {};
    ent.forEach(e=>{ if(e.axis && !primByAxis[e.axis]) primByAxis[e.axis]=e; });
    const out=[];
    secondaryCanvases.forEach(sec=>{
      sec.ent.forEach(se=>{
        const pe = primByAxis[se.axis];
        if(pe && norm(pe.text) && norm(se.text) && norm(pe.text)!==norm(se.text)){
          // 한쪽이 다른 쪽을 포함하면(부분 보강) 상충으로 보지 않음
          if(norm(pe.text).includes(norm(se.text)) || norm(se.text).includes(norm(pe.text))) return;
          out.push({ axis:se.axis, primName:pe.blockName, primText:pe.text,
                     secFw:sec.fw.nameKo, secName:se.blockName, secText:se.text });
        }
      });
    });
    // 축당 1건으로 제한(과다 표시 방지)
    const seen=new Set();
    return out.filter(c=>{ if(seen.has(c.axis)) return false; seen.add(c.axis); return true; }).slice(0,4);
  },[ent,secondaryCanvases]);
  const hyps = useMemo(()=>extractHypotheses(answers, entries[fw.id]||[], fw),[answers,entries,fw]);
  const ue = useMemo(()=>calcUnitEconomics(answers),[answers]);
  const road = useMemo(()=>buildRoadmap(hyps, answers),[hyps,answers]);
  const metrics = useMemo(()=>calcMetrics(answers, entries[fw.id]||[], hyps, sc.results[0]),[answers,entries,hyps,sc]);
  const stage = STAGES.find(s=>s.id===sc.stage);
  const [summary,setSummary] = useState(false);
  const [printMsg,setPrintMsg] = useState('');    // 인쇄/저장 안내·완료 메시지
  // PDF 저장·인쇄: window.print()는 모바일 인앱 브라우저(카카오톡 등)에서 막히는 경우가 있어,
  // 시도 후 결과를 사용자에게 안내한다. print 대화상자가 뜨면 afterprint로 완료 메시지.
  const doPrint = useCallback(()=>{
    setPrintMsg('');
    let printed = false;
    const onAfter = ()=>{ printed = true; setPrintMsg('done'); window.removeEventListener('afterprint', onAfter); };
    window.addEventListener('afterprint', onAfter);
    try {
      if (typeof window.print === 'function') {
        window.print();
        // afterprint가 안 오는 환경(일부 모바일)에서는 잠시 후 안내
        setTimeout(()=>{ if(!printed) setPrintMsg('mobile'); window.removeEventListener('afterprint', onAfter); }, 1200);
      } else {
        setPrintMsg('mobile');
      }
    } catch(e) {
      setPrintMsg('mobile');
    }
  },[]);
  const [review,setReview] = useState('');       // 컨설턴트 총평 (편집 가능, PDF 반영)
  const [reviewGen,setReviewGen] = useState(false);
  const [reviewBusy,setReviewBusy] = useState(false); // AI 총평 생성 중
  const [reviewErr,setReviewErr] = useState('');      // AI 총평 실패 시 안내(규칙초안 폴백)
  const [aiInsights,setAiInsights] = useState(null);  // 섹션별 AI 심층 해석 {s5,s8,s9,s11,s12,s16} — 통합 1회 호출로 채움
  const [insightsBusy,setInsightsBusy] = useState(false);
  const [insightsErr,setInsightsErr] = useState('');
  const today = new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

  const lbl = k => LABELS[k]?.t || '미표시';
  const has = { ue: ue.available, deep: DEEP_BLOCKS.some(b=>b.questions.some(q=>answers[q.id]!==undefined&&answers[q.id]!=='')) };

  /* 캔버스 미작성 시, 진단 답변에서 확인된 사실만으로 구조 초안을 구성합니다.
     추정으로 문장을 지어내지 않고, 사용자가 실제로 선택한 항목만 조합합니다. */
  const optLabel = (qid, val) => {
    const q = CORE_QUESTIONS.find(x=>x.id===qid);
    return (q?.options?.find(o=>o.value===val)||{}).label || null;
  };
  // 사업정의(bizdef) 문항을 한 줄 컨텍스트로 조립. 비어 있으면 '' 반환(AI 컨텍스트에서 생략).
  const bizDefLine = () => {
    const g = k => (answers[k]||'').trim();
    const item=g('bd_item'), cap=g('bd_capability'), cust=g('bd_customer'), prob=g('bd_problem'), sol=g('bd_solution');
    if (!(item||cap||cust||prob||sol)) return '';
    const parts = [];
    if (item) parts.push(`아이템: ${item}`);
    if (cap)  parts.push(`핵심역량·기술: ${cap}`);
    if (cust) parts.push(`목표고객: ${cust}`);
    if (prob) parts.push(`해결할 문제: ${prob}`);
    if (sol)  parts.push(`솔루션: ${sol}`);
    return parts.join(' / ');
  };
  const derived = useMemo(()=>{
    const offs = (answers.offerings||[]).map(o=>optLabel('offerings',o)).filter(Boolean);
    const revs = (answers.revenues||[]).filter(r=>r!=='none').map(r=>optLabel('revenues',r)).filter(Boolean);
    const cust = optLabel('customerType', answers.customerType);
    const ind  = optLabel('industry', answers.industry);
    // 진단 답변으로 만든 문제(Problem) 초안: 고객·분야가 있으면 검증 대상 문장을 제시합니다.
    const problem = cust
      ? `${ind?ind+' 분야에서 ':''}${cust}에게 아직 충분히 해결되지 않은 불편이나 필요가 있다는 전제입니다. 구체적인 문제는 캔버스의 문제 항목에서 고객의 언어로 확정하시기 바랍니다.`
      : null;
    // ── PSST 논증형 초안(A): 데이터를 나열하지 않고 "왜/어떻게"가 담긴 사업계획서 문장으로 조립.
    //    bizdef가 있으면 우선 활용, 없으면 진단 답변으로 대체. 각 항목은 근거·방법·경로를 갖추도록 구성.
    const g = k => (answers[k]||'').trim();
    const bdItem=g('bd_item'), bdCap=g('bd_capability'), bdProb=g('bd_problem'), bdSol=g('bd_solution');
    const stageLabel = (STAGES.find(s=>s.id===resolveStage(answers).stage)||{}).name || '현재';
    const evLv = resolveEvidence(answers.evidence).level; // none/weak/medium/strong
    const evPhrase = { strong:'확보한 증거로 실현 가능성을 상당 부분 확인했습니다',
                       medium:'초기 증거로 실현 가능성을 확인하는 중입니다',
                       weak:'소규모 증거를 쌓기 시작한 단계입니다',
                       none:'아직 실제 증거는 확보 전이며, 파일럿으로 검증할 계획입니다' }[evLv] || '';
    // Problem: 대상·상황·결과를 특정하는 틀
    const psstProblem = (bdProb || cust)
      ? `${ind?ind+' 분야의 ':''}${cust||'목표 고객'}은 ${bdProb || '현재 해결되지 않은 불편'}을(를) 겪고 있으며, 이는 시간·비용 손실로 이어집니다. 이 문제의 실재성은 고객 인터뷰로 확정합니다.`
      : null;
    // Solution: 무엇을·어떤 역량으로·실현 근거
    const psstSolution = (bdSol || offs.length)
      ? `${bdSol || (offs.join(', ')+' 형태의 제공물')}을(를) ${bdCap?bdCap+'을(를) 기반으로 ':''}제공합니다. 현재 ${stageLabel}로서 ${evPhrase}.`
      : null;
    // Scale-up: 현재 수익구조 → 확장 경로
    const psstScaleup = revs.length
      ? `${revs.join(', ')} 수익구조를 채널 확대와 반복 거래 확보를 통해 성장시킵니다. ${stageLabel}에서 단위경제성을 검증한 뒤 확장 속도를 높이는 것이 핵심 전략입니다.`
      : null;
    return {
      customer: cust ? `${cust} 대상${ind?' · '+ind+' 분야':''}` : null,
      problem,
      value:    offs.length ? `${offs.join(', ')} 형태로 제공` : null,
      revenue:  revs.length ? revs.join(', ') : null,
      psstProblem, psstSolution, psstScaleup,
      offs, revs, cust, ind
    };
  },[answers]);
  /* 캔버스 값이 있으면 그것을, 없으면 진단 기반 초안을 쓰고 출처를 구분해 표시합니다. */
  const pick = (axis, fallback) => {
    const e = ent.find(x=>x.axis===axis);
    if (e && e.text && e.text.trim()) return { text:e.text, from:'canvas' };
    if (fallback) return { text:fallback, from:'diagnosis' };
    return null;
  };
  const Src = ({from}) => from==='diagnosis'
    ? html`<${Pill} tone="gray">진단 답변 기반<//>`
    : html`<${Pill} tone="ok">캔버스 작성<//>`;

  const S = ({n, title, children, empty, hint}) => {
    if (empty) return html`<div class="rep-sec card" style=${{opacity:.62}}>
      <div class="eyebrow">${n}</div><h2 class="h3" style=${{color:'var(--ink-3)'}}>${title}</h2>
      <p class="sub">${hint}</p></div>`;
    return html`<div class="rep-sec card">
      <div class="eyebrow">${n}</div><h2 class="h3">${title}</h2>
      <div class="mt12">${children}</div></div>`;
  };

  const secs = [];

  // 요약·표지·오늘할일 카드가 공통으로 쓰는 값들을 먼저 계산합니다(TDZ 회피).
  const summaryRisk = buildRisks(answers, ps, fw);
  const allRiskItems = (summaryRisk.grouped||[]).flatMap(g=>g.items);
  const highRisks = allRiskItems.filter(r=>r.severity===3);
  const topRisks = (highRisks.length ? highRisks : allRiskItems.filter(r=>r.severity>=2)).slice(0,3);
  const firstToTest = hyps.filter(h=>quadrantOf(h).id==='now').slice(0,3);
  const laterTest = hyps.filter(h=>quadrantOf(h).id==='later').slice(0,2);
  const primEval = sc.results[0];
  const evScore = sc.evidence.score;

  /* ── 레드팀 개선 #2: 오늘 할 일 딱 한 가지 ──
     20개 섹션을 다 읽고 "부족하구나"만 남지 않도록, 진단 상태에서
     가장 시급한 단일 행동 하나로 수렴시킵니다. 우선순위는
     "사업을 무너뜨릴 수 있는 순서" — 증거 공백 → 핵심 가정 → 고위험 → 단위경제성. */
  const todayAction = (()=>{
    const stg = sc.stage;
    const early = ['idea','problem'].includes(stg);
    const topGap = firstToTest[0];
    const topRisk = topRisks[0];
    if (early && evScore < 20) return {
      verb: '잠재 고객 5명과 이야기해 이 문제가 진짜인지 확인하기',
      why: '지금은 모델을 다듬기보다, 고객이 실제로 이 문제를 겪는지부터 확인할 시점입니다. 이 한 가지가 확인되면 나머지 판단이 모두 단단해집니다.',
      ref: '11번 가설·증거, 16번 실행계획'
    };
    if (topGap) return {
      verb: `"${topGap.title}" 가정을 검증할 작은 실험 하나 설계하기`,
      why: '이 가정이 흔들리면 사업 방향 자체가 바뀝니다. 다른 어떤 작업보다 먼저, 가장 값싸게 확인하실 지점입니다.',
      ref: '11번 가설·증거 매트릭스'
    };
    if (!ue.available) return {
      verb: '실제 거래 한 건 기준으로 "팔 때 남는 돈(건당 이익)" 계산해 보기',
      why: '건당 이익이 양수인지조차 확인되지 않으면, 매출이 늘수록 손실이 커질 수 있습니다. 소규모라도 실측이 먼저입니다.',
      ref: '14번 단위경제성'
    };
    if (topRisk && topRisk.severity === 3) return {
      verb: `가장 큰 리스크 "${topRisk.text}"에 대한 대응책 한 줄 정하기`,
      why: '현재 구조에서 가장 먼저 사업을 무너뜨릴 수 있는 지점입니다. 완벽한 해결이 아니라, 지금 취할 첫 대응 하나면 됩니다.',
      ref: '12번 핵심 리스크'
    };
    return {
      verb: '16번 실행계획의 30일 항목 중 첫 번째를 이번 주에 착수하기',
      why: '진단 결과가 안정적이므로, 이제는 검증된 구조를 실행으로 옮길 시점입니다. 90일 전체가 아니라 첫 30일의 첫 항목부터 시작하십시오.',
      ref: '16번 30·60·90일 실행계획'
    };
  })();

  // 1 표지
  secs.push(html`<div class="rep-cover card" key="s1" style=${{textAlign:'center'}}>
    <div style=${{display:'flex',justifyContent:'center',marginBottom:'13px'}}><${Logo} size=${52} /></div>
    <div class="eyebrow" style=${{textAlign:'center'}}>비즈니스모델 진단 결과보고서</div>
    <h1 class="h1" style=${{marginTop:'7px'}}>${fw.nameKo} 기반<br/>사업구조 진단</h1>
    <p class="sub">${SERVICE.name} · ${SERVICE.sub}</p>
    <div class="mt24" style=${{fontSize:'13.5px',color:'var(--ink-2)'}}>
      <div>진단일 ${today}</div>
      <div>사업단계 ${stage.name} · 증거수준 ${sc.evidence.label}</div>
      ${answers.orgName && html`<div style=${{marginTop:'6px',fontWeight:'600',color:'var(--navy)'}}>${answers.orgName}${answers.orgDept?' · '+answers.orgDept:''}</div>`}
      ${answers.participant && html`<div>작성: ${answers.participant}</div>`}
    </div>
    <div class="mt24 muted">${SERVICE.company} · ${SERVICE.cert}</div>
  </div>`);

  // 레드팀 #2: 오늘 할 일 딱 한 가지 — 리포트 최상단(표지 다음)에 배치
  secs.push(html`<div class="rep-sec card keep" key="s1a" style=${{
      background:'var(--navy)',color:'#fff',border:'none'}}>
    <div style=${{padding:'6px 4px'}}>
      <div style=${{display:'flex',alignItems:'center',gap:'8px',marginBottom:'11px'}}>
        <span style=${{fontSize:'11.5px',letterSpacing:'.1em',fontWeight:'700',
          background:'rgba(255,255,255,.18)',padding:'4px 10px',borderRadius:'6px'}}>오늘 할 일 딱 한 가지</span>
      </div>
      <div style=${{fontSize:'19px',fontWeight:'750',lineHeight:'1.5',marginBottom:'10px'}}>
        ${todayAction.verb}</div>
      <div style=${{fontSize:'13.5px',opacity:.92,lineHeight:'1.7',maxWidth:'620px'}}>
        ${todayAction.why}</div>
      <div style=${{marginTop:'13px',fontSize:'12.5px',opacity:.8,
        borderTop:'1px solid rgba(255,255,255,.22)',paddingTop:'11px'}}>
        이 한 가지부터 시작하십시오. 자세한 근거와 이후 단계는 아래 보고서에 있습니다 (상세: ${todayAction.ref}).</div>
    </div>
  </div>`);

  // 1.5 핵심 요약 — 바쁜 의사결정자가 표지 다음 한 화면에서 결론을 파악하도록 구성합니다.
  // (summaryRisk·topRisks·firstToTest·todayAction 등은 표지 앞에서 이미 계산됨)
  // 컨설턴트 총평 초안 — (구 17b) 핵심요약으로 통합. AI 초안을 생성한 뒤 컨설턴트가 수정해 PDF에 반영.
  const buildReviewDraft = () => {
    const p = sc.results[0];
    const evLow = sc.evidence.score < 40;

      system: sysFor(k),

    const runSection = async (k) => {
      try {
        const { text } = await streamClaudeText(bodyFor(k), (piece, fullSoFar)=>{
          partial[k] = fullSoFar; setAiInsights({ ...partial });
        });
        if (text && text.trim()) { partial[k] = text.trim(); setAiInsights({ ...partial }); return true; }
        throw new Error('빈 응답');

          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(bodyFor(k))

          let detail=''; try { const ej=await res.json(); detail=(ej.error&&ej.error.message)||''; } catch(_){}

            우리의 ${(s8val.text||'').replace(/\s+/g,' ').slice(0,40)}${(s8val.text||'').length>40?'…':''} 이(가) 해결한다."
            이 문장이 어색하다면 고객·문제·가치 중 하나가 어긋나 있는 것이며, 그 지점부터 다시 정의해야 합니다.`],
        ['가장 흔한 함정',

            반대로 <b>고객의 문제에서 출발</b>해 가치를 정의했는지 확인하십시오.`],
        ['개선 방향',
          s8prob.from==='diagnosis'
            ? (['repeat','growth','mature'].includes(sc.stage)
                ? html`문제 칸이 아직 <b>추정 초안</b>(주황)입니다. 이미 사업이 돌아가는 단계이므로, 새로 문제를 발굴하기보다 <b>지금 고객·이탈 고객이 실제로 남긴 불만·해지 사유</b>를 모아 문제 항목을 고객의 언어로 확정하십시오. 그다음 가치 제안이 그 문제와 여전히 맞는지 점검합니다.`
                : html`문제 칸이 아직 <b>추정 초안</b>(주황)입니다. 목표 고객 5~10명 인터뷰로 "이 문제를 실제로 겪는지, 얼마나 아픈지"를 먼저 확인하고, 그 표현으로 캔버스의 문제 항목을 확정하십시오. 그다음 가치 제안을 다시 다듬습니다.`)
            : html`고객·문제·가치가 모두 확정되었습니다. 다음은 이 연결이 <b>맞다는 증거</b>(고객이 실제로 이 가치에 반응·지불하는지)를 11번 가설 우선순위대로 확인하는 것입니다.`]
      ].map(([label,body],i)=>html`<div key=${i} style=${{
          borderLeft:'3px solid var(--navy-300)',background:'var(--navy-50)',borderRadius:'8px',padding:'12px 14px'}}>
        <div style=${{fontWeight:'700',fontSize:'13.5px',color:'var(--navy)',marginBottom:'4px'}}>${label}</div>

    </div>`}

    ${(!s8prob) && html`<div class="why mt16" style=${{background:'var(--warn-bg)',color:'var(--warn)'}}>
      해결하려는 문제가 아직 명시되지 않았습니다(문제 칸 회색). 고객이 겪는 문제가 구체적이지 않으면 가치 제안의 근거를 확인하기 어렵습니다.
      캔버스의 문제 항목을 채우시면 이 부분이 보완됩니다.</div>`}
  <//>`);

  // 9 흐름 구조
  const flow = buildFlow(fw, ent, {
    create: derived.value, deliver: derived.cust ? derived.cust+'에게 전달' : null, revenue: derived.revenue
  });
  const flowGaps = ['create','deliver','revenue'].filter(k=>!flow[k]);
  secs.push(html`<${S} key="s9" n="9. 가치 창출·전달·수익화 구조" title="세 단계가 이어지는지 확인합니다"
    empty=${!flow.create&&!flow.revenue} hint="진단 문항이나 캔버스를 작성하시면 이 섹션이 생성됩니다.">
    ${aiBlock('s9')}
    <p class="sub" style=${{marginBottom:'13px'}}>
      사업은 <b>가치를 만들고 → 고객에게 전달하고 → 그 대가를 받는</b> 세 단계로 이어집니다.

    </p>
    <${FlowDiagram} create=${flow.create?.text} deliver=${flow.deliver?.text} revenue=${flow.revenue?.text}
      sources=${{
        create: flow.create ? (flow.create.from==='canvas'?'출처: '+flow.create.blocks.join(', '):'진단 답변 기반') : '미작성',
        deliver: flow.deliver ? (flow.deliver.from==='canvas'?'출처: '+flow.deliver.blocks.join(', '):'진단 답변 기반') : '미작성',
        revenue: flow.revenue ? (flow.revenue.from==='canvas'?'출처: '+flow.revenue.blocks.join(', '):'진단 답변 기반') : '미작성'
      }} />
    ${flowGaps.length>0 && html`<div class="why mt12" style=${{background:'var(--warn-bg)',color:'var(--warn)'}}>
      <b>분석</b><br/>
      ${flowGaps.length===3
        ? '세 단계가 모두 비어 있습니다. 캔버스를 작성하시면 구조가 이어지는지 확인할 수 있습니다.'
        : `${flowGaps.map(k=>({create:'가치 창출',deliver:'가치 전달',revenue:'수익 확보'})[k]).join('과 ')} 단계가 비어 있습니다. `
          + (flowGaps.includes('revenue')

              : flowGaps.includes('deliver')
                ? '가치를 만들어도 고객에게 닿는 경로가 없으면 전달되지 않습니다. 채널을 먼저 정하셔야 합니다.'
                : '고객에게 전달할 가치의 실체가 정해지지 않았습니다.')}

    ${flowGaps.length===0 && html`<div class="mt12" style=${{display:'flex',flexDirection:'column',gap:'10px'}}>
      ${[
        ['연결 진단','세 단계가 모두 채워졌습니다. 이제 중요한 것은 각 칸의 내용이 아니라 칸과 칸 사이의 연결이 실제로 작동하는지입니다.'],
        ['가장 약한 고리',
          (answers.offerings||[]).some(o=>['platform','marketplace'].includes(o))
            ? '플랫폼·중개 구조에서는 "전달 → 수익" 사이가 가장 약합니다. 양쪽을 모았어도 거래가 플랫폼 밖에서 이뤄지면 수익이 새기 때문입니다. 플랫폼 안에서 거래할 이유(정산·보증·분쟁처리)를 설계했는지 확인하십시오.'
          : (answers.revenues||[]).includes('subscription')
            ? '구독 구조에서는 "전달 → 수익"의 지속성이 관건입니다. 첫 결제는 쉽지만, 매달 가치를 새로 전달하지 못하면 해지로 이어집니다. 갱신 시점마다 고객이 느끼는 가치가 있는지 점검하십시오.'
          : (answers.offerings||[]).some(o=>['service','consulting'].includes(o))
            ? '용역·서비스 구조에서는 "창출 → 전달"이 사람에 의존합니다. 담당자가 바뀌어도 같은 품질이 재현되는지, 즉 전달 과정이 표준화됐는지가 확장의 관건입니다.'
            : '"창출 → 전달" 사이를 먼저 보십시오. 좋은 가치를 만들어도 고객에게 닿는 경로(채널)의 비용이 객단가보다 크면 팔수록 손해입니다.'],
        ['다음 할 일','위 약한 고리를 11번 가설·15번 검증 우선순위에서 최우선으로 확인하십시오. 연결이 한 곳이라도 끊기면 나머지 두 단계가 아무리 좋아도 사업이 성립하지 않습니다.']

  // 10 패턴

  const sigDot = (tone)=>html`<span style=${{display:'inline-block',width:'10px',height:'10px',borderRadius:'50%',background:sig(tone),marginRight:'6px',verticalAlign:'middle'}}></span>`;
  secs.push(html`<${S} key="s10" n="10. 추천 BM 패턴" title="검토 가능한 수익·거래 방식과 구축 방향">
    <div class="disc" style=${{marginBottom:'13px'}}>
      <b>판정 신호등</b>  ${sigDot('ok')} 적합 — 지금 실행 가능 · ${sigDot('warn')} 검토 가능 — 조건부 · ${sigDot('danger')} 주의 — 선행 조건 필요

          <td style=${{textAlign:'left'}}>${x.pattern.revenueLogic||'선택한 수익구조에 맞춰 과금 시점과 단위를 정하십시오.'}</td>
          <td style=${{whiteSpace:'nowrap'}}>${sigDot(tone)}${x.score>=70?'적합':'검토'}</td></tr>`;
        })}
        ${ps.cautions.map(x=>html`<tr key=${x.pattern.patternId}>
          <td><b>${x.pattern.nameKo}</b><div class="muted">${x.pattern.nameEn}</div></td>
          <td style=${{textAlign:'left',color:'var(--warn)'}}>${x.caution[0]}</td>
          <td style=${{textAlign:'left'}}>${x.pattern.revenueLogic||'—'}</td>
          <td style=${{whiteSpace:'nowrap'}}>${sigDot('danger')}주의</td></tr>`)}
      </tbody></table></div>
    <p class="muted mt12">판정은 현재 입력 기준입니다. 증거가 쌓이면 '주의'가 '검토'로, '검토'가 '적합'으로 올라갈 수 있습니다.</p>
  <//>`);

  // 11 가설-증거 (MECE 재설계: "무엇을 먼저 검증할 것인가" 단일 메시지)
  const nowHyps = hyps.filter(h=>quadrantOf(h).id==='now');
  secs.push(html`<${S} key="s11" n="11. 가설·증거 매트릭스" title="지금 무엇부터 검증해야 하는가">
    ${aiBlock('s11')}
    <div class="why" style=${{background:'var(--navy-50)',color:'var(--ink-2)',marginBottom:'14px'}}>
      <b>이 섹션이 답하는 것</b> — 사업에는 아직 확인 안 된 가정(가설)이 여럿 있습니다.
      전부 검증할 수는 없으니, <b>틀렸을 때 타격이 크고(중요도) 지금 가장 안 밝혀진(불확실성)</b> 것부터 확인해야 합니다.

    ${nowHyps.length>0
      ? html`<div style=${{padding:'13px 15px',background:'#fff5f5',border:'1px solid var(--bad)',borderRadius:'9px',marginBottom:'16px'}}>
          <div style=${{fontWeight:'700',color:'var(--bad)',fontSize:'14px',marginBottom:'4px'}}>지금 검증할 가설 ${nowHyps.length}건</div>
          <div class="muted" style=${{fontSize:'13px'}}>이것들이 흔들리면 사업 방향 자체가 바뀝니다. 다른 작업보다 먼저, 30일 안에 시장에서 확인하십시오.</div>
        </div>`
      : html`<div style=${{padding:'13px 15px',background:'var(--navy-50)',border:'1px solid var(--navy-300)',borderRadius:'9px',marginBottom:'16px'}}>
          <div style=${{fontWeight:'700',color:'var(--navy)',fontSize:'14px'}}>당장 급한 핵심 가설은 없습니다</div>
          <div class="muted" style=${{fontSize:'13px'}}>아래 우선순위대로 순차 점검하시면 됩니다.</div>
        </div>`}

    <h3 class="h3 mtx-block">전체 조망 — 중요도 × 불확실성</h3>
    <${Matrix2x2} hyps=${hyps} />
  <//>`);

  // 12 리스크
  const risk = buildRisks(answers, ps, fw);
  secs.push(html`<${S} key="s12" n="12. 핵심 리스크" title="지금 구조에서 생길 수 있는 문제와 대응">
    ${aiBlock('s12')}

      <div class="eyebrow" style=${{color:'var(--navy)'}}>${g.name}</div>
      <div class="tblwrap"><table class="stbl stbl-m">
        <thead><tr><th style=${{width:'12%'}}>심각도</th><th style=${{width:'34%'}}>위험</th><th>대응 방안</th></tr></thead>
        <tbody>${g.items.map((r,i)=>html`<tr key=${i}>
          <td><${Pill} tone=${r.sevTone}>${r.sevLabel}<//></td>
          <td><b>${r.text}</b></td>
          <td style=${{textAlign:'left'}}>${r.act}</td></tr>`)}</tbody>
      </table></div>
    </div>`)}
    <p class="muted mt12">
      위 항목은 선택하신 BM 패턴과 프레임워크의 알려진 한계에서 도출한 것으로,
      실제 발생 여부는 실행 방식에 따라 달라집니다.
    </p>
  <//>`);

  // 레드팀 #3: 진단 결과 연동 맞춤 CTA — 리포트 중간(리스크 직후)에 배치.
  // 끝까지 안 읽는 고객을 포착하고, "왜 지금 상담인가"를 진단 결과와 연결합니다.
  const midCta = (()=>{
    // 고위험 리스크는 단계와 무관하게 가장 먼저 포착합니다.
    if (risk.high >= 1) return {
      head: `높음 리스크 ${risk.high}건, 혼자 풀기 어려우시면 함께 봅니다`,
      body: '핵심 구조에 직결되는 리스크는 대응 순서와 방법이 성패를 가릅니다. 중소벤처기업부 인증 상담회사가 우선순위와 실행안을 같이 잡아 드립니다.'
    };
    // 증거 점수를 절대값이 아니라 "이 단계 대비"로 해석해 CTA를 맞춥니다.
    const tone = evidenceContext(sc.stage, evScore).tone;
    const late = ['repeat','growth','mature'].includes(sc.stage);
    if (tone === 'signal' || late) return {
      head: late
        ? '이미 돌아가는 사업, 다음은 반복·확장의 속도가 관건입니다'
        : `${STAGE_LABEL(sc.stage)} 단계 대비 증거 보강이 필요한 지금, 함께 계획을 세우기 좋은 때입니다`,
      body: late
        ? '진단이 안정적일수록 다음은 실행 속도와 자원 배분이 성패를 가릅니다. 30·60·90일 실행을 성과로 연결하는 과정을 함께합니다.'
        : '무엇을, 무엇부터, 어떻게 확인할지 순서를 잡는 일이 지금 가장 값이 큽니다. 위에서 짚은 핵심 가정과 리스크를 검증 계획으로 옮겨 드립니다.'
    };
    // 초기 단계 + 정상/진행 톤 = "지금이 값싸게 검증할 최적기"
    return {
      head: '증거를 크게 쌓기 전인 지금이, 전문가와 검증 계획을 세우기 가장 좋은 때입니다',
      body: '방향을 크게 바꾸기 전에 값싸게 확인할 수 있는 시점이기 때문입니다. 위에서 짚은 핵심 가정을 무엇부터 어떻게 검증할지 함께 설계해 드립니다.'
    };
  })();
  secs.push(html`<div class="rep-sec card no-print" key="s12b" style=${{
      background:'var(--navy-50)',border:'1px solid var(--navy)'}}>
    <div style=${{display:'flex',gap:'14px',alignItems:'flex-start',flexWrap:'wrap'}}>
      <div style=${{flex:'1 1 340px'}}>
        <div class="eyebrow" style=${{color:'var(--navy)'}}>진단 결과 기반 제안</div>
        <div style=${{fontSize:'16px',fontWeight:'750',color:'var(--navy)',margin:'6px 0 7px',lineHeight:'1.5'}}>

        <div style=${{fontSize:'13.5px',color:'var(--ink-2)',lineHeight:'1.7'}}>${midCta.body}</div>
      </div>
