# BECONIC BM Navigator — Netlify 배포 설정
# 사이트: https://beconic-diagnosis-business-model.netlify.app
# Netlify 사이트 설정에서 Base directory 를 `bm` 으로 지정하면 이 파일이 적용됩니다.
# 화면은 index.html 하나. AI 보조(총평·심층 해석)만 서버를 거칩니다:
#   /api/claude-stream          엣지 함수(스트리밍)   netlify/edge-functions/claude-stream.js
#   /.netlify/functions/claude  일반 함수(폴백·상태)  netlify/functions/claude.mjs
# 둘 다 같은 잠금(lib/guard.mjs): 같은 사이트 출처 + 화면 요청 형식만 중계 + 하루·IP 한도.

# 공개 파일만 dist/ 로 복사해 배포한다(함수 소스·테스트는 공개 URL에 올리지 않음).
[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
