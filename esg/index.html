<style>
/* Layout: 질문은 모바일 우선 단일 컬럼(560px), 결과는 컨설팅 리포트형(760px) 7개 섹션. 상단 고정 바(브랜드 + 화면 단계). */
:root{
  --bg:#f2f4f8; --surface:#ffffff; --surface-2:#f6f7fa; --line:#e1e5ed;
  --ink:#1c2333; --ink-2:#4a5468; --ink-3:#7d869a;
  --primary:#1b2a4a; --on-primary:#ffffff; --primary-soft:#e8edf6; --primary-line:#9fb1d3; --accent:#3a6fd8;
  --good:#2f8f6b; --good-soft:#e5f3ec; --warn:#b97a14; --warn-soft:#fbf0dc; --bad:#c14b4b; --bad-soft:#f8e9e9;
  --font:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1422; --surface:#161f33; --surface-2:#1b2640; --line:#2a3653;
  --ink:#e8ecf4; --ink-2:#b5bdcd; --ink-3:#8791a7;
  --primary:#a9c0f2; --on-primary:#0e1a33; --primary-soft:#22304f; --primary-line:#4c6496; --accent:#7fa6f5;
  --good:#58c49a; --good-soft:#173329; --warn:#e3a846; --warn-soft:#3a2d14; --bad:#e58585; --bad-soft:#3a1d22;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e1422; --surface:#161f33; --surface-2:#1b2640; --line:#2a3653;
  --ink:#e8ecf4; --ink-2:#b5bdcd; --ink-3:#8791a7;
  --primary:#a9c0f2; --on-primary:#0e1a33; --primary-soft:#22304f; --primary-line:#4c6496; --accent:#7fa6f5;
  --good:#58c49a; --good-soft:#173329; --warn:#e3a846; --warn-soft:#3a2d14; --bad:#e58585; --bad-soft:#3a1d22;
  color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-size:15px;letter-spacing:.06em;color:var(--primary)}
.brand span{font-size:12px;color:var(--ink-3)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps button{border:0;background:transparent;padding:6px 2px 4px;font-size:12px;color:var(--ink-3);border-bottom:2px solid var(--line);text-align:center}
.steps button[aria-current="step"]{color:var(--primary);border-color:var(--primary);font-weight:600}

/* page */
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:760px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.tiny{font-size:12.5px;color:var(--ink-3)}
.btn{border:0;border-radius:12px;padding:14px 18px;font-weight:600;font-size:15.5px;background:var(--primary);color:var(--on-primary);width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--primary);border:1px solid var(--primary-line)}
.linkbtn{border:0;background:none;color:var(--ink-2);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}

/* start */
.hero h1{font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.01em}
.hero p{margin:10px 0 0;color:var(--ink-2)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.fact{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 10px;text-align:center}
.fact b{display:block;font-size:20px;color:var(--primary)}
.fact span{font-size:12px;color:var(--ink-3)}
.how{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.how li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.how i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:13px}
.how b{display:block;font-size:14.5px}
.how span{font-size:13px;color:var(--ink-2)}

/* profile */
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.field>.lab{font-weight:600;font-size:14.5px}
.field input{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:12px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 13px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary);font-weight:600}
.yn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.yn .chips{flex-wrap:nowrap}
.yn small{display:block;color:var(--ink-3);font-size:12px;font-weight:400}

/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.dom{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:999px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s ease}
.qtitle{font-size:21px;line-height:1.4;font-weight:700;letter-spacing:-.01em}
.help{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;font-size:13.5px;color:var(--ink-2)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;width:100%;
  border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:15.5px;line-height:1.45;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--primary-line)}
.opt[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);font-weight:600}
.opt.mode{grid-template-columns:1fr auto}
.ladder{display:flex;gap:2px;align-items:flex-end;height:20px}
.ladder s{display:block;width:6px;border-radius:2px;background:var(--line)}
.ladder s:nth-child(1){height:6px}.ladder s:nth-child(2){height:10px}.ladder s:nth-child(3){height:15px}.ladder s:nth-child(4){height:20px}
.ladder s.on{background:var(--primary)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.kwh{display:flex;align-items:center;gap:8px}
.kwh input{flex:1;min-width:0;font-size:22px;font-weight:600;text-align:right}
.kwh span{font-weight:600;color:var(--ink-2)}
.qtag{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.panel{border-left:3px solid var(--primary-line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:10px}
.msg{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;font-size:13.5px;white-space:pre-line}
.guide{margin:0;padding-left:18px;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}

/* report */
.rep-nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.rep-nav button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink-2)}
.rsec{scroll-margin-top:120px;display:flex;flex-direction:column;gap:12px}
.sh{display:flex;align-items:baseline;gap:10px;font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:10px}
.sh span{font-size:13px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.lead{margin:0;color:var(--ink-2);font-size:14px}
.cover{display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:center}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-size:38px;line-height:1;font-weight:700}
.ring .v small{display:block;font-size:11px;color:var(--ink-3);margin-top:2px}
.lvl{display:inline-block;font-weight:700;color:var(--primary);background:var(--primary-soft);padding:4px 10px;border-radius:999px;font-size:13px}
.status{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.lvl-ladder{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;margin-top:14px}
.lvl-ladder div{font-size:10.5px;text-align:center;color:var(--ink-3);padding-top:6px;border-top:4px solid var(--line)}
.lvl-ladder div.on{border-color:var(--primary);color:var(--primary);font-weight:700}
.lvl-ladder div.goal{border-color:var(--good);color:var(--good)}
.summary{font-size:15px;line-height:1.75;margin:0}
.summary b{color:var(--primary)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;min-width:0}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi b.s{font-size:15px;padding:3px 0}
.kpi span{font-size:12px;color:var(--ink-3)}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-good{color:var(--good);background:var(--good-soft)} .p-warn{color:var(--warn);background:var(--warn-soft)} .p-bad{color:var(--bad);background:var(--bad-soft)}
.d-good{background:var(--good)} .d-warn{background:var(--warn)} .d-bad{background:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-2);font-family:var(--font);font-size:12px}
.chart .lbl-b{font-weight:700;fill:var(--ink)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:5px}
.domrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:9px 0;border-top:1px solid var(--line)}
.domrow:first-child{border-top:0;padding-top:0}
.domrow .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;min-width:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.domrow .bar{grid-column:1/-1;height:6px;position:relative;overflow:visible}
.domrow .bar i.good{background:var(--good)} .domrow .bar i.warn{background:var(--warn)} .domrow .bar i.bad{background:var(--bad)}
.domrow .bar em{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink-3)}
.interp{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.icard{display:flex;flex-direction:column;gap:10px}
.icard h3{font-size:15.5px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.icard p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.tag.hot{background:var(--bad-soft);color:var(--bad);font-weight:600}
.qline{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;font-size:12.5px}
.qline .cells{display:flex;gap:2px}
.qline .cells i{width:14px;height:8px;border-radius:2px;background:var(--line)}
.qline .cells i.on{background:var(--primary)}
.qline .lv{width:44px;text-align:right;color:var(--ink-3)}
.heat{display:grid;grid-template-columns:54px repeat(3,1fr);gap:4px;font-size:11.5px}
.heat .ax{display:grid;place-items:center;color:var(--ink-3);text-align:center}
.heat .cell{min-height:58px;border-radius:8px;padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start}
.heat .c1{background:var(--surface-2)} .heat .c2{background:var(--warn-soft)} .heat .c3{background:var(--bad-soft)}
.heat .rk{font-size:11px;font-weight:700;padding:2px 6px;border-radius:5px;background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td .sub{display:block;color:var(--ink-3);font-size:12px;margin-top:2px}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--line)}
.stack i{display:block;height:100%}
.phases{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.phase{display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--primary-line)}
.phase.p1{border-top-color:var(--bad)} .phase.p2{border-top-color:var(--warn)} .phase.p3{border-top-color:var(--accent)} .phase.p4{border-top-color:var(--good)}
.phase h3{font-size:15px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.phase .goal{font-size:12.5px;color:var(--ink-2);margin:0}
.phase ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.phase li{font-size:13.5px;line-height:1.5;padding-top:8px;border-top:1px solid var(--line)}
.phase li:first-child{border-top:0;padding-top:0}
.phase li .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.act{display:grid;grid-template-columns:30px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.act:first-child{border-top:0;padding-top:0}
.act .n{width:30px;height:30px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700}
.act h3{font-size:15px;line-height:1.45}
.act .from{font-size:12.5px;color:var(--ink-3);margin-top:3px}
.flag{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:var(--r-sm);background:var(--warn-soft);color:var(--ink)}
.flag b{color:var(--warn)}
.qw{display:flex;gap:12px;align-items:center;background:var(--good-soft);border-radius:var(--r-sm);padding:12px 14px;font-size:14px}
.qw>b{color:var(--good);font-size:16px;white-space:nowrap}
.deep{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px dashed var(--primary-line);border-radius:var(--r-sm);padding:12px 14px;width:100%;background:transparent;text-align:left}
.deep b{font-size:14.5px}
.deep span{font-size:12.5px;color:var(--ink-3)}
.cta{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.cta p{margin:6px 0 14px;opacity:.85;font-size:14px}
.cta .tel{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cta .tel b{font-size:20px;letter-spacing:.02em;user-select:all}
.cta .tel button{border:1px solid currentColor;background:transparent;color:inherit;border-radius:8px;padding:6px 10px;font-size:13px}
.disc{font-size:12px;color:var(--ink-3);line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;max-width:calc(100% - 32px);z-index:20}
.two.wide-l{grid-template-columns:1.3fr 1fr}
@media (max-width:640px){.two.wide-l{grid-template-columns:1fr}}
.radar text{font-size:13px}
details.ref>summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.ref>summary::-webkit-details-marker{display:none}
details.ref>summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.ref[open]>summary::before{transform:rotate(90deg)}
details.ref.card>summary{font-size:14px;font-weight:600;color:var(--ink-2)}
details.fold>summary{cursor:pointer;font-size:12.5px;color:var(--ink-3);list-style:none;display:inline-flex;align-items:center;gap:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"▸";font-size:10px;transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
@media print{.ref,.top,.rep-nav,.btn,.deep,.linkbtn,.cta .tel button,.toast{display:none!important}body{background:#fff}.card,.phase,tr{break-inside:avoid}details.fold>summary{display:none}}
.brand .logo{display:flex;align-items:center;gap:8px;min-width:0}
.brand img{width:28px;height:28px;border-radius:6px;flex:none}
.brand .t{display:flex;flex-direction:column;line-height:1.2}
.homebtn{border:0;background:none;color:var(--ink-3);font-size:12.5px;padding:4px 0}
footer.site{border-top:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:12px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(24px + env(safe-area-inset-bottom,0px))}
footer.site .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
footer.site a{color:inherit}
footer.site .fb{display:flex;align-items:center;gap:8px;color:var(--ink-2)}
footer.site .fb img{width:22px;height:22px;border-radius:5px}
.print-only{display:none}
.ph{display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--primary);padding-bottom:10px;margin-bottom:6px}
.ph img{width:36px;height:36px}

    if(q.cond && !t[q.cond]) return false;
    if(q.solo && solo()) return false;
    if(q.id==='F2' && S.a.F1 && S.a.F1.v===0) return false;
    return true;
  });
}
function answersForScoring(){
  const t=triggers(S.p), out={};
  Q.forEach(q=>{
    if(q.kind) return;
    if(q.cond && !t[q.cond]) return;
    if(q.solo && solo()){ out[q.id]={v:'na',auto:'1인 기업 · 자동 해당없음'}; return; }
    if(q.id==='F2' && S.a.F1 && S.a.F1.v===0){ out[q.id]={v:0,auto:'F1 응답 기준 추정'}; return; }
    if(S.a[q.id]) out[q.id]=S.a[q.id];
  });
  return out;
}
function k1Data(){
  const k=S.k1;
  if(k.mode==='exact'&&+k.kwh>0) return {q:'실측',kwh:Math.round(+k.kwh),w:1};
  if(k.mode==='bill'&&k.bill>=0){
    const known=k.contract==='gap'||k.contract==='eul';
    const c=known?k.contract:(['50~299인','300인 이상'].includes(S.p.size)?'eul':'gap');
    return {q:'추정',kwh:Math.round(BILLS[k.bill][1]/PRICE[c]),w:.5,contract:c,assumed:!known};
  }
  return {q:'미확보',kwh:null,w:0};
}
/* 점수 코어: 응답 맵 → 영역/종합 점수 (로드맵 전망에도 재사용) */
function core(A){
  const w=W[S.p.industry]||W['기타'], keys=Object.keys(DOMS), dom={}; let tw=0,tv=0;
  keys.forEach((k,i)=>{
    const vals=[];
    Object.entries(A).forEach(([id,a])=>{ if(QI[id].d!==k||a.v==='na')return; vals.push(a.v==='u'?UNKNOWN:PTS[a.v]); });
    dom[k]=vals.length?Math.round(vals.reduce((x,y)=>x+y,0)/vals.length):null;
    if(dom[k]!=null){ tw+=w[i]; tv+=dom[k]*w[i]; }
  });
  const overall=tw?Math.round(tv/tw):0;
  return {dom,overall,level:LEVELS.reduce((acc,l,i)=>overall>=l[0]?i:acc,0),w};
}
function analyze(){
  const A=answersForScoring(), t=triggers(S.p), C=core(A), keys=Object.keys(DOMS);
  let evN=0,evY=0,unk=0,scored=0,shown=0,dCount=0;
  Object.entries(A).forEach(([id,a])=>{
    const q=QI[id]; if(a.v==='na')return; shown++;
    if(a.v==='u'){ unk++; if(q.ev) evN++; return; }
    scored++; if(a.v===3) dCount++;
    if(q.ev){ evN++; if(a.v>=2) evY++; }
  });
  const kd=k1Data(); evN++; evY+=kd.w;
  const evidence=evN?Math.round(evY/evN*100):0;
  const total=flow().filter(q=>!q.kind).length;   // 노출된 전체 문항 기준으로 유효성 판정 (일부만 응답한 리포트 방지)
  const valid=shown>0 && scored>=Math.ceil(Math.max(shown,total)*0.6);
  // 노출도: 업종 가중치 + 노출 신호
  const expo={}, expoTags={};
  keys.forEach((k,i)=>{ expoTags[k]=Object.keys(TRIG_DOM).filter(tk=>t[tk]&&TRIG_DOM[tk].includes(k)); expo[k]=Math.min(100,Math.round(C.w[i]*2.5+15*expoTags[k].length)); });
  // 리스크
  const risks=RISKS.map(r=>{
    if(r.need&&!t[r.need]) return null;
    const qs=r.q.filter(id=>A[id]&&A[id].v!=='na'); if(!qs.length) return null;
    const vals=qs.map(id=>A[id].v==='u'?1:A[id].v); const worst=Math.min(...vals); if(worst>1) return null;
    const wq=qs[vals.indexOf(worst)];
    let L=worst===0?3:2; if(r.trig&&t[r.trig]) L=Math.min(3,L+1);
    const sc=L*r.i; return {...r,L,I:r.i,S:sc,grade:gradeOf(L,sc),wq};
  }).filter(Boolean).sort((a,b)=>b.S-a.S||b.I-a.I);
  // 로드맵: 관리(C) 미만 → Phase1·2, 관리 → 체계(D) → Phase3·4
  const rs={}; risks.forEach(r=>r.q.forEach(id=>rs[id]=Math.max(rs[id]||0,r.S)));
  const base=[],adv=[];
  Object.entries(A).forEach(([id,a])=>{
    if(a.v==='na')return; const q=QI[id], cur=a.v==='u'?-1:a.v, ex=expo[q.d];
    if(cur<2) base.push({q,a,to:2,pr:(rs[id]||0)*10+ex/10+(q.ev?2:0)});
    if(cur<3) adv.push({q,a,to:3,pr:ex+(rs[id]||0)*5});
  });
  base.sort((x,y)=>y.pr-x.pr); adv.sort((x,y)=>y.pr-x.pr);
  // 중소기업 실행 용량 반영: Phase별 최대 과제 수 4/6/6/5, Phase 1·2는 '관리' 도달 과제만, 넘치는 과제는 다음 Phase → 12개월 이후
  const CAPS=[4,6,6,5], P=[[],[],[],[]], later=[]; let pi=0;
  for(const it of [...base,...adv]){
    while(pi<4&&(P[pi].length>=CAPS[pi]||(it.to===3&&pi<2))) pi++;
    (pi<4?P[pi]:later).push(it);
  }
  const phaseOf={}; P.forEach((p,i)=>p.forEach(it=>{ if(phaseOf[it.q.id]==null) phaseOf[it.q.id]=i; }));
  const proj=[C.overall]; let cur={...A};
  P.forEach(p=>{ p.forEach(it=>cur[it.q.id]={v:it.to}); proj.push(core(cur).overall); });
  const projDom=core(cur).dom;
  // 기타 지표
  const b1hi=!!(A.B1&&typeof A.B1.v==='number'&&A.B1.v>=2);
  const flags=[];
  if(b1hi&&kd.q==='미확보') flags.push(['증빙 확인 필요','사용량을 기록하고 있다고 답했는데 숫자는 아직 없어요. 고지서 숫자를 넣으면 결과가 확정돼요.']);
  if(A.F1&&A.F1.v===0&&dCount>=3) flags.push(['자료 확인 필요','잘하고 있다고 답한 항목이 많은데 자료를 모아둔 곳이 없어요. 고객사 실사에서는 자료가 없으면 안 한 것으로 봐요.']);
  const missing=flow().filter(q=>!q.kind&&!S.a[q.id]).length;
  if(missing) flags.unshift(['미응답 '+missing+'문항','응답하지 않은 문항은 빼고 계산했어요. 마저 응답하면 리스크와 로드맵이 더 정확해져요.']);
  if(unk>=3) flags.push(['담당자 확인 권장',`'잘 모르겠어요'가 ${unk}개예요. 실무 담당자와 함께 다시 응답하면 결과가 더 정확해져요.`]);
  const CM=b1hi?{'실측':['기초 데이터 확보','good'],'추정':['일부 확보','warn'],'미확보':['확인 필요','warn']}
               :{'실측':['일부 확보','warn'],'추정':['추정 가능','warn'],'미확보':['준비 필요','bad']};
  const [carbon,carbonTone]=CM[kd.q];
  const tco2=kd.kwh?kd.kwh*12*EF/1000:null;
  const expired=!!(kd.q==='미확보'&&S.k1.dueAt&&Date.now()>S.k1.dueAt);
  if(expired) flags.push(['보완 기한 경과','전기 사용량 보완 기한이 지나 \'미확보\'로 확정했어요. 지금이라도 숫자를 넣으면 다시 계산돼요.']);
  const provisional=kd.q==='미확보'&&['later','delegate'].includes(S.k1.none)&&!expired;
  const deep=keys.filter(k=>C.dom[k]!=null&&C.dom[k]<50);
  return {...C,A,t,evidence,valid,expo,expoTags,risks,P,later,phaseOf,proj,projDom,flags,carbon,carbonTone,tco2,provisional,kd,deep,unk};
}

function gradeOf(L,sc){ return sc>=9||(sc>=6&&L===3)?'높음':sc>=4?'중간':'낮음'; }

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,2200); }
function copyText(t,ok){ try{ navigator.clipboard.writeText(t).then(()=>toast(ok),()=>toast('길게 눌러 복사해 주세요')); }catch(e){ toast('길게 눌러 복사해 주세요'); } }

function loadSaved(){ try{ const o=JSON.parse(localStorage.getItem(LS_KEY)||'null'); return o&&hasData(o.S)?o:null; }catch(e){ return null; } }
function clearSaved(){ try{ localStorage.removeItem(LS_KEY); }catch(e){} }
function render(){
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-current',b.dataset.go===S.screen?'step':'false'));

}

function radarSVG(dom,proj){
  const ks=Object.keys(DOMS), cx=200, cy=168, R=124;
  const pt=(i,v)=>{ const a=(-90+60*i)*Math.PI/180; return [cx+R*v/100*Math.cos(a), cy+R*v/100*Math.sin(a)]; };
  const poly=(vals)=>ks.map((k,i)=>pt(i,vals[k]||0).map(n=>n.toFixed(1)).join(',')).join(' ');
  const rings=[25,50,75,100].map(v=>`<polygon points="${ks.map((k,i)=>pt(i,v).join(',')).join(' ')}" style="fill:none;stroke:var(--line);stroke-width:1"/>`).join('');
  const axes=ks.map((k,i)=>{ const [x,y]=pt(i,100); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" style="stroke:var(--line)"/>`; }).join('');
  const labels=ks.map((k,i)=>{ const [x,y]=pt(i,116); const c=Math.cos((-90+60*i)*Math.PI/180);
    const anc=c>0.3?'start':c<-0.3?'end':'middle'; const dy=y<cy-60?-2:y>cy+60?10:4;
    return `<text x="${x}" y="${y+dy}" text-anchor="${anc}" class="lbl-b">${DSHORT[k]}</text><text x="${x}" y="${y+dy+14}" text-anchor="${anc}">${dom[k]==null?'해당 없음':dom[k]+' → '+proj[k]}</text>`; }).join('');
  return `<svg class="chart radar" viewBox="0 0 400 345" style="max-width:460px;margin:0 auto" role="img" aria-label="6개 영역 현재 점수와 12개월 목표 레이더 차트">
    ${rings}${axes}
    <polygon points="${poly(proj)}" style="fill:var(--good);fill-opacity:.08;stroke:var(--good);stroke-width:2;stroke-dasharray:5 4"/>
    <polygon points="${poly(dom)}" style="fill:var(--primary);fill-opacity:.18;stroke:var(--primary);stroke-width:2.5"/>
    ${ks.filter(k=>dom[k]!=null).map(k=>{ const i=ks.indexOf(k); const [x,y]=pt(i,dom[k]); return `<circle cx="${x}" cy="${y}" r="3.5" style="fill:var(--primary)"/>`; }).join('')}
    <text x="${cx+4}" y="${cy-R*0.5-3}" style="font-size:9px;fill:var(--ink-3)">50</text>
    ${labels}</svg>`;
}
function matrixSVG(dom,expo){
  const x0=48,x1=348,y0=12,y1=252, X=v=>x0+(x1-x0)*v/100, Y=v=>y1-(y1-y0)*v/100, mx=X(50), my=Y(50);
  const ks=Object.keys(DOMS).filter(k=>dom[k]!=null);
  const pts=ks.map(k=>({k,x:X(dom[k]),y:Y(expo[k])}));
  pts.sort((a,b)=>a.y-b.y).forEach((p,i)=>pts.slice(0,i).forEach(q=>{ if(Math.abs(p.x-q.x)<80&&Math.abs(p.y-q.y)<20) p.y=q.y+20; }));
  return `<svg class="chart" viewBox="0 0 360 290" role="img" aria-label="외부 요구 노출과 준비도 매트릭스">
    <rect x="${x0}" y="${y0}" width="${mx-x0}" height="${my-y0}" style="fill:var(--bad-soft)"/>
    <rect x="${mx}" y="${y0}" width="${x1-mx}" height="${my-y0}" style="fill:var(--good-soft)"/>
    <rect x="${x0}" y="${my}" width="${mx-x0}" height="${y1-my}" style="fill:var(--warn-soft)"/>
    <rect x="${mx}" y="${my}" width="${x1-mx}" height="${y1-my}" style="fill:var(--surface-2)"/>
    <text x="${x0+8}" y="${y0+16}" class="lbl-b" style="fill:var(--bad)">즉시 대응</text>
    <text x="${x1-8}" y="${y0+16}" text-anchor="end" class="lbl-b" style="fill:var(--good)">강점 · 대외 활용</text>
    <text x="${x0+8}" y="${y1-8}" class="lbl-b" style="fill:var(--warn)">기본 정비</text>
    <text x="${x1-8}" y="${y1-8}" text-anchor="end" class="lbl-b">현 수준 유지</text>
    <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" style="stroke:var(--ink-3)"/><line x1="${x0}" y1="${y0}" x2="${x0}" y2="${y1}" style="stroke:var(--ink-3)"/>
    <text x="${(x0+x1)/2}" y="${y1+20}" text-anchor="middle">준비도 (영역 점수) →</text>
    <text x="14" y="${(y0+y1)/2}" text-anchor="middle" transform="rotate(-90 14 ${(y0+y1)/2})">외부 요구 노출 →</text>
    <text x="${x0}" y="${y1+12}" text-anchor="middle" style="font-size:9px">0</text><text x="${mx}" y="${y1+12}" text-anchor="middle" style="font-size:9px">50</text><text x="${x1}" y="${y1+12}" text-anchor="middle" style="font-size:9px">100</text>
    ${pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="11" style="fill:var(--primary)"/><text x="${p.x}" y="${p.y+4}" text-anchor="middle" style="fill:var(--on-primary);font-weight:700">${p.k}</text>
      <text x="${p.x+15}" y="${p.y+4}" ${p.x>290?`text-anchor="end" dx="-30"`:''}>${DSHORT[p.k]}</text>`).join('')}
  </svg>`;
}
function projSVG(proj){
  const lab=['현재','1개월','3개월','6개월','12개월'], x0=44,x1=336,y0=12,y1=176, X=i=>x0+(x1-x0)*i/4, Y=v=>y1-(y1-y0)*v/100;
  const bands=LEVELS.slice(1).map(l=>`<line x1="${x0}" y1="${Y(l[0])}" x2="${x1}" y2="${Y(l[0])}" style="stroke:var(--line);stroke-dasharray:3 3"/><text x="${x0-6}" y="${Y(l[0])+4}" text-anchor="end" style="font-size:9.5px">${l[1]}</text>`).join('');
  const line=proj.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 352 206" role="img" aria-label="로드맵 실행 시 점수 전망">
    ${bands}
    <polygon points="${X(0)},${y1} ${line} ${X(4)},${y1}" style="fill:var(--accent);fill-opacity:.1"/>
    <polyline points="${line}" style="fill:none;stroke:var(--accent);stroke-width:2.5"/>
    ${proj.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="${i===4?5:3.5}" style="fill:${i===0?'var(--primary)':'var(--accent)'}"/><text x="${X(i)}" y="${Y(v)-10}" text-anchor="middle" class="lbl-b">${v}</text><text x="${X(i)}" y="${y1+18}" text-anchor="middle">${lab[i]}</text>`).join('')}
    <line x1="${x0}" y1="${y1}" x2="${x1}" y2="${y1}" style="stroke:var(--ink-3)"/>
  </svg>`;
}

function rResult(){
  if(!Object.keys(S.a).length){ app.innerHTML=`<section class="card"><h2 style="font-size:19px">아직 진단 응답이 없어요</h2><p class="muted">기업정보와 질문에 응답하면 리포트를 만들어 드려요. 예시 리포트는 시작 화면에서 볼 수 있어요.</p><button class="btn" id="toStart">진단 시작하기</button></section>`; document.getElementById('toStart').onclick=()=>go('profile'); return; }

  const spread=R.dom[sorted[sorted.length-1]]-R.dom[sorted[0]];
  const weak=sorted.slice(0,2), strong=sorted[sorted.length-1];
  const hiRisk=R.risks.filter(r=>r.grade==='높음');

  const due=new Date(S.k1.dueAt||Date.now()+DUE_DAYS*864e5), dueTxt=`${due.getMonth()+1}월 ${due.getDate()}일`;

  const evTxt=R.evidence>=60?'활동을 자료로 증명할 수 있는 수준이에요':R.evidence>=35?'일부 활동만 자료로 증명할 수 있어요':'실제로 하고 있어도 자료로 증명하기 어려운 상태예요';

  /* 01 요약 */
  const summary=`<b>${esc(name)}</b>의 ESG 실행 준비도는 <b>${R.overall}점(Level ${R.level+1} · ${LEVELS[R.level][1]})</b>이에요.
    ${spread<10?`${ksv.length}개 영역 점수가 고르게 분포해 있어요(최고·최저 차이 ${spread}점).`:`${ksv.length}개 영역 중 가장 앞선 곳은 <b>${DOMS[strong]}</b>(${R.dom[strong]}점), 가장 취약한 곳은 <b>${DOMS[weak[0]]}</b>(${R.dom[weak[0]]}점)${weak[1]&&R.dom[weak[1]]<R.dom[strong]-9?`·<b>${DOMS[weak[1]]}</b>(${R.dom[weak[1]]}점)`:''}이에요.`}
    ${expoOn.length?`${expoOn.join('·')} 신호가 있어 외부 요구에 노출된 상태이고, `:''}${hiRisk.length?`특히 <b>'${hiRisk[0].n}'</b> 리스크를 가장 먼저 관리해야 해요(높음 ${hiRisk.length}건 · 전체 ${R.risks.length}건).`:R.risks.length?`높음 등급 리스크는 없고, 중간 이하 리스크 ${R.risks.length}건을 로드맵에 따라 단계적으로 관리하면 돼요.`:'두드러진 리스크는 없어요.'}
    증빙 신뢰도는 ${R.evidence}점으로 ${evTxt}. ${R.proj[4]>R.overall?`제안 로드맵을 계획대로 실행하면 <b>12개월 후 약 ${R.proj[4]}점(Level ${lvl12+1} · ${LEVELS[lvl12][1]})</b>까지 올라갈 수 있어요.`:`지금 수준을 유지하면서 외부 검증·인증으로 대외 신뢰도를 높이는 단계예요.`}`;
  const top3=R.P[0].slice(0,3).map((it,i)=>`<div class="act"><span class="n num">${i+1}</span><div><div class="tiny" style="font-weight:600;color:var(--primary)">목표 모습</div><h3>${esc(it.q.o[it.to])}</h3>
      <div class="from">지금: ${esc(it.a.v==='u'?'현재 상태 모름':it.q.o[it.a.v])}</div>
      <div class="tags" style="margin-top:6px"><span class="tag">${DOMS[it.q.d]}</span><span class="tag">담당 ${OWNER[it.q.d]}</span><span class="tag">산출물: ${esc(it.q.doc)}</span></div></div></div>`).join('');

  /* 02 영역 */
  const domRows=ks.map((k,i)=>{ const v=R.dom[k]; if(v==null) return ''; const t=tone(v);
    return `<div class="domrow"><div class="nm"><span class="dot d-${t}"></span><span>${DOMS[k]}</span><span class="tiny">가중 ${R.w[i]}%</span></div>
      <div style="display:flex;gap:8px;align-items:center"><span class="pill p-${t}">${toneTxt[t]}</span><b class="num" style="min-width:2.2em;text-align:right">${v}</b></div>
      <div class="bar"><i class="${t}" style="width:${Math.max(v,3)}%"></i><em style="left:calc(${R.projDom[k]}% - 1px)" title="12개월 목표"></em></div></div>`; }).join('');

  /* 03 매트릭스 해석 */
  const quad=k=>R.expo[k]>=50?(R.dom[k]<50?'즉시 대응':'강점 · 대외 활용'):(R.dom[k]<50?'기본 정비':'현 수준 유지');
  const urgent=ksv.filter(k=>quad(k)==='즉시 대응');
  const quadTbl=`<div class="tbl"><table><thead><tr><th>영역</th><th>준비도</th><th>외부 노출</th><th>구분</th><th>노출 원인</th></tr></thead><tbody>
    ${ksv.map(k=>`<tr><td><b>${k}</b> ${DSHORT[k]}</td><td class="num">${R.dom[k]}</td><td class="num">${R.expo[k]}</td><td><span class="pill ${quad(k)==='즉시 대응'?'p-bad':quad(k)==='기본 정비'?'p-warn':'p-good'}">${quad(k)}</span></td>
      <td>${R.expoTags[k].length?R.expoTags[k].map(x=>TRIG_LABEL[x]).join(', '):'업종 가중치 기준'}</td></tr>`).join('')}</tbody></table></div>`;

  /* 04 영역별 해석 */
  const interp=ksv.map(k=>{
    const v=R.dom[k], t=tone(v);
    const qs=Object.entries(A).filter(([id,a])=>QI[id].d===k);
    const num=qs.filter(([,a])=>typeof a.v==='number'||a.v==='u').map(([id,a])=>({q:QI[id],v:a.v==='u'?0.5:a.v,a}));
    const best=num.slice().sort((x,y)=>y.v-x.v)[0], worst=num.slice().sort((x,y)=>x.v-y.v)[0];
    let txt=t==='good'?`운영 체계가 갖춰진 강점 영역이에요. 지금 자료를 외부 제출용으로 정리하면 고객사·지원사업 평가에 바로 쓸 수 있어요.`
      :t==='warn'?(best&&worst&&best.v>worst.v?`기본 활동은 있지만 기록과 체계가 부족해요. '${best.q.s}' 항목은 앞서 있고, '${worst.q.s}' 항목을 먼저 끌어올려야 해요.`:`기본 활동은 있지만 기록과 체계가 부족해요. 문항 수준이 비슷해서 증빙이 필요한 항목부터 '관리' 수준으로 올리는 게 효과적이에요.`)
      :`아직 관리가 시작되지 않은 영역이에요. '${worst?worst.q.s:''}' 항목부터 기록이 남는 수준으로 바꾸는 게 가장 빠른 개선이에요.`;
    if(R.expo[k]>=60) txt+=` ${R.expoTags[k].length?R.expoTags[k].map(x=>TRIG_LABEL[x]).join('·')+' 때문에 ':''}외부 요구가 큰 영역이라 우선순위가 높아요.`;
    const lines=qs.map(([id,a])=>{ const q=QI[id];
      const lv=a.v==='na'?'해당없음':a.v==='u'?'모름':LV_OPT[a.v];
      const n=typeof a.v==='number'?a.v:-1;
      return `<div class="qline"><span>${esc(q.s)}${a.auto?` <span class="tiny">(${a.auto.includes('추정')?'추정':'자동'})</span>`:''}</span><span class="cells" aria-hidden="true">${[0,1,2,3].map(j=>`<i class="${j<=n?'on':''}"></i>`).join('')}</span><span class="lv">${lv}</span></div>`; }).join('');
    return `<section class="card icard"><h3><span>${k}. ${DOMS[k]}</span><span style="display:flex;gap:6px;align-items:center"><span class="pill p-${t}">${toneTxt[t]}</span><b class="num">${v}</b></span></h3>
      <div class="tags">${R.expoTags[k].map(x=>`<span class="tag hot">${TRIG_LABEL[x]}</span>`).join('')}<span class="tag">가중 ${R.w[ks.indexOf(k)]}%</span><span class="tag">12개월 목표 ${R.projDom[k]}점</span></div>
      <p>${esc(txt)}</p><div style="display:flex;flex-direction:column;gap:6px">${lines}</div></section>`;
  }).join('');

  /* 05 리스크 */
  const cellCls=(L,I)=>({'높음':'c3','중간':'c2','낮음':'c1'})[gradeOf(L,L*I)];
  const heat=`<div class="heat" role="img" aria-label="리스크 히트맵: 가능성과 영향도">
    ${[3,2,1].map(I=>`<div class="ax">${['','낮음','중간','높음'][I]}<br><span class="tiny">영향</span></div>${[1,2,3].map(L=>`<div class="cell ${cellCls(L,I)}">${R.risks.filter(r=>r.L===L&&r.I===I).map(r=>`<span class="rk" title="${esc(r.n)}">${r.id}</span>`).join('')}</div>`).join('')}`).join('')}
    <div></div>${['낮음','중간','높음'].map(x=>`<div class="ax">가능성 ${x}</div>`).join('')}</div>`;
  const riskRows=R.risks.map(r=>{ const wa=A[r.wq]; const ph=R.phaseOf[r.wq];
    return `<tr><td><span class="pill ${r.grade==='높음'?'p-bad':r.grade==='중간'?'p-warn':'p-good'}">${r.grade}</span></td>
      <td><b>${r.id} ${esc(r.n)}</b><span class="sub">${esc(r.d)}</span><span class="sub ref-line">근거: ${esc(r.ref)}</span></td>
      <td>${esc(QI[r.wq].s)}<span class="sub">지금: ${esc(wa.v==='u'?'현재 상태 모름':QI[r.wq].o[wa.v])}</span></td>
      <td>${r.area}</td><td class="num">${r.L}×${r.I}=${r.S}</td>
      <td>${esc(r.m)}<span class="sub">${ph!=null?PHASES[ph].t.split(' · ')[0]+' · '+PHASES[ph].when:'12개월 이후'}</span></td></tr>`; }).join('');

  /* 06 준비 서류 */
  const docs=Object.entries(A).filter(([,a])=>a.v!=='na').map(([id,a])=>{ const q=QI[id];
    const st=typeof a.v==='number'&&a.v>=2?'보유':a.v===1?'보완 필요':'미보유';
    return {q,st,ph:R.phaseOf[id]}; });
  docs.splice(docs.findIndex(x=>x.q.id==='B1')+1,0,{q:{d:'B',doc:'전기 사용량(kWh) 데이터',s:'전기 사용량'},st:R.kd.q==='실측'?'보유':R.kd.q==='추정'?'보완 필요':'미보유',ph:R.kd.q==='실측'?null:0});
  const cnt={보유:0,'보완 필요':0,미보유:0}; docs.forEach(d=>cnt[d.st]++);
  const tot=docs.length;
  const stCls={보유:'p-good','보완 필요':'p-warn',미보유:'p-bad'};
  const docRows=docs.map(d=>`<tr><td>${d.q.d}. ${DSHORT[d.q.d]}</td><td><b>${esc(d.q.doc)}</b><span class="sub">관련 문항: ${esc(d.q.s)}</span></td>
    <td><span class="pill ${stCls[d.st]}">${d.st}</span></td><td>${d.st==='보유'?'유지·최신화':d.ph!=null?PHASES[d.ph].when:'12개월 이후'}</td></tr>`).join('');

  /* 07 로드맵 */
  const qwItem=R.kd.q!=='실측'?`<li><b>최근 3개월 전기 고지서의 kWh를 표 한 장에 옮겨 적기</b><div class="meta"><span class="tag">환경·에너지</span><span class="tag">담당 총무·생산</span><span class="tag">10분 Quick Win</span></div></li>`:'';
  const phases=PHASES.map((ph,pi)=>{ const items=R.P[pi];
    const extra=pi===3&&(!A.F3||A.F3.v!=='na')?`<li><b>고객사 ESG 질의서 모의 응답, 지원사업 ESG 가점 서류 제출</b><div class="meta"><span class="tag">자료·기록</span><span class="tag">담당 경영지원</span></div></li>`:'';
    return `<section class="card phase ${ph.k}"><h3><span>${ph.t}</span><span class="tiny">${ph.when}</span></h3>
      <p class="goal">${ph.goal}</p>
      <div style="display:flex;justify-content:space-between;font-size:12.5px"><span class="tiny">완료 시 예상 점수</span><b class="num">${R.proj[pi]} → ${R.proj[pi+1]}점</b></div>
      <ul>${pi===0?qwItem:''}${items.map(it=>`<li><b>${esc(it.q.o[it.to])}</b><div class="meta"><span class="tag">${DSHORT[it.q.d]}</span><span class="tag">담당 ${OWNER[it.q.d]}</span><span class="tag">산출물: ${esc(it.q.doc)}</span></div></li>`).join('')||'<li class="tiny">해당 과제 없음 · 현 수준 유지</li>'}${extra}</ul></section>`; }).join('');

  const lvOf=v=>LEVELS.reduce((acc,l,i)=>v>=l[0]?i:acc,0);
  const projTbl=`<div class="tbl"><table style="min-width:0"><thead><tr><th>시점</th><th>예상 점수</th><th>Level</th></tr></thead><tbody>${['현재','1개월 · Phase 1','3개월 · Phase 2','6개월 · Phase 3','12개월 · Phase 4'].map((t,i)=>`<tr><td>${t}</td><td class="num"><b>${R.proj[i]}</b>${i?` <span class="tiny">+${R.proj[i]-R.proj[i-1]}</span>`:''}</td><td>${LEVELS[lvOf(R.proj[i])][1]}</td></tr>`).join('')}</tbody></table></div>`;
  const kTag={'실측':'고지서 실측','추정':`요금 기반 추정 ±${ERR*100}%`,'미확보':'미확보'}[R.kd.q];
  const fmt=v=>v<10?v.toFixed(1):Math.round(v).toLocaleString();
  const tTxt=R.tco2==null?'':(R.kd.q==='추정'?`${fmt(R.tco2*(1-ERR))}~${fmt(R.tco2*(1+ERR))}`:fmt(R.tco2));

  const today=new Date();
  app.innerHTML=`
  <div class="print-only"><div class="ph"><img src="logo-mark.png" alt=""><div><b>BECONIC ESG 경영준비도 진단 리포트</b><div class="tiny">${esc(name)} · ${esc(S.p.industry)} · ${esc(S.p.size)} · 진단일 ${today.getFullYear()}.${today.getMonth()+1}.${today.getDate()} · ${APP_VERSION} (업데이트 ${APP_UPDATED})</div></div></div></div>
  ${S.sample?`<div class="flag" style="background:var(--primary-soft)"><span><b style="color:var(--primary)">예시 리포트</b> 가상의 제조기업(10~49인, 대기업 납품) 응답으로 만든 화면이에요. 실제 진단은 '진단 시작하기'에서 해보세요.</span></div>`:''}
  <section class="card">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap">
      <div class="eyebrow">ESG 실행 준비도 진단 리포트 · ${esc(name)} · ${esc(S.p.industry)} · ${esc(S.p.size)}</div>
      <span class="status ${R.provisional?'p-warn':'p-good'}">${R.provisional?`잠정 · ${dueTxt}까지 보완`:'확정'}</span></div>
    <div class="cover" style="margin-top:16px">
      <div class="ring" role="img" aria-label="ESG 준비도 ${R.overall}점">
        <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" style="fill:none;stroke:var(--line);stroke-width:10"/>
        <circle cx="60" cy="60" r="52" style="fill:none;stroke:var(--primary);stroke-width:10;stroke-linecap:round" stroke-dasharray="${2*Math.PI*52}" stroke-dashoffset="${2*Math.PI*52*(1-R.overall/100)}"/></svg>
        <div class="v"><div><b class="num">${R.overall}</b><small>/ 100</small></div></div>
      </div>
      <div style="min-width:0">
        <span class="lvl">Level ${R.level+1} · ${LEVELS[R.level][1]}</span>
        <p style="margin:10px 0 0;font-size:15px">12개월 로드맵 실행 시 <b class="num">${R.proj[4]}점</b> · Level ${lvl12+1} ${LEVELS[lvl12][1]} 예상</p>
        <div class="lvl-ladder" aria-hidden="true">${LEVELS.map((l,i)=>`<div class="${i===R.level?'on':i===lvl12&&lvl12!==R.level?'goal':''}">${l[1]}</div>`).join('')}</div>
      </div>
    </div>
  </section>
  <nav class="rep-nav" aria-label="리포트 목차">${[['s1','요약'],['s2','영역 진단'],['s3','노출 매트릭스'],['s4','영역별 해석'],['s5','리스크'],['s6','준비 서류'],['s7','로드맵'],['s8','방법론·출처']].map(([id,t])=>`<button data-jump="${id}">${t}</button>`).join('')}</nav>

  <div class="rsec" id="s1">
    <h2 class="sh"><span>01</span>진단 요약</h2>
    <section class="card"><p class="summary">${summary}</p></section>
    <div class="kpis">
      <div class="kpi"><b class="num">${R.overall}<span style="font-size:13px;color:var(--ink-3)"> → ${R.proj[4]}</span></b><span>준비도 (현재 → 12개월)</span></div>
      <div class="kpi"><b class="num" style="color:var(--${tone(R.evidence)})">${R.evidence}</b><span>증빙 신뢰도</span></div>
      <div class="kpi"><b class="num" style="color:var(--${hiRisk.length?'bad':'good'})">${hiRisk.length}<span style="font-size:13px;color:var(--ink-3)"> / ${R.risks.length}</span></b><span>높음 리스크 / 전체</span></div>
      <div class="kpi"><b class="s" style="color:var(--${R.carbonTone})">${R.carbon}</b><span>탄소 데이터 준비</span></div>
    </div>
    ${R.flags.map(f=>`<div class="flag"><span><b>${f[0]}</b> ${esc(f[1])}</span></div>`).join('')}
    ${R.provisional?`<section class="card" style="display:flex;flex-direction:column;gap:10px;border-color:var(--warn)">
      <b style="font-size:15.5px">숫자 1개만 보완하면 리포트가 확정돼요</b>
      <p class="tiny" style="margin:0">${S.k1.none==='delegate'?'담당자 입력을 기다리는 중이에요. ':''}${dueTxt}까지 전기 사용량(kWh)을 넣으면 탄소 데이터 준비도와 증빙 신뢰도를 다시 계산해요.</p>
      <div class="kwh field"><input id="fixKwh" type="number" inputmode="numeric" min="0" placeholder="예: 3200" aria-label="전기 사용량 kWh 보완 입력"><span>kWh</span></div>
      <button class="btn" id="fixBtn">반영하고 확정하기</button></section>`:''}
    <section class="card"><div class="eyebrow" style="margin-bottom:6px">이번 주에 시작할 3가지</div>
      ${R.kd.q!=='실측'?`<div class="qw" style="margin-bottom:10px"><b class="num">10분</b><span><b>Quick Win</b> · 최근 3개월 전기 고지서의 kWh를 표 한 장에 옮겨 적기</span></div>`:''}
      ${top3||`<p class="tiny">${R.P[2].length||R.P[3].length?'관리 수준 미만 과제가 없어요. 로드맵의 Phase 3부터 진행하세요.':'모든 문항이 체계 수준이에요. 정기 업데이트와 외부 검증으로 유지하세요.'}</p>`}</section>
  </div>

  <div class="rsec" id="s2">
    <h2 class="sh"><span>02</span>영역별 준비도</h2>
    <p class="lead">파란 면이 현재, 초록 점선이 12개월 로드맵 완료 시 예상 수준이에요. ${esc(S.p.industry)} 업종 기준으로 영역별 가중치를 다르게 적용했어요.</p>
    <section class="card two wide-l">
      <div>${radarSVG(R.dom,R.projDom)}<div class="legend" style="justify-content:center"><span><i style="background:var(--primary)"></i>현재</span><span><i style="background:var(--good)"></i>12개월 목표</span></div></div>
      <div>${domRows}<p class="tiny" style="margin:10px 0 0">막대 위 세로선 = 12개월 목표 점수</p></div>
    </section>
  </div>

  <div class="rsec" id="s3">
    <h2 class="sh"><span>03</span>외부 요구 노출 × 준비도</h2>
    <p class="lead">외부에서 요구가 많은데 준비가 덜 된 영역(왼쪽 위)이 가장 먼저 손봐야 할 곳이에요. ${urgent.length?`현재 <b>${urgent.map(k=>DSHORT[k]).join('·')}</b> 영역이 즉시 대응 구간에 있어요.`:'즉시 대응 구간에 있는 영역은 없어요.'}</p>
    <section class="card two"><div>${matrixSVG(R.dom,R.expo)}</div><div style="min-width:0">${quadTbl}</div></section>
  </div>

  <div class="rsec" id="s4">
    <h2 class="sh"><span>04</span>영역별 진단 해석</h2>
    <p class="lead">문항별 막대는 '미흡 → 초기 → 관리 → 체계' 4단계 중 현재 위치예요. 관리(3칸) 이상이면 증빙이 있는 상태로 봐요.</p>
    <div class="interp">${interp}</div>
  </div>

  <div class="rsec" id="s5">
    <h2 class="sh"><span>05</span>리스크 진단</h2>
    <p class="lead">응답에서 확인된 관리 공백을 리스크로 바꿨어요. 가능성은 응답 수준과 노출 신호로, 영향도는 리스크 특성으로 매겨요. ${R.risks.length?`높음 ${hiRisk.length}건, 중간 ${R.risks.filter(r=>r.grade==='중간').length}건이에요.`:''}</p>
    ${R.risks.length?`<section class="card two"><div>${heat}</div>
      <div style="display:flex;flex-direction:column;gap:8px">${R.risks.slice(0,4).map(r=>`<div style="display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start"><span class="rk pill ${r.grade==='높음'?'p-bad':r.grade==='중간'?'p-warn':'p-good'}">${r.id}</span><div><b style="font-size:14px">${esc(r.n)}</b><div class="tiny">${esc(r.d)}</div></div></div>`).join('')}</div></section>
    <div class="tbl"><table><thead><tr><th>등급</th><th>리스크</th><th>원인 (관련 응답)</th><th>영향 영역</th><th>가능성×영향</th><th>대응 방향 · 시점</th></tr></thead><tbody>${riskRows}</tbody></table></div>`
    :'<section class="card"><p class="tiny" style="margin:0">응답 기준으로 활성화된 리스크가 없어요.</p></section>'}
  </div>

  <div class="rsec" id="s6">
    <h2 class="sh"><span>06</span>준비 서류 체크리스트</h2>
    <p class="lead">고객사 실사·지원사업·인증 심사에서 요구되는 서류 기준이에요. 응답에서 '관리' 이상이면 보유로 봐요.</p>
    <section class="card" style="display:flex;flex-direction:column;gap:10px">
      <div class="stack" role="img" aria-label="서류 보유 ${cnt['보유']}건, 보완 ${cnt['보완 필요']}건, 미보유 ${cnt['미보유']}건">
        <i style="width:${cnt['보유']/tot*100}%;background:var(--good)"></i><i style="width:${cnt['보완 필요']/tot*100}%;background:var(--warn)"></i><i style="width:${cnt['미보유']/tot*100}%;background:var(--bad)"></i></div>
      <div class="legend"><span><i style="background:var(--good)"></i>보유 ${cnt['보유']}</span><span><i style="background:var(--warn)"></i>보완 필요 ${cnt['보완 필요']}</span><span><i style="background:var(--bad)"></i>미보유 ${cnt['미보유']}</span><span class="tiny">총 ${tot}종 · 확보율 ${Math.round(cnt['보유']/tot*100)}%</span></div>
    </section>
    <div class="tbl"><table><thead><tr><th>영역</th><th>준비 서류</th><th>상태</th><th>확보 시점</th></tr></thead><tbody>${docRows}</tbody></table></div>
  </div>

  <div class="rsec" id="s7">
    <h2 class="sh"><span>07</span>12개월 실행 로드맵</h2>
    <p class="lead">리스크가 크고 외부 노출이 높은 과제부터 배치했어요. 각 과제의 목표는 응답 보기의 다음 단계 모습 그대로라, 완료 여부를 바로 판단할 수 있어요.</p>
    <section class="card two"><div style="max-width:380px;width:100%;justify-self:center">${projSVG(R.proj)}</div><div style="min-width:0">${projTbl}<p class="tiny" style="margin:8px 0 0">단계별 과제를 계획대로 완료한다고 가정한 추정치이며 보장값이 아니에요. 점선은 준비도 Level 경계예요.${R.later.length?` 12개월 이후 지속 개선 과제 ${R.later.length}건(${R.later.map(it=>it.q.s).join(', ')})은 전망에서 제외했어요.`:''}</p></div></section>
    <div class="phases">${phases}</div>
    <section class="card" style="display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:14.5px">참고 탄소량 · 전력(Scope 2)</b><span class="qtag">${kTag}</span></div>
      ${R.tco2!=null?`<div><b class="num" style="font-size:24px">약 ${tTxt}</b> <span class="muted">tCO₂e / 년</span></div>
      <div class="tiny">월 ${R.kd.kwh.toLocaleString()} kWh × 12개월 × 배출계수 ${EF} tCO₂e/MWh${R.kd.q==='추정'?` · 요금 ÷ 실효단가 ${PRICE[R.kd.contract]}원/kWh(${R.kd.contract==='gap'?'산업용 갑':'산업용 을'}${R.kd.assumed?', 직원 수로 추정':''})로 역산`:''} · 배출계수는 GIR 최신 승인값. 공식 배출량 산정이 아닌 참고값이에요.</div>`
      :`<div class="tiny">전기 사용량을 넣으면 연간 참고 탄소량을 보여드려요. 요금 구간만 알아도 추정할 수 있어요.</div>`}
    </section>
  </div>

  <div class="rsec" id="s8">
    <h2 class="sh"><span>08</span>진단 방법론 & 참고 기준</h2>
    <section class="card" style="display:flex;flex-direction:column;gap:12px">
      <p style="margin:0;font-size:14px;line-height:1.75;color:var(--ink-2)">본 진단은 국내 K-ESG 가이드라인 v2.0과 공급망 대응 K-ESG 가이드라인, EFRAG VSME, IFRS S1·S2, GHG Protocol, GRI, OECD·UN·ILO 원칙, ISO 14001/45001/26000/37001, EU CBAM 등 <b>공개된 방법론과 평가 철학을 교차 참조</b>해 설계했어요. 특정 평가기관의 문항·점수 알고리즘·등급 체계를 복제하지 않아요.
      모든 점수는 응답에 대한 <b>고정된 계산식(deterministic)</b>으로 산출되며, AI가 점수를 임의로 정하지 않아요.</p>
      <details class="fold"><summary>산출 방식 보기 · 7개 구성 요소</summary>
      <div class="tbl" style="margin-top:10px"><table style="min-width:520px"><thead><tr><th>구성 요소</th><th>산출 방식</th></tr></thead><tbody>
        <tr><td>문항 점수</td><td>행동기반 4단계 보기 · 미흡 0 / 초기 33 / 관리 67 / 체계 100 · 잘 모르겠어요 20 · 해당 없음은 제외</td></tr>
        <tr><td>영역·종합 점수</td><td>영역 내 문항 평균 → 업종별 중대성 가중치(${esc(S.p.industry)}: ${R.w.join('/')})로 가중 평균</td></tr>
        <tr><td>증빙 신뢰도</td><td>증빙 판정 문항 중 '관리' 이상 비율 + 전기 사용량 데이터 품질(실측 1.0 · 추정 0.5 · 미확보 0)</td></tr>
        <tr><td>외부 요구 노출</td><td>업종 가중치 × 2.5 + 노출 신호(납품·수출·제조·투자·개인정보)당 15점, 최대 100</td></tr>
        <tr><td>리스크 등급</td><td>가능성(응답 수준 + 노출 신호, 1~3) × 영향도(리스크 고유값, 1~3) · 9 이상 또는 6 이상이면서 가능성 3이면 높음 / 4 이상 중간 / 그 외 낮음</td></tr>
        <tr><td>로드맵·점수 전망</td><td>관리 미만 과제를 리스크·노출 순으로 먼저, 체계 전환 과제를 나중에 배치 · Phase별 최대 4/6/6/5개(중소기업 실행 용량), 넘치면 12개월 이후 · 완료 가정 시 같은 계산식으로 재산출</td></tr>
        <tr><td>참고 탄소량</td><td>월 kWh × 12 × 배출계수 ${EF} tCO₂e/MWh · 요금 추정은 실효단가(갑 ${PRICE.gap} / 을 ${PRICE.eul}원/kWh)로 역산</td></tr>
      </tbody></table></div>
      </details>
    </section>
    <details class="ref card"><summary>참조 기준 보기 · 문항별 기준과 기준·자료 ${REFS.length}종</summary><div style="display:flex;flex-direction:column;gap:12px;margin-top:12px">
      <div style="display:flex;flex-wrap:wrap;gap:6px">${REFS.map(r=>`<span class="tag" title="${esc(r[1])}">${esc(r[0])}</span>`).join('')}</div>
    <div class="tbl"><table><thead><tr><th>문항</th><th>영역</th><th>참조 기준</th></tr></thead><tbody>
      ${Q.filter(q=>q.kind||A[q.id]).map(q=>`<tr><td><b>${q.kind?'K1 전기 사용량':q.id+' '+esc(q.s)}</b></td><td>${DSHORT[q.d]}</td><td>${esc(q.r.join(' · '))}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="tbl"><table><thead><tr><th>기준·자료</th><th>발행</th><th>구분</th></tr></thead><tbody>
      ${REFS.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${r[2]}</td></tr>`).join('')}
    </tbody></table></div>
    </div></details>
  </div>

  <section class="card" style="display:flex;flex-direction:column;gap:10px">
    <b style="font-size:15px">추천 후속 BECONIC 진단</b>
    <div class="tools">${recommendTools(R).map(([k,why])=>`<a class="tool" href="${TOOLS[k][1]}" target="_blank" rel="noopener"><b>${TOOLS[k][0]}</b><span>${why}</span></a>`).join('')}</div>
    ${R.deep.length?`<p class="tiny" style="margin:0">50점 미만 영역(${R.deep.map(k=>DSHORT[k]).join('·')})은 컨설턴트 상담 때 영역별 심화 질문 3~4개와 증빙 확인으로 정밀 진단해요.</p>`:''}
  </section>

  <section class="card cta">
    <b style="font-size:16.5px">이 리포트로 전문가와 실행계획을 확정하세요</b>
    <p>BECONIC 컨설턴트가 리스크별 대응, 서류 준비, 지원사업 연계까지 로드맵을 함께 정리해 드려요.</p>
    <div class="tel"><b class="num">${COMPANY.tel}</b><button id="copy">번호 복사</button></div>
    <p style="margin:10px 0 0;font-size:13px">이메일 <a href="mailto:${COMPANY.mail}?subject=${encodeURIComponent('ESG 진단 결과 상담 요청')}" style="color:inherit">${COMPANY.mail}</a> · ${COMPANY.web}</p>
  </section>
  <div class="row"><button class="btn" id="pdf">PDF 저장·인쇄</button><button class="btn btn-ghost" id="edit">응답 수정</button><button class="btn btn-ghost" id="again">처음부터 다시</button></div>
  <p class="disc">본 리포트는 공식 ESG 평가등급·인증이 아닌 실행 준비도 자가진단이며, 법률·노무·회계 자문을 대신하지 않아요. 문항 설계는 K-ESG 가이드라인 v2.0 범주를 참고했고, 리스크 등급과 점수 전망은 응답 기반 추정이에요.</p>`;

  app.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.jump).scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}));
  document.getElementById('pdf').onclick=()=>window.print();
  const fb=document.getElementById('fixBtn');
  if(fb) fb.onclick=()=>{ const v=+document.getElementById('fixKwh').value; if(!(v>0)||v>KWH_MAX){ toast(`kWh는 1~${KWH_MAX.toLocaleString()} 사이 숫자로 넣어 주세요`); return; }
    S.k1={mode:'exact',kwh:String(v),bill:-1,none:'',contract:'auto'}; rResult(); window.scrollTo({top:0}); toast('반영했어요. 리포트가 확정됐어요'); };
  document.getElementById('copy').onclick=()=>copyText(COMPANY.tel,'번호를 복사했어요');
  document.getElementById('edit').onclick=()=>{ S.idx=0; go('quiz'); };
  document.getElementById('again').onclick=()=>{ if(!S.sample) clearSaved(); S=blank(); go('start'); };
}

document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{
  const sc=b.dataset.go;
  if(location.hash) history.replaceState(null,'',location.pathname+location.search);
  if(sc==='quiz'&&!profileOk()){ toast('기업정보를 먼저 입력해 주세요'); go('profile'); return; }
  go(sc);
});
/* 인쇄: 접힌 산출 방식표(.fold)는 펼쳐서 인쇄하고, 끝나면 원래 상태로 */
window.addEventListener('beforeprint',()=>document.querySelectorAll('details.fold').forEach(d=>{ d.dataset.wasOpen=d.open?'1':''; d.open=true; }));
window.addEventListener('afterprint',()=>document.querySelectorAll('details.fold').forEach(d=>{ d.open=d.dataset.wasOpen==='1'; }));
document.getElementById('foot').innerHTML=`<div class="fb"><img src="logo-mark.png" alt=""><span><b>${COMPANY.brand}</b> by Growth Ventures</span></div>
  <div>${COMPANY.addr} · 전화 ${COMPANY.tel} · 이메일 <a href="mailto:${COMPANY.mail}">${COMPANY.mail}</a> · <a href="https://${COMPANY.web}" target="_blank" rel="noopener">${COMPANY.web}</a></div>
  <div>${COMPANY.cert}</div><div>${APP_VERSION} · 업데이트 ${APP_UPDATED} · ${COMPANY.copy}</div>`;
document.getElementById('homeBtn').onclick=()=>{ if(location.hash) history.replaceState(null,'',location.pathname+location.search); if(S.sample) S=blank(); go('start'); };
window.ESG={Q,QI,RISKS,PHASES,W,COMPANY,APP_VERSION,LS_KEY,analyze,core,flow,triggers,gradeOf,recommendTools,get S(){return S;},set S(x){S=x;}};
if(location.hash==='#kwh-request') rDelegate(); else render();
})();

</script>
</body>
</html>
